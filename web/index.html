<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDEN BI Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316130f'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23d3ae66' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#16130f}
  .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#d3ae66;font:600 13px/1.4 Georgia,serif;letter-spacing:.3em;text-transform:uppercase}
  .boot b{font-size:34px;letter-spacing:.35em;color:#fff;font-weight:700}
  .boot i{width:120px;height:2px;background:linear-gradient(90deg,transparent,#d3ae66,transparent);animation:edenBar 1.2s ease-in-out infinite}
  @keyframes edenBar{0%{opacity:.2;transform:scaleX(.3)}50%{opacity:1;transform:scaleX(1)}100%{opacity:.2;transform:scaleX(.3)}}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div class="boot" id="boot"><b>EDEN</b>Business Intelligence<i></i></div>
<script>
/* EDEN BI — custom-domain loader
   Loads the dashboard page from Apps Script and runs it here, so it never
   depends on the visitor's Google sign-in. Server calls go to the same
   Apps Script web app as a small JSON API (see Api.js). */
(function () {
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwiiwJuFH4nopIhra_uSZjCIrH4_W5WaQWZ94fD0FBiXXZnxp6Y-u8976ij-QALXXHj/exec';

  // google.script.run stand-in: same chaining API, calls the JSON API.
  var SHIM = '(' + function (API) {
    function call(fn, args) {
      return fetch(API, {
        method: 'POST',
        credentials: 'omit',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args })
      }).then(function (r) {
        if (!r.ok) throw new Error('Server error ' + r.status);
        return r.json();
      }).then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || 'Request failed');
        if (!j.chunked) return j.result;
        var reqs = [];
        for (var i = 0; i < j.parts; i++) {
          reqs.push(fetch(API + '?view=chunk&id=' + encodeURIComponent(j.chunked) + '&i=' + i, { credentials: 'omit', redirect: 'follow' })
            .then(function (r) { return r.json(); })
            .then(function (c) { if (typeof c.data !== 'string') throw new Error(c.error || 'Missing data'); return c.data; }));
        }
        return Promise.all(reqs).then(function (parts) { return JSON.parse(parts.join('')); });
      });
    }
    function runner(ok, fail, user) {
      return new Proxy({}, {
        get: function (_, key) {
          if (key === 'withSuccessHandler') return function (h) { return runner(h, fail, user); };
          if (key === 'withFailureHandler') return function (h) { return runner(ok, h, user); };
          if (key === 'withUserObject') return function (u) { return runner(ok, fail, u); };
          if (typeof key !== 'string') return undefined;
          return function () {
            var args = Array.prototype.slice.call(arguments);
            call(key, args).then(
              function (res) { if (ok) ok(res, user); },
              function (err) { if (fail) fail(err, user); else console.error(err); }
            );
          };
        }
      });
    }
    window.google = window.google || {};
    window.google.script = { run: runner(null, null, null), host: { close: function () {}, setHeight: function () {}, setWidth: function () {} } };
  } + ')(' + JSON.stringify(APP_URL) + ');';

  // If the API is not available, open the app directly (never inside an
  // iframe, where Google shows "unable to open the file" for multi-account browsers).
  function startIframe() {
    location.replace(APP_URL);
  }

  function getJson(url) {
    return fetch(url, { credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.text(); })
      .then(function (t) { return JSON.parse(t); });
  }

  getJson(APP_URL + '?view=raw')
    .then(function (first) {
      if (!first || typeof first.html !== 'string') throw new Error('No page');
      var reqs = [Promise.resolve(first.html)];
      for (var i = 1; i < (first.parts || 1); i++) {
        reqs.push(getJson(APP_URL + '?view=chunk&id=' + encodeURIComponent(first.id) + '&i=' + i)
          .then(function (c) { if (typeof c.data !== 'string') throw new Error('Missing part'); return c.data; }));
      }
      return Promise.all(reqs);
    })
    .then(function (parts) {
      var html = parts.join('').replace(/<head([^>]*)>/i, function (m) {
        var icon = document.querySelector('link[rel="icon"]');
        return m + (icon ? icon.outerHTML : '') + '<script>' + SHIM + '<\/script>';
      });
      document.open();
      document.write(html);
      document.close();
    })
    .catch(startIframe);
})();
</script>
</body>
</html>
