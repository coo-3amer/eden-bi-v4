<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDEN BI Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316130f'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23d3ae66' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#16130f}
  .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#d3ae66;font:600 13px/1.4 Georgia,serif;letter-spacing:.3em;text-transform:uppercase}
  .boot b{font-size:34px;letter-spacing:.35em;color:#fff;font-weight:700}
  .boot i{width:120px;height:2px;background:linear-gradient(90deg,transparent,#d3ae66,transparent);animation:edenBar 1.2s ease-in-out infinite}
  @keyframes edenBar{0%{opacity:.2;transform:scaleX(.3)}50%{opacity:1;transform:scaleX(1)}100%{opacity:.2;transform:scaleX(.3)}}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div class="boot" id="boot"><b>EDEN</b>Business Intelligence<i></i></div>
<script>
/* EDEN BI — custom-domain loader
   Loads the dashboard page from Apps Script and runs it here, so it never
   depends on the visitor's Google sign-in. Server calls go to the same
   Apps Script web app as a small JSON API (see Api.js). */
(function () {
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwiiwJuFH4nopIhra_uSZjCIrH4_W5WaQWZ94fD0FBiXXZnxp6Y-u8976ij-QALXXHj/exec';

  // google.script.run stand-in: same chaining API, calls the JSON API.
  var SHIM = '(' + function (API) {
    function call(fn, args) {
      var json = JSON.stringify({ fn: fn, args: args });
      var b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      var url = API + '?view=call&q=' + b64 + '&_=' + Date.now() + Math.random().toString(36).slice(2, 7);
      return fetch(url, { credentials: 'omit', redirect: 'follow', cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('Server error ' + r.status);
        return r.json();
      }).then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || 'Request failed');
        if (!j.chunked) return j.result;
        var reqs = [];
        for (var i = 0; i < j.parts; i++) {
          reqs.push(fetch(API + '?view=chunk&id=' + encodeURIComponent(j.chunked) + '&i=' + i, { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (c) { if (typeof c.data !== 'string') throw new Error(c.error || 'Missing data'); return c.data; }));
        }
        return Promise.all(reqs).then(function (parts) { return JSON.parse(parts.join('')); });
      });
    }
    function runner(ok, fail, user) {
      return new Proxy({}, {
        get: function (_, key) {
          if (key === 'withSuccessHandler') return function (h) { return runner(h, fail, user); };
          if (key === 'withFailureHandler') return function (h) { return runner(ok, h, user); };
          if (key === 'withUserObject') return function (u) { return runner(ok, fail, u); };
          if (typeof key !== 'string') return undefined;
          return function () {
            var args = Array.prototype.slice.call(arguments);
            call(key, args).then(
              function (res) { if (ok) ok(res, user); },
              function (err) { if (fail) fail(err, user); else console.error(err); }
            );
          };
        }
      });
    }
    window.google = window.google || {};
    window.google.script = { run: runner(null, null, null), host: { close: function () {}, setHeight: function () {}, setWidth: function () {} } };
  } + ')(' + JSON.stringify(APP_URL) + ');';

  // Never send the visitor to script.google.com (multi-account browsers fail
  // there); show what went wrong and let them retry.
  function startIframe(err) {
    var box = document.getElementById('boot');
    box.innerHTML = '<b>EDEN</b>Could not load the dashboard' +
      '<span style="font:12px/1.5 Arial,sans-serif;letter-spacing:0;text-transform:none;color:#a99f90;max-width:520px;text-align:center">' +
      String((err && err.message) || err || 'Unknown error').replace(/[<>&]/g, '') + '</span>' +
      '<button type="button" style="all:unset;cursor:pointer;margin-top:8px;padding:10px 18px;border-radius:10px;background:#d3ae66;color:#16130f;font:700 12px Arial,sans-serif;letter-spacing:.1em" onclick="location.reload()">TRY AGAIN</button>';
    if (window.caches) caches.delete('eden-bi-page-v1').catch(function () {});
  }

  var PAGE_CACHE = 'eden-bi-page-v1';
  var PAGE_KEY = '/__eden_page__';

  function getJson(url) {
    return fetch(url, { credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        try { return JSON.parse(t); }
        catch (e) { throw new Error('The server did not return data. Deploy a New version of the Apps Script web app.'); }
      })
      .then(function (j) { if (j && j.ok === false) throw new Error(j.error || 'Server error'); return j; });
  }

  // Downloads the whole page (first slice + the rest in parallel).
  function downloadPage(meta) {
    var reqs = [meta.html ? Promise.resolve(meta.html) : null];
    for (var i = meta.html ? 1 : 0; i < (meta.parts || 1); i++) {
      reqs[i] = getJson(APP_URL + '?view=chunk&id=' + encodeURIComponent(meta.id) + '&i=' + i)
        .then(function (c) { if (typeof c.data !== 'string') throw new Error('Missing part'); return c.data; });
    }
    return Promise.all(reqs).then(function (parts) { return { hash: meta.hash, html: parts.join('') }; });
  }

  function readCached() {
    if (!window.caches) return Promise.resolve(null);
    return caches.open(PAGE_CACHE)
      .then(function (c) { return c.match(PAGE_KEY); })
      .then(function (r) { return r ? r.json() : null; })
      .catch(function () { return null; });
  }

  function saveCached(page) {
    if (!window.caches || !page || !page.html) return Promise.resolve();
    return caches.open(PAGE_CACHE)
      .then(function (c) { return c.put(PAGE_KEY, new Response(JSON.stringify(page), { headers: { 'Content-Type': 'application/json' } })); })
      .catch(function () {});
  }

  // After showing a cached copy, quietly fetch a newer page (if any) for next time.
  var UPDATER = '(' + function (API, HASH, CACHE, KEY) {
    setTimeout(function () {
      fetch(API + '?view=pagever', { credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (m) {
          if (!m || !m.hash || m.hash === HASH) return;
          var reqs = [];
          for (var i = 0; i < m.parts; i++) {
            reqs.push(fetch(API + '?view=chunk&id=' + encodeURIComponent(m.id) + '&i=' + i, { credentials: 'omit', redirect: 'follow' })
              .then(function (r) { return r.json(); })
              .then(function (c) { if (typeof c.data !== 'string') throw new Error('part'); return c.data; }));
          }
          return Promise.all(reqs).then(function (parts) {
            return caches.open(CACHE).then(function (c) {
              return c.put(KEY, new Response(JSON.stringify({ hash: m.hash, html: parts.join('') }), { headers: { 'Content-Type': 'application/json' } }));
            });
          });
        })
        .catch(function () {});
    }, 4000);
  } + ')';

  function render(page) {
    var icon = document.querySelector('link[rel="icon"]');
    var extra = (icon ? icon.outerHTML : '') + '<script>' + SHIM + '<\/script>' +
      '<script>' + UPDATER + '(' + [APP_URL, page.hash || '', PAGE_CACHE, PAGE_KEY].map(function (v) { return JSON.stringify(v); }).join(',') + ');<\/script>';
    var html = page.html.replace(/<head([^>]*)>/i, function (m) { return m + extra; });
    document.open();
    document.write(html);
    document.close();
  }

  readCached().then(function (cached) {
    if (cached && cached.html) { render(cached); return; }
    return getJson(APP_URL + '?view=raw')
      .then(function (first) {
        if (!first || typeof first.html !== 'string') throw new Error('No page');
        return downloadPage(first);
      })
      .then(function (page) { return saveCached(page).then(function () { render(page); }); });
  }).catch(startIframe);
})();
</script>
</body>
</html>
