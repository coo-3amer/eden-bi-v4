plugins { id 'com.android.application' }

android {
    namespace 'com.edenalkhalij.dashboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.edenalkhalij.dashboard'
        minSdk 24
        targetSdk 35
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName '2.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
