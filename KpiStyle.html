<style id="eden-kpi-style">
/* =====================================================================
   EDEN BI — KPI cards: coloured top line, number in the same colour,
   soft corner circle and glow (approved style). Colours rotate in a
   fixed order: green, gold, teal, terracotta, plum.
   ===================================================================== */
html[data-theme] #appRoot{--k1:#1f6b52;--k2:#b0832c;--k3:#23777e;--k4:#c0533b;--k5:#7b3f70;--kGlow:7%}
html[data-theme="dark"] #appRoot{--k1:#3fbf8e;--k2:#e3b85a;--k3:#4cc2c8;--k4:#f07a5a;--k5:#d27fc0;--kGlow:11%}
html[data-theme] #appRoot #cards .edenKpiCard{--a:var(--k1)}
html[data-theme] #appRoot #cards .edenKpiCard:nth-child(5n+2){--a:var(--k2)}
html[data-theme] #appRoot #cards .edenKpiCard:nth-child(5n+3){--a:var(--k3)}
html[data-theme] #appRoot #cards .edenKpiCard:nth-child(5n+4){--a:var(--k4)}
html[data-theme] #appRoot #cards .edenKpiCard:nth-child(5n+5){--a:var(--k5)}
html[data-theme] #appRoot #cards .edenKpiCard{
  position:relative!important;overflow:hidden!important;
  background:radial-gradient(130% 90% at 0% 0%,color-mix(in srgb,var(--a) var(--kGlow),transparent),transparent 60%),var(--ds-surface)!important;
  border-top-color:transparent!important;border-radius:18px!important;transition:transform .15s ease,box-shadow .15s ease!important}
html[data-theme] #appRoot #cards .edenKpiCard::before{content:""!important;opacity:1!important;position:absolute!important;grid-column:auto!important;grid-row:auto!important;align-self:auto!important;justify-self:auto!important;border:0!important;inset:0 0 auto 0!important;width:auto!important;height:4px!important;min-height:0!important;margin:0!important;transform:none!important;background:var(--a)!important;border-radius:0!important;display:block!important;z-index:1}
html[data-theme] #appRoot #cards .edenKpiCard::after{content:""!important;opacity:1!important;position:absolute!important;grid-column:auto!important;grid-row:auto!important;align-self:auto!important;justify-self:auto!important;border:0!important;inset:auto -26px -34px auto!important;width:96px!important;height:96px!important;margin:0!important;transform:none!important;border-radius:50%!important;background:color-mix(in srgb,var(--a) 10%,transparent)!important;display:block!important;pointer-events:none;z-index:0}
html[data-theme] #appRoot #cards .edenKpiCard:hover{transform:translateY(-2px);box-shadow:0 10px 24px color-mix(in srgb,var(--a) 18%,transparent)!important}
html[data-theme] #appRoot #cards .edenKpiCard .value{color:var(--a)!important;-webkit-text-fill-color:var(--a)!important;font-weight:800!important}
html[data-theme] #appRoot #cards .edenKpiCard .edenKpiIcon{background:color-mix(in srgb,var(--a) 12%,transparent)!important;color:var(--a)!important;border-color:color-mix(in srgb,var(--a) 30%,transparent)!important}
html[data-theme] #appRoot #cards .edenKpiCard .edenKpiBody{position:relative;z-index:1}
html[dir="rtl"] #appRoot #cards .edenKpiCard::after{inset:auto auto -34px -26px!important}
html[dir="rtl"] #appRoot #cards .edenKpiCard{background:radial-gradient(130% 90% at 100% 0%,color-mix(in srgb,var(--a) var(--kGlow),transparent),transparent 60%),var(--ds-surface)!important}
</style>
