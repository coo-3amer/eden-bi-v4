<style id="eden-analytics">
/* =====================================================================
   EDEN BI — Analytics (one page, six tabs). Uses the .da overlay frame.
   ===================================================================== */
#an .anBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 22px 6px}
#an .anSeg{display:inline-flex;background:var(--ds-surface-3,#f3ede2);border-radius:99px;padding:3px;flex-wrap:wrap}
#an .anSeg button{border:0;background:transparent;padding:6px 12px;border-radius:99px;font:600 12px var(--ds-font,inherit);color:var(--ds-muted,#6b6255);cursor:pointer}
#an .anSeg button.on{background:var(--ds-surface,#fff);color:var(--ds-heading,#120f0b);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#an .anBar select,#an .anBar input[type=month]{padding:6px 10px;border-radius:10px;border:1px solid var(--ds-line,#e2d7c4);background:var(--ds-surface,#fff);color:var(--ds-text,#221e19);font:600 12px var(--ds-font,inherit);max-width:200px}
#an .anCustom{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ds-muted,#6b6255)}
#an .anPer{font-size:12px;color:var(--ds-muted,#6b6255);margin-left:auto}
#an .anPer b{color:var(--ds-heading,#120f0b)}
#an .anFl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 22px 8px}
#an .anFb{position:relative;border:1px solid var(--ds-line,#e2d7c4);background:var(--ds-surface,#fff);color:var(--ds-text,#221e19);border-radius:10px;padding:6px 10px;font:600 12px var(--ds-font,inherit);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
#an .anFb:hover{border-color:var(--ds-gold,#a8791f)}
#an .anFb.on{border-color:var(--ds-gold,#a8791f);background:color-mix(in srgb,var(--ds-gold,#a8791f) 12%,var(--ds-surface,#fff))}
#an .anFb em{font-style:normal;background:var(--ds-gold,#a8791f);color:#fff;border-radius:99px;padding:0 6px;font-size:10.5px;line-height:16px}
#an .anFb.ghost{border-style:dashed;background:transparent}
#an .anFb.lnk{border-color:transparent;background:transparent;color:var(--ds-muted,#6b6255)}
#an .anFb.lnk:hover{color:var(--ds-heading,#120f0b)}
#an .anChips{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px 10px;border-bottom:1px solid var(--ds-line,#e2d7c4)}
#an .anChips:empty{padding:0}
#an .anChip{display:inline-flex;align-items:center;gap:6px;background:var(--ds-surface-3,#f3ede2);border-radius:99px;padding:4px 6px 4px 11px;font-size:12px;color:var(--ds-text,#221e19)}
#an .anChip b{font-weight:700}
#an .anChip button{border:0;background:rgba(0,0,0,.08);width:18px;height:18px;border-radius:99px;cursor:pointer;font-size:12px;line-height:18px;padding:0;color:inherit}
.anPop{position:fixed;z-index:100001;width:290px;max-height:420px;display:flex;flex-direction:column;background:var(--ds-surface,#fffdf9);color:var(--ds-text,#221e19);border:1px solid var(--ds-line,#e2d7c4);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);font:12.5px var(--ds-font,inherit)}
.anPop .h{padding:10px 10px 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--ds-line,#e2d7c4)}
.anPop .h input{width:100%;box-sizing:border-box;padding:7px 10px;border-radius:9px;border:1px solid var(--ds-line,#e2d7c4);background:var(--ds-surface,#fff);color:inherit;font:inherit}
.anPop .h div{display:flex;gap:6px;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ds-muted,#6b6255)}
.anPop .h button{border:0;background:var(--ds-surface-3,#f3ede2);color:inherit;border-radius:8px;padding:4px 9px;font:600 11.5px var(--ds-font,inherit);cursor:pointer}
.anPop .l{overflow:auto;padding:4px 4px 8px}
.anPop label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.anPop label:hover{background:var(--ds-surface-3,#f3ede2)}
.anPop label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anPop label small{color:var(--ds-muted,#6b6255);font-variant-numeric:tabular-nums}
.anPop label.z{opacity:.5}
#an .daBody{padding:18px 22px 40px;background:var(--ds-bg,#f4f0e8)}
#an .anGrid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:14px}
#an .anC{grid-column:span 4;background:var(--ds-surface,#fffdf9);border:1px solid var(--ds-line,#e2d7c4);border-radius:16px;padding:14px 16px;min-width:0}
#an .anC.w6{grid-column:span 6}#an .anC.w8{grid-column:span 8}#an .anC.w12{grid-column:span 12}#an .anC.w3{grid-column:span 3}
#an .anC h3{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-muted,#6b6255);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#an .anC h3 small{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
#an .anC h3 .anSeg button{padding:4px 10px;font-size:11px;text-transform:none;letter-spacing:0}
#an .anKpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
#an .anK{background:var(--ds-surface,#fffdf9);border:1px solid var(--ds-line,#e2d7c4);border-radius:16px;padding:12px 14px}
#an .anK span{display:block;font-size:11px;color:var(--ds-muted,#6b6255);text-transform:uppercase;letter-spacing:.06em}
#an .anK b{display:block;font-size:22px;color:var(--ds-heading,#120f0b);margin:4px 0 2px;font-variant-numeric:tabular-nums}
#an .anK small{font-size:11.5px;color:var(--ds-muted,#6b6255)}
#an .up{color:var(--ds-green,#178a4c)!important;font-weight:700}#an .dn{color:var(--ds-red,#d12f2f)!important;font-weight:700}#an .eq{color:var(--ds-muted,#6b6255)}
#an .anB{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:12px}
#an .anB .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#an .anB .t{height:9px;border-radius:99px;background:var(--ds-surface-3,#efe7d8);overflow:hidden;display:flex}
#an .anB .t i{display:block;height:100%;border-radius:99px}
#an .anB b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#an .anCols{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:14px}
#an .anCols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;height:100%}
#an .anCols .v{font-size:9.5px;color:var(--ds-muted,#6b6255);margin-bottom:3px;white-space:nowrap}
#an .anCols .bb{width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center;flex:1}
#an .anCols .bb i{display:block;flex:1;max-width:26px;border-radius:5px 5px 2px 2px;min-height:2px}
#an .anCols .bb i.est{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px)!important}
#an .anCols .x{font-size:10px;color:var(--ds-muted,#6b6255);margin-top:5px;white-space:nowrap}
#an .anLg{font-size:11px;color:var(--ds-muted,#6b6255);margin-top:8px;display:flex;flex-wrap:wrap;gap:12px}
#an .anLg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#an table.anT{width:100%;border-collapse:collapse;font-size:12.5px}
#an table.anT th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ds-muted,#6b6255);padding:8px;border-bottom:1px solid var(--ds-line,#e2d7c4);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--ds-surface,#fffdf9);z-index:1}
#an table.anT td{padding:8px;border-bottom:1px solid color-mix(in srgb,var(--ds-line,#e2d7c4) 60%,transparent);white-space:nowrap;font-variant-numeric:tabular-nums}
#an table.anT td.n,#an table.anT th.n{text-align:right}
#an table.anT tr:hover td{background:color-mix(in srgb,var(--ds-gold,#a8791f) 6%,transparent)}
#an table.anT tr.anTot td{font-weight:700;border-top:2px solid var(--ds-line,#e2d7c4)}
#an table.anT tr[data-cx]{cursor:pointer}
#an table.anT tr.anSub td{white-space:normal;background:var(--ds-surface-3,#f6f0e5);font-size:12px;line-height:1.6}
#an .anScroll{overflow:auto;max-height:520px}
#an .anIns{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
#an .anIns div{background:var(--ds-surface,#fffdf9);border:1px solid var(--ds-line,#e2d7c4);border-left:4px solid var(--ds-gold,#a8791f);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45}
#an .anIns div.g{border-left-color:var(--ds-green,#178a4c)}#an .anIns div.r{border-left-color:var(--ds-red,#d12f2f)}
#an .anHeat td.h{text-align:right;border-radius:6px}
#an .anNote{font-size:11.5px;color:var(--ds-muted,#6b6255);margin-top:6px}
#an .anBig{display:flex;gap:10px;flex-wrap:wrap}#an .anBig div{flex:1;min-width:110px;background:var(--ds-surface-3,#f6f0e5);border-radius:12px;padding:9px 12px}
#an .anBig b{display:block;font-size:19px;color:var(--ds-heading,#120f0b);font-variant-numeric:tabular-nums}#an .anBig span{font-size:11px;color:var(--ds-muted,#6b6255)}
#an .anStk{height:12px;border-radius:99px;overflow:hidden;display:flex;background:var(--ds-surface-3,#efe7d8)}#an .anStk i{display:block;height:100%}
#an .anPg{display:inline-block;width:70px;height:7px;border-radius:99px;background:var(--ds-surface-3,#efe7d8);overflow:hidden;vertical-align:middle;margin-right:6px}
#an .anPg i{display:block;height:100%;border-radius:99px}
#an .anTag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700}
#an .anTag.ok{background:#dff3e7;color:#146c3d}#an .anTag.track{background:#fdf1d6;color:#8a5b00}#an .anTag.behind{background:#fbe0dd;color:#a3231a}#an .anTag.none{background:var(--ds-surface-3,#efe7d8);color:var(--ds-muted,#6b6255)}
#an .anMv{font-size:11px;font-weight:700}
#an svg.anLine text{font:10px var(--ds-font,inherit);fill:var(--ds-muted,#6b6255)}
#an .anHm{display:grid;grid-template-columns:70px repeat(7,minmax(0,1fr)) 54px;gap:4px;font-size:11.5px;align-items:center}
#an .anHm div{text-align:center;padding:8px 2px;border-radius:7px;font-variant-numeric:tabular-nums}
#an .anHm .hd{color:var(--ds-muted,#6b6255);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:4px 2px}
#an .anHm .rl{text-align:left;color:var(--ds-muted,#6b6255)}
@media(max-width:1100px){#an .anC,#an .anC.w3{grid-column:span 6}#an .anC.w8,#an .anC.w12{grid-column:span 12}#an .anKpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){#an .anC,#an .anC.w6,#an .anC.w3{grid-column:span 12}#an .anPer{margin-left:0;width:100%}#an .anBar,#an .anFl,#an .anChips{padding-left:14px;padding-right:14px}}
</style>
<script>
const AN_={tab:'team',per:'m0',from:'',to:'',cmp:'prev',cur:'EGP',grp:'manager',f:{},more:false,
  sort:{k:'v',d:-1},sorts:{},src:'sourceType',dem:'floor',tgs:'Sales',inst:null,inv:{},tg:null,open:{},_S:null};
const AN_TABS_=[['team','Sales team'],['fc','Forecast & targets'],['sales','Sales & pricing'],['journey','Deal journey'],['clients','Clients & sources'],['money','Collections & inventory']];
const AN_PAL_=['#c08a2e','#5b6b85','#2f9a63','#3b6fd8','#e0703f','#8a5cd6','#1f9f9a','#e3b24f','#b5476b','#7a8a3a'];
/* Filters: [key on the row, label]. The first AN_MAIN_DIMS_ are always shown. */
const AN_DIMS_=[['project','Project'],['sales','Salesperson'],['salesManager','Team'],['dealStatus','Deal type'],['status','Status'],['branch','Branch'],
  ['sourceType','Source type'],['mainSource','Main source'],['campaignName','Campaign'],['brokerageCompany','Broker company'],['unitType','Unit type'],['nationality','Nationality'],['clientType','Client type']];
const AN_MAIN_DIMS_=6;
const AN_STAGE_P_={reservation:null,review:.5,part:.75,total:.82,csPart:.9,csTotal:.92,coPart:.96,coTotal:.97};
const AN_STAGE_L_={reservation:'Reservation',review:'Under review',part:'Part of DP',total:'Total DP',csPart:'Client signed · part DP',csTotal:'Client signed',coPart:'Company signed · part DP',coTotal:'Company signed'};
function anCan_(){
  if(typeof isEgyptViewer_==='function'&&isEgyptViewer_())return false;
  if(typeof dsSalesRole_==='function'&&dsSalesRole_())return false;
  return !!(typeof AUTH_USER!=='undefined'&&AUTH_USER);
}
function anAdmin_(){const r=String((typeof AUTH_USER!=='undefined'&&AUTH_USER&&AUTH_USER.role)||'').trim().toLowerCase();return r==='admin'||r==='super admin';}
const anEsc_=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const anN_=v=>Math.round(Number(v)||0).toLocaleString('en-US');
function anM_(v){v=Number(v)||0;const a=Math.abs(v);return a>=1e6?(Math.round(v/1e5)/10).toLocaleString('en-US')+'M':a>=1e3?Math.round(v/1e3).toLocaleString('en-US')+'K':String(Math.round(v));}
const anP_=v=>v==null||!isFinite(v)?'—':(Math.round(v*10)/10)+'%';
const anNum_=v=>Math.round((Number(v)||0)*10)/10;
function anD_(cur,prev,inverse){
  if(!prev&&!cur)return '<span class="eq">—</span>';
  if(!prev)return '<span class="up">new</span>';
  const d=(cur-prev)/Math.abs(prev)*100,good=inverse?d<0:d>0;
  if(Math.abs(d)<0.5)return '<span class="eq">±0%</span>';
  if(d>=300)return `<span class="${good?'up':'dn'}">▲ ×${(Math.round(cur/prev*10)/10).toLocaleString('en-US')}</span>`;
  return `<span class="${good?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(Math.round(d))}%</span>`;
}
function anPP_(cur,prev,inverse){ // percentage-point change
  if(cur==null||prev==null||!isFinite(cur)||!isFinite(prev))return '<span class="eq">—</span>';
  const d=cur-prev,good=inverse?d<0:d>0;if(Math.abs(d)<0.5)return '<span class="eq">±0 pt</span>';
  return `<span class="${good?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(Math.round(d))} pt</span>`;
}
const anTxt_=h=>String(h).replace(/<[^>]+>/g,'');
const anYm_=r=>{const y=Number(r.year),m=Number(r.month);return y&&m?y*12+m-1:null;};
const anYmLabel_=k=>new Date(Math.floor(k/12),k%12,1).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
const anYmStr_=k=>Math.floor(k/12)+'-'+String(k%12+1).padStart(2,'0');
const anYmParse_=s=>{const m=String(s||'').match(/^(\d{4})-(\d{1,2})$/);return m?Number(m[1])*12+Number(m[2])-1:null;};
const anNowYm_=()=>{const d=new Date();return d.getFullYear()*12+d.getMonth();};
const anCanc_=r=>/cancel/i.test(String(r.status||''));
const anT_=v=>typeof commissionTrue_==='function'?commissionTrue_(v):/^(true|yes|1|✓)$/i.test(String(v||'').trim());
function anStage_(r){return typeof dealStage_==='function'?dealStage_(r):(anCanc_(r)?'cancel':'reservation');}
function anSigned_(r){const s=anStage_(r);return ['csPart','csTotal','coPart','coTotal','closed','delivered'].includes(s)||/closed|deliver|sign/i.test(String(r.status||''));}
function anDone_(r){return ['closed','delivered'].includes(anStage_(r))||/closed|deliver/i.test(String(r.status||''));}
function anDate_(r){const y=Number(r.year),m=Number(r.month),d=Number(r.day)||1;if(!y||!m)return null;return new Date(y,m-1,d);}
function anParseDate_(s){
  if(s instanceof Date)return isNaN(s)?null:s;
  s=String(s||'').trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ](\d{4})$/);
  if(m){const d=new Date(`${m[2]} ${m[1]}, ${m[3]}`);return isNaN(d)?null:d;}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
  const d=new Date(s);return isNaN(d)?null:d;
}
const anDays_=(a,b)=>a&&b?Math.round((b-a)/864e5):null;
const anCurOf_=r=>typeof projectCurrency_==='function'?projectCurrency_(r):(/usd/i.test(String(r.currency||''))?'USD':'EGP');
const anCk_=r=>typeof clientKeyOf==='function'?clientKeyOf(r):String(r.clientName||'').trim().toLowerCase();
const anClient_=r=>String(r.clientName||'').split(' - ')[0].trim();
const anNorm_=s=>typeof edenNormName_==='function'?edenNormName_(s):String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

/* ---------- period ---------- */
function anRange_(){
  const n=anNowYm_();
  const map={m0:[n,n],m1:[n-1,n-1],q:[n-2,n],ytd:[n-(n%12),n],y12:[n-11,n]};
  let a,b;
  if(AN_.per==='custom'){a=anYmParse_(AN_.from);b=anYmParse_(AN_.to);if(a==null)a=b??n;if(b==null)b=a;if(a>b)[a,b]=[b,a];}
  else [a,b]=map[AN_.per]||map.m0;
  const len=b-a+1,[pa,pb]=AN_.cmp==='ly'?[a-12,b-12]:[a-len,a-1];
  return {a,b,pa,pb,len,n};
}
function anPerLabel_(){
  const R=anRange_(),L=(a,b)=>a===b?anYmLabel_(a):anYmLabel_(a)+' – '+anYmLabel_(b);
  return `<b>${L(R.a,R.b)}</b> vs ${L(R.pa,R.pb)}${AN_.cmp==='ly'?' (last year)':''}`;
}
const anPerOnly_=()=>anPerLabel_().replace(/ vs.*/,'');
const anIn_=(r,a,b)=>{const k=anYm_(r);return k!=null&&k>=a&&k<=b;};

/* ---------- filters ---------- */
function anVals_(r,k){
  if(k==='sales'){const s=[String(r.salesName||'').trim()||'(blank)'];const w=String(r.sharedWith||'').trim();if(w&&typeof isShareDeal_==='function'&&isShareDeal_(r))s.push(w);return s;}
  return [String(r[k]??'').trim()||'(blank)'];
}
function anMatch_(r,except){
  for(const [k] of AN_DIMS_){
    if(k===except)continue;const sel=AN_.f[k];if(!sel||!sel.length)continue;
    if(!anVals_(r,k).some(v=>sel.includes(v)))return false;
  }
  return true;
}
const anActive_=()=>AN_DIMS_.filter(([k])=>(AN_.f[k]||[]).length);
/* All deals in scope (every filter + currency), any date. Cached for one render. */
function anScope_(){
  if(AN_._S)return AN_._S;
  const all=(typeof rawRows!=='undefined'&&rawRows)||[];
  return AN_._S=all.filter(r=>anCurOf_(r)===AN_.cur&&anMatch_(r));
}
/* Credit for a deal: shared deals split 50/50. With a salesperson filter only those people are listed. */
function anCredits_(r){
  const share=typeof isShareDeal_==='function'&&isShareDeal_(r);
  const s=String(r.salesName||'').trim()||'Not assigned';
  let out=share?[[s,.5],[String(r.sharedWith).trim(),.5]]:[[s,1]];
  const sel=AN_.f.sales;if(sel&&sel.length)out=out.filter(([n])=>sel.includes(n));
  return out;
}
function anGroupOf_(r){
  const v=AN_.grp==='branch'?r.branch:r.salesManager;
  return String(v||'').trim()||(AN_.grp==='branch'?'No branch':'No manager');
}
function anStats_(rows){
  const live=rows.filter(r=>!anCanc_(r));
  const v=live.reduce((a,r)=>a+(Number(r.amount)||0),0);
  const sig=live.filter(anSigned_).length;
  const disc=live.map(r=>r.discountPct===''||r.discountPct==null?NaN:Number(r.discountPct)).filter(x=>isFinite(x)&&x>=0);
  return {n:live.length,v,avg:live.length?v/live.length:0,signed:live.length?sig/live.length*100:null,
    cancel:rows.length?(rows.length-live.length)/rows.length*100:null,canc:rows.length-live.length,all:rows.length,
    disc:disc.length?disc.reduce((a,x)=>a+x,0)/disc.length:null};
}
function anMedian_(a){a=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
const anSum_=(rows,f)=>rows.reduce((a,r)=>a+(Number(f?f(r):r.amount)||0),0);

/* ---------- small chart helpers ---------- */
function anBars_(items,o={}){
  const mx=Math.max(...items.map(x=>Math.abs(x[1])),1),col=o.color||'#c08a2e';
  return items.map((x,i)=>`<div class="anB" title="${anEsc_(x[0])}"><span class="l">${anEsc_(x[0])}</span><span class="t"><i style="width:${Math.max(1.5,Math.abs(x[1])/mx*100).toFixed(1)}%;background:${Array.isArray(col)?col[i%col.length]:col}"></i></span><b>${o.fmt?o.fmt(x[1],x):anN_(x[1])}${x[2]!=null?` <small class="eq">${x[2]}</small>`:''}</b></div>`).join('')||'<div class="anNote">No data.</div>';
}
function anCols_(cols,series,o={}){ // cols: labels; series: [{name,color,values[],est[]}]
  const mx=Math.max(1,...series.flatMap(s=>s.values));
  return `<div class="anCols">${cols.map((c,i)=>`<div class="c"><div class="v">${o.top?o.top(i):anM_(series[0].values[i])}</div><div class="bb">${series.map(s=>`<i class="${s.est&&s.est[i]?'est':''}" title="${anEsc_(s.name)} · ${anEsc_(c)}: ${anN_(s.values[i])}" style="height:${(s.values[i]/mx*100).toFixed(1)}%;background:${s.color}"></i>`).join('')}</div><div class="x">${anEsc_(c)}</div></div>`).join('')}</div>`+
    (series.length>1||o.legend?`<div class="anLg">${series.map(s=>`<span><i style="background:${s.color}"></i>${anEsc_(s.name)}</span>`).join('')}${o.legend||''}</div>`:'');
}
/* Line chart (SVG). series: [{name,color,values[],dash}] — null values are skipped. */
function anLine_(labels,series,o={}){
  const W=640,H=210,L=44,Rr=10,T=12,B=26,mx=Math.max(1,...series.flatMap(s=>s.values.filter(v=>v!=null)));
  const x=i=>L+(labels.length<2?0:i/(labels.length-1)*(W-L-Rr)),y=v=>T+(1-v/mx)*(H-T-B);
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-Rr}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="currentColor" stroke-opacity=".12"/><text x="${L-6}" y="${y(mx*f)+3}" text-anchor="end">${anM_(mx*f)}</text>`).join('');
  const step=Math.max(1,Math.ceil(labels.length/10));
  const xl=labels.map((l,i)=>i%step===0||i===labels.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${anEsc_(l)}</text>`:'').join('');
  const lines=series.map(s=>{let d='',pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1);pen=true;});
    const last=s.values.reduce((a,v,i)=>v!=null?i:a,-1);
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>${last>=0&&!s.dash?`<circle cx="${x(last)}" cy="${y(s.values[last])}" r="3.2" fill="${s.color}"/>`:''}`;}).join('');
  return `<svg class="anLine" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;color:var(--ds-text,#221e19)">${grid}${xl}${lines}</svg><div class="anLg">${series.map(s=>`<span><i style="background:${s.color}"></i>${anEsc_(s.name)}</span>`).join('')}</div>`;
}
function anSpark_(vals,col){
  const w=64,h=18,mx=Math.max(...vals,1),n=vals.length;
  const pts=vals.map((v,i)=>`${(n<2?0:i/(n-1)*(w-4)+2).toFixed(1)},${(h-3-(v/mx)*(h-6)).toFixed(1)}`);
  const last=pts[pts.length-1].split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle"><polyline points="${pts.join(' ')}" fill="none" stroke="${col||'#c08a2e'}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${col||'#c08a2e'}"/></svg>`;
}
function anPg_(pct,col){const p=Math.max(0,Math.min(100,pct||0));return `<span class="anPg"><i style="width:${p}%;background:${col||(pct>=100?'#178a4c':pct>=70?'#e3b24f':'#d12f2f')}"></i></span>`;}
function anCard_(title,body,w,extra){return `<div class="anC ${w||''}"><h3>${title}${extra?`<small>${extra}</small>`:''}</h3>${body}</div>`;}
function anSegH_(attr,opts,val){return `<span class="anSeg">${opts.map(([v,l])=>`<button type="button" data-${attr}="${v}" class="${v===val?'on':''}">${l}</button>`).join('')}</span>`;}
/* Sortable table. cols: [{k,l,n,f:row=>html,v:row=>sort value}] */
function anTbl_(id,cols,rows,o={}){
  const s=AN_.sorts[id]||o.sort||{k:cols[1]?cols[1].k:cols[0].k,d:-1},col=cols.find(c=>c.k===s.k)||cols[0];
  const val=r=>col.v?col.v(r):r[col.k];
  rows=rows.slice().sort((x,y)=>{const a=val(x),b=val(y);if(typeof a==='string'||typeof b==='string')return s.d*String(a??'').localeCompare(String(b??''));return s.d*((a??-1e15)-(b??-1e15));});
  if(o.limit)rows=rows.slice(0,o.limit);
  const body=rows.map((r,i)=>`<tr${o.rowAttr?o.rowAttr(r):''}>${cols.map(c=>`<td class="${c.n?'n':''} ${c.cls?c.cls(r):''}">${c.k==='#'?i+1:c.f?c.f(r,i):anEsc_(r[c.k]??'—')}</td>`).join('')}</tr>${o.after?o.after(r):''}`).join('');
  return `<div class="anScroll"${o.h?` style="max-height:${o.h}px"`:''}><table class="anT" data-tid="${id}"><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}" ${c.k==='#'?'':`data-tsort="${id}|${c.k}"`}>${c.l}${s.k===c.k?(s.d<0?' ▾':' ▴'):''}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}" class="eq">No data.</td></tr>`}</tbody>${o.foot||''}</table></div>`;
}

/* ================= TAB 1 · SALES TEAM ================= */
function anPeople_(rowsCur,rowsPrev){
  const P={},R=anRange_();
  const blank=()=>({dn:0,cw:0,n:0,v:0,all:0,canc:0,sig:0,lost:0,disc:[],days:[],cc:new Set(),cl:[],reasons:{}});
  const addP=(rows,key)=>rows.forEach(r=>anCredits_(r).forEach(([s,w])=>{if(!s)return;const o=P[s]=P[s]||{s,team:'',cur:blank(),prev:blank()};
    if(key==='cur'&&!o.team)o.team=anGroupOf_(r);
    const x=o[key];x.all+=w;x.dn++;if(anCanc_(r))x.cw++;
    if(anCanc_(r)){x.canc+=w;x.lost+=(Number(r.amount)||0)*w;x.cc.add(anCk_(r));if(key==='cur'){x.cl.push(r);let k=String(r.cancelReason||'').trim();if(!k||/^[£$€]?\s*[\d,.]+$/.test(k))k='(no reason)';x.reasons[k]=(x.reasons[k]||0)+1;}return;}
    x.n+=w;x.v+=(Number(r.amount)||0)*w;if(anSigned_(r))x.sig+=w;
    if(key==='cur'){const d=r.discountPct===''||r.discountPct==null?NaN:Number(r.discountPct);if(isFinite(d)&&d>=0)x.disc.push(d);const dt=Number(r.daysToClose);if(dt>0&&dt<400)x.days.push(dt);}}));
  addP(rowsCur,'cur');addP(rowsPrev,'prev');
  const S=anScope_(),months=[...Array(6)].map((_,i)=>R.b-5+i);
  const ppl=Object.values(P).filter(o=>o.cur.all||o.prev.all).map(o=>{
    const spark=months.map(k=>0);
    return {...o,v:o.cur.v,n:o.cur.n,pv:o.prev.v,d:o.prev.v?(o.cur.v-o.prev.v)/o.prev.v*100:(o.cur.v?999:0),
      sig:o.cur.n?o.cur.sig/o.cur.n*100:null,canc:o.cur.all?o.cur.canc/o.cur.all*100:null,pcanc:o.prev.dn?o.prev.cw/o.prev.dn*100:null,wc:o.cur.dn?o.cur.cw/o.cur.dn*100:null,
      cn:o.cur.canc,cc:o.cur.cc.size,lost:o.cur.lost,disc:o.cur.disc.length?o.cur.disc.reduce((a,x)=>a+x,0)/o.cur.disc.length:null,days:anMedian_(o.cur.days),spark};
  });
  const idx={};ppl.forEach(p=>idx[p.s]=p);
  S.forEach(r=>{if(anCanc_(r))return;const k=anYm_(r),i=months.indexOf(k);if(i<0)return;anCredits_(r).forEach(([s,w])=>{if(idx[s])idx[s].spark[i]+=(Number(r.amount)||0)*w;});});
  const rank=(key)=>{const l=ppl.filter(p=>p[key]>0).sort((a,b)=>b[key]-a[key]);l.forEach((p,i)=>p[key==='v'?'rk':'prk']=i+1);};
  rank('v');rank('pv');
  ppl.forEach(p=>p.mv=p.rk&&p.prk?p.prk-p.rk:null);
  return ppl;
}
function anTeam_(){
  const S=anScope_(),R=anRange_();
  const cur=S.filter(r=>anIn_(r,R.a,R.b)),prev=S.filter(r=>anIn_(r,R.pa,R.pb));
  const A=anStats_(cur),B=anStats_(prev);
  const now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const pace=R.a===R.n&&R.b===R.n?A.v/now.getDate()*dim:null;
  const cancClients=new Set(cur.filter(anCanc_).map(anCk_)).size;
  const kpis=`<div class="anKpis">
    <div class="anK"><span>Sales ${AN_.cur}</span><b>${anM_(A.v)}</b><small>${anD_(A.v,B.v)} vs ${anM_(B.v)}${pace?` · pace ${anM_(pace)}`:''}</small></div>
    <div class="anK"><span>Deals</span><b>${anN_(A.n)}</b><small>${anD_(A.n,B.n)} vs ${anN_(B.n)}</small></div>
    <div class="anK"><span>Average deal</span><b>${anM_(A.avg)}</b><small>${anD_(A.avg,B.avg)} vs ${anM_(B.avg)}</small></div>
    <div class="anK"><span>Client signed</span><b>${anP_(A.signed)}</b><small>${anPP_(A.signed,B.signed)} vs ${anP_(B.signed)}</small></div>
    <div class="anK"><span>Cancel rate</span><b>${anP_(A.cancel)}</b><small>${anPP_(A.cancel,B.cancel,true)} vs ${anP_(B.cancel)} · ${A.canc} deals · ${cancClients} clients</small></div></div>`;

  // teams
  const teams={};
  const add=(rows,key)=>rows.forEach(r=>{const g=anGroupOf_(r);(teams[g]=teams[g]||{cur:[],prev:[]})[key].push(r);});
  add(cur,'cur');add(prev,'prev');
  const T=Object.entries(teams).map(([g,x])=>({g,a:anStats_(x.cur),b:anStats_(x.prev)})).filter(t=>t.a.all||t.b.all).sort((x,y)=>y.a.v-x.a.v);
  const tot=A.v||1;
  const teamTable=`<div class="anScroll"><table class="anT"><thead><tr><th>${AN_.grp==='branch'?'Branch':'Team (sales manager)'}</th><th class="n">Deals</th><th class="n">Sales</th><th class="n">vs before</th><th class="n">Share</th><th class="n">Avg deal</th><th class="n">Signed</th><th class="n">Cancelled</th><th class="n">Cancel %</th><th class="n">Avg disc.</th></tr></thead><tbody>${
    T.map((t,i)=>`<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${AN_PAL_[i%AN_PAL_.length]};margin-right:6px"></i>${anEsc_(t.g)}</td><td class="n">${anN_(t.a.n)}</td><td class="n"><b>${anM_(t.a.v)}</b></td><td class="n">${anD_(t.a.v,t.b.v)}</td><td class="n">${anP_(t.a.v/tot*100)}</td><td class="n">${anM_(t.a.avg)}</td><td class="n">${anP_(t.a.signed)}</td><td class="n">${t.a.canc}</td><td class="n ${t.a.cancel>35?'dn':''}">${anP_(t.a.cancel)}</td><td class="n">${anP_(t.a.disc)}</td></tr>`).join('')}</tbody></table></div>`;

  // month by month per team (6 months ending at the period end)
  const months=[...Array(6)].map((_,i)=>R.b-5+i),top=T.slice(0,8).map(t=>t.g);
  const mval=(k,g)=>S.filter(r=>!anCanc_(r)&&anYm_(r)===k&&(g==null||anGroupOf_(r)===g)).reduce((a,r)=>a+(Number(r.amount)||0),0);
  const heatVals=top.map(g=>months.map(k=>mval(k,g))),heatMax=Math.max(1,...heatVals.flat());
  const heat=`<div class="anScroll"><table class="anT anHeat"><thead><tr><th>${AN_.grp==='branch'?'Branch':'Team'}</th>${months.map(k=>`<th class="n">${anYmLabel_(k)}</th>`).join('')}<th class="n">Trend</th></tr></thead><tbody>${top.map((g,gi)=>{
      const vals=heatVals[gi];
      return `<tr><td>${anEsc_(g)}</td>${vals.map(v=>`<td class="h" style="background:rgba(176,124,30,${(v/heatMax*.55).toFixed(2)})">${v?anM_(v):'·'}</td>`).join('')}<td class="n">${anD_(vals[5],vals[4])}</td></tr>`;}).join('')}</tbody></table></div><div class="anNote">Sales value per month · darker = more · trend = last month shown vs the one before</div>`;
  const cols=anCols_(months.map(anYmLabel_),[{name:'Sales',color:'#c08a2e',values:months.map(k=>mval(k))},{name:'Same month last year',color:'#cdbfa6',values:months.map(k=>mval(k-12))}]);

  // salespeople
  const people=anPeople_(cur,prev);
  const sk=AN_.sort.k,sd=AN_.sort.d;
  people.sort((x,y)=>{const a=x[sk],b=y[sk];if(typeof a==='string')return sd*a.localeCompare(b);return sd*((a??-1e9)-(b??-1e9));});
  const th=(k,l,n)=>`<th class="${n?'n':''}" data-sort="${k}">${l}${sk===k?(sd<0?' ▾':' ▴'):''}</th>`;
  const mv=p=>p.mv==null?(p.rk&&!p.prk?'<span class="anMv up">new</span>':'<span class="eq">—</span>'):p.mv>0?`<span class="anMv up">▲${p.mv}</span>`:p.mv<0?`<span class="anMv dn">▼${-p.mv}</span>`:'<span class="anMv eq">=</span>';
  const peopleTable=`<div class="anScroll"><table class="anT"><thead><tr>${th('rk','Rank',1)}${th('mv','Move',1)}${th('s','Salesperson')}${th('team',AN_.grp==='branch'?'Branch':'Team')}${th('n','Deals',1)}${th('v','Sales',1)}${th('pv','Before',1)}${th('d','Change',1)}<th>6 months</th>${th('sig','Signed',1)}${th('cn','Cancelled',1)}${th('canc','Cancel %',1)}${th('disc','Avg disc.',1)}${th('days','Days to close',1)}</tr></thead><tbody>${
    people.map(o=>`<tr><td class="n">${o.rk||'—'}</td><td class="n">${mv(o)}</td><td><b>${anEsc_(o.s)}</b></td><td>${anEsc_(o.team||'—')}</td><td class="n">${anNum_(o.n)}</td><td class="n"><b>${anM_(o.v)}</b></td><td class="n">${anM_(o.pv)}</td><td class="n">${anD_(o.v,o.pv)}</td><td>${anSpark_(o.spark)}</td><td class="n">${anP_(o.sig)}</td><td class="n">${anNum_(o.cn)}</td><td class="n ${o.canc>40?'dn':''}">${anP_(o.canc)}</td><td class="n">${anP_(o.disc)}</td><td class="n">${o.days!=null?Math.round(o.days):'—'}</td></tr>`).join('')}</tbody></table></div><div class="anNote">Rank by sales value · move = places up/down vs the period before · shared deals count half for each salesperson · click a column to sort</div>`;

  // cancellations per salesperson
  const cp=people.filter(p=>p.cur.all>0);
  const cancTable=anTbl_('canc',[
    {k:'s',l:'Salesperson',f:p=>`<b>${anEsc_(p.s)}</b>`},
    {k:'team',l:AN_.grp==='branch'?'Branch':'Team',f:p=>anEsc_(p.team||'—')},
    {k:'all',l:'Deals made',n:1,v:p=>p.cur.dn,f:p=>p.cur.dn},
    {k:'cw',l:'Cancelled deals',n:1,v:p=>p.cur.cw,f:p=>`<b>${p.cur.cw}</b>`},
    {k:'cc',l:'Clients who cancelled',n:1,f:p=>p.cc?`<b>${p.cc}</b> ▸`:'0'},
    {k:'wc',l:'Cancel %',n:1,f:p=>anP_(p.wc),cls:p=>p.wc>40?'dn':''},
    {k:'pcanc',l:'Before',n:1,f:p=>anP_(p.pcanc)},
    {k:'chg',l:'Change',n:1,v:p=>p.wc!=null&&p.pcanc!=null?p.wc-p.pcanc:null,f:p=>anPP_(p.wc,p.pcanc,true)},
    {k:'lost',l:'Value lost',n:1,f:p=>anM_(p.lost)},
    {k:'why',l:'Top reason',v:p=>Object.entries(p.cur.reasons).sort((a,b)=>b[1]-a[1])[0]?.[0]||'',f:p=>{const t=Object.entries(p.cur.reasons).sort((a,b)=>b[1]-a[1])[0];return t?`${anEsc_(t[0].slice(0,40))} <small class="eq">(${t[1]})</small>`:'—';}}
  ],cp,{sort:{k:'cw',d:-1},rowAttr:p=>p.cc?` data-cx="${anEsc_(p.s)}"`:'',
    after:p=>AN_.open['c|'+p.s]?`<tr class="anSub"><td colspan="10">${p.cur.cl.map(r=>`<b>${anEsc_(anClient_(r))}</b> · ${anEsc_(r.unitCode||'')} · ${anEsc_(r.project||'')} · ${anM_(r.amount)} · <span class="eq">${anEsc_(r.cancelDate||'')} ${anEsc_(String(r.cancelReason||'').slice(0,60))}</span>`).join('<br>')}</td></tr>`:''});

  // insights
  const ins=[];
  if(B.v)ins.push([A.v>=B.v?'g':'r',`Sales are <b>${anTxt_(anD_(A.v,B.v))}</b> compared with ${AN_.cmp==='ly'?'the same period last year':'the period before'} (${anM_(A.v)} vs ${anM_(B.v)} ${AN_.cur}).`]);
  if(pace&&B.v)ins.push([pace>=B.v?'g':'r',`At this month’s pace the month ends near <b>${anM_(pace)}</b> — ${pace>=B.v?'above':'below'} ${anM_(B.v)}.`]);
  const tUp=T.filter(t=>t.b.v>0).sort((x,y)=>(y.a.v/y.b.v)-(x.a.v/x.b.v));
  if(tUp.length>1){ins.push(['g',`Best moving ${AN_.grp==='branch'?'branch':'team'}: <b>${anEsc_(tUp[0].g)}</b> ${anTxt_(anD_(tUp[0].a.v,tUp[0].b.v))}.`]);
    const w=tUp[tUp.length-1];if(w.a.v<w.b.v)ins.push(['r',`Biggest drop: <b>${anEsc_(w.g)}</b> ${anTxt_(anD_(w.a.v,w.b.v))} (${anM_(w.a.v)} vs ${anM_(w.b.v)}).`]);}
  if(T[0]&&A.v)ins.push(['',`<b>${anEsc_(T[0].g)}</b> brings ${anP_(T[0].a.v/A.v*100)} of all sales in the period.`]);
  const ppl=people.filter(o=>o.cur.all>=3);
  const hiC=[...ppl].sort((x,y)=>(y.canc||0)-(x.canc||0))[0];if(hiC&&hiC.canc>=30)ins.push(['r',`Highest cancel rate: <b>${anEsc_(hiC.s)}</b> — ${anP_(hiC.canc)} (${anNum_(hiC.cn)} deals, ${hiC.cc} clients).`]);
  const climb=people.filter(p=>p.mv>=2).sort((a,b)=>b.mv-a.mv)[0];if(climb)ins.push(['g',`<b>${anEsc_(climb.s)}</b> climbed ${climb.mv} places to #${climb.rk}.`]);
  const fall=people.filter(p=>p.mv<=-2).sort((a,b)=>a.mv-b.mv)[0];if(fall)ins.push(['r',`<b>${anEsc_(fall.s)}</b> dropped ${-fall.mv} places to #${fall.rk}.`]);
  const zero=people.filter(o=>o.prev.n>0&&o.cur.n===0).map(o=>o.s);if(zero.length)ins.push(['r',`No sales this period after selling before: <b>${zero.slice(0,5).map(anEsc_).join(', ')}</b>${zero.length>5?' …':''}.`]);

  return kpis+`<div class="anIns" style="margin-bottom:14px">${ins.map(([c,t])=>`<div class="${c}">${t}</div>`).join('')||'<div>No comparison yet for this period.</div>'}</div>`+
    `<div class="anGrid">${anCard_(`${AN_.grp==='branch'?'Branches':'Teams'} compared`,teamTable,'w12',anPerLabel_())}</div>`+
    `<div class="anGrid">${anCard_('Sales per month — 6 months',cols,'w6',AN_.cur)}${anCard_(`Month by month per ${AN_.grp==='branch'?'branch':'team'}`,heat,'w6')}</div>`+
    `<div class="anGrid">${anCard_('Salespeople · ranking',peopleTable,'w12',`${people.length} people`)}</div>`+
    `<div class="anGrid">${anCard_('Cancellations per salesperson',cancTable+'<div class="anNote">Click a row to see the clients who cancelled · deals made = all deals in the period incl. cancelled · a shared deal counts fully for both salespeople here</div>','w12',anPerOnly_())}</div>`;
}

/* ================= TAB 2 · FORECAST & TARGETS ================= */
function anTgVal_(scope,name,k){ // target for one month (monthly › quarter÷3 › year÷12)
  const rows=(AN_.tg&&AN_.tg.rows)||[],y=Math.floor(k/12),m=k%12,key=AN_.cur==='USD'?'targetUSD':'targetEGP';
  const MN=['january','february','march','april','may','june','july','august','september','october','november','december'];
  const nn=anNorm_(name);
  const mine=rows.filter(t=>String(t.scope||'').toLowerCase()===scope.toLowerCase()&&Number(t.year)===y&&(scope==='Company'||anNorm_(t.name)===nn));
  const sum=l=>l.reduce((a,t)=>a+(Number(t[key])||0),0),per=p=>mine.filter(t=>String(t.period||'Yearly').toLowerCase()===p);
  const mo=sum(per('monthly').filter(t=>String(t.month||'').trim().toLowerCase()===MN[m]));if(mo)return mo;
  const q=sum(per('quarterly').filter(t=>String(t.quarter||'').trim().toUpperCase()==='Q'+(Math.floor(m/3)+1)));if(q)return q/3;
  const yr=sum(per('yearly'));return yr?yr/12:0;
}
function anTgRange_(scope,name,a,b){let s=0;for(let k=a;k<=b;k++)s+=anTgVal_(scope,name,k);return s;}
function anLoadTargets_(){
  if(AN_.tg||AN_.tgLoading)return;AN_.tgLoading=true;
  google.script.run.withSuccessHandler(d=>{AN_.tg=d||{rows:[]};AN_.tgLoading=false;if(AN_.tab==='fc')anRender_();})

  const days=anMedian_(S.map(r=>Number(r.daysToClose)).filter(x=>x>0&&x<400));

  // speed between stages (deals made in the period)
  const ok=d=>d!=null&&d>=0&&d<1000;
  const sp=[['Reservation → down payment',r=>anDays_(anDate_(r),anParseDate_(r.dpDate))],['Down payment → client signed',r=>anDays_(anParseDate_(r.dpDate),anParseDate_(r.clientSignDate))],
    ['Client signed → company signed',r=>anDays_(anParseDate_(r.clientSignDate),anParseDate_(r.companySignDate))],['Reservation → client signed',r=>anDays_(anDate_(r),anParseDate_(r.clientSignDate))],
    ['Reservation → closed',r=>anDone_(r)&&Number(r.daysToClose)>0?Number(r.daysToClose):null],['Reservation → cancelled',r=>anCanc_(r)?anDays_(anDate_(r),anParseDate_(r.cancelDate)):null]];
  const spRows=sp.map(([l,f])=>{const a=cur.map(f).filter(ok);return {l,n:a.length,med:anMedian_(a),avg:a.length?a.reduce((x,y)=>x+y,0)/a.length:null,slow:a.length?a.filter(x=>x>60).length:0};});
  const spMax=Math.max(1,...spRows.map(x=>x.med||0));
  const speed=`<div class="anScroll"><table class="anT"><thead><tr><th>Step</th><th></th><th class="n">Median days</th><th class="n">Average</th><th class="n">&gt;60 d</th><th class="n">Dated</th></tr></thead><tbody>${spRows.map(x=>`<tr><td>${x.l}</td><td>${x.med!=null?anPg_(x.med/spMax*100,'#5b6b85'):''}</td><td class="n"><b>${x.med!=null?Math.round(x.med):'—'}</b></td><td class="n">${x.avg!=null?Math.round(x.avg):'—'}</td><td class="n">${x.slow||'—'}</td><td class="n">${x.n}</td></tr>`).join('')}</tbody></table></div><div class="anNote">Uses the dates written on the deal (DP date, client / company sign date, cancel date). Steps with few dates are less reliable.</div>`;
  // speed per salesperson
  const SP={};cur.forEach(r=>anCredits_(r).forEach(([s])=>{const o=SP[s]=SP[s]||{s,sign:[],canc:[],close:[],openAge:[],n:0};o.n++;
    const a=anDays_(anDate_(r),anParseDate_(r.clientSignDate));if(ok(a))o.sign.push(a);
    if(anCanc_(r)){const c=anDays_(anDate_(r),anParseDate_(r.cancelDate));if(ok(c))o.canc.push(c);}
    else if(anDone_(r)&&Number(r.daysToClose)>0)o.close.push(Number(r.daysToClose));
    else o.openAge.push(ageOf(r));}));
  const spTab=anTbl_('vel',[{k:'s',l:'Salesperson',f:o=>`<b>${anEsc_(o.s)}</b>`},{k:'n',l:'Deals',n:1},
    {k:'sign',l:'Days to client sign',n:1,v:o=>anMedian_(o.sign),f:o=>{const m=anMedian_(o.sign);return m!=null?Math.round(m):'—';}},
    {k:'close',l:'Days to close',n:1,v:o=>anMedian_(o.close),f:o=>{const m=anMedian_(o.close);return m!=null?Math.round(m):'—';}},
    {k:'canc',l:'Days to cancel',n:1,v:o=>anMedian_(o.canc),f:o=>{const m=anMedian_(o.canc);return m!=null?Math.round(m):'—';}},
    {k:'open',l:'Open deals',n:1,v:o=>o.openAge.length,f:o=>o.openAge.length||'—'},
    {k:'age',l:'Median open age',n:1,v:o=>anMedian_(o.openAge),f:o=>{const m=anMedian_(o.openAge);return m!=null?Math.round(m)+' d':'—';},cls:o=>(anMedian_(o.openAge)||0)>45?'dn':''}],Object.values(SP),{sort:{k:'n',d:-1},h:360});

  // bottlenecks: where open deals are waiting now (all dates)
  const open=S.filter(r=>!anCanc_(r)&&!anDone_(r));
  const lim={reservation:7,review:7,part:30,total:30,csPart:30,csTotal:30,coPart:60,coTotal:60};
  const bn={};open.forEach(r=>{let s=anStage_(r);if(!AN_STAGE_L_[s])s='reservation';const o=bn[s]=bn[s]||{s,n:0,v:0,late:0,ages:[]};o.n++;o.v+=Number(r.amount)||0;const a=ageOf(r);if(a!=null){o.ages.push(a);if(a>lim[s])o.late++;}});
  const bnRows=Object.keys(AN_STAGE_L_).filter(k=>bn[k]).map(k=>bn[k]);
  const worst=[...bnRows].sort((a,b)=>b.late-a.late)[0];
  const bnHtml=`<div class="anScroll"><table class="anT"><thead><tr><th>Waiting at</th><th class="n">Deals</th><th class="n">Value</th><th class="n">Median wait</th><th class="n">Late</th></tr></thead><tbody>${bnRows.map(o=>`<tr><td>${o===worst&&o.late?'🔴 ':''}${AN_STAGE_L_[o.s]}</td><td class="n">${o.n}</td><td class="n">${anM_(o.v)}</td><td class="n">${o.ages.length?Math.round(anMedian_(o.ages))+' d':'—'}</td><td class="n ${o.late?'dn':''}">${o.late}</td></tr>`).join('')}</tbody></table></div><div class="anNote">Open deals of every date, by where they are now · late = reservation over 7 days, DP / client signed over 30, company signed over 60 (days since reservation)${worst&&worst.late?` · biggest jam: <b>${AN_STAGE_L_[worst.s]}</b>`:''}</div>`;

  // reservation cohorts
  const coh=months.map(k=>{const rs=S.filter(r=>anYm_(r)===k),N=rs.length;
    const sd=r=>{const a=anDays_(anDate_(r),anParseDate_(r.clientSignDate)||anParseDate_(r.companySignDate));if(ok(a))return a;if(anSigned_(r)&&Number(r.daysToClose)>0)return Number(r.daysToClose);return null;};
    const w=d=>{const s=rs.filter(r=>!anCanc_(r)&&anSigned_(r)),known=s.map(sd).filter(x=>x!=null);return known.length<Math.max(1,s.length*.3)?null:s.filter(r=>{const x=sd(r);return x!=null&&x<=d;}).length/N*100;};
    return {k,N,canc:N?rs.filter(anCanc_).length/N*100:null,sig:N?rs.filter(r=>!anCanc_(r)&&anSigned_(r)).length/N*100:null,open:N?rs.filter(r=>!anCanc_(r)&&!anSigned_(r)).length/N*100:null,d30:N?w(30):null,d60:N?w(60):null,d90:N?w(90):null};});
  const hc=(v,c)=>v==null?'<td class="n eq">—</td>':`<td class="n h" style="background:${c}${(.08+v/100*.5).toFixed(2)})">${Math.round(v)}%</td>`;
  const cohort=`<div class="anScroll"><table class="anT anHeat"><thead><tr><th>Reserved in</th><th class="n">Deals</th><th class="n">Signed ≤30 d</th><th class="n">≤60 d</th><th class="n">≤90 d</th><th class="n">Signed now</th><th class="n">Still open</th><th class="n">Cancelled</th></tr></thead><tbody>${coh.filter(c=>c.N).reverse().map(c=>`<tr><td>${anYmLabel_(c.k)}</td><td class="n">${c.N}</td>${hc(c.d30,'rgba(47,154,99,')}${hc(c.d60,'rgba(47,154,99,')}${hc(c.d90,'rgba(47,154,99,')}${hc(c.sig,'rgba(47,154,99,')}${hc(c.open,'rgba(227,178,79,')}${hc(c.canc,'rgba(209,47,47,')}</tr>`).join('')}</tbody></table></div><div class="anNote">Each row = deals reserved that month and what happened to them since · “≤30 d” needs sign dates on the deals (— when too few)</div>`;

  // day / week heatmap of reservations
  const order=[6,0,1,2,3,4,5],dn=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
  const H=[...Array(5)].map(()=>Array(7).fill(0));cur.forEach(r=>{const d=anDate_(r);if(!d||!Number(r.day))return;const w=Math.min(4,Math.floor((d.getDate()-1)/7));H[w][order.indexOf(d.getDay())]++;});
  const hMax=Math.max(1,...H.flat()),colT=order.map((_,j)=>H.reduce((a,row)=>a+row[j],0));
  const heat=`<div class="anHm"><div class="hd"></div>${dn.map(d=>`<div class="hd">${d}</div>`).join('')}<div class="hd">Total</div>${H.map((row,i)=>`<div class="rl">Week ${i+1}</div>${row.map(v=>`<div style="background:rgba(176,124,30,${(v/hMax*.7+.04).toFixed(2)})">${v||''}</div>`).join('')}<div><b>${row.reduce((a,x)=>a+x,0)}</b></div>`).join('')}<div class="rl">Total</div>${colT.map(v=>`<div><b>${v}</b></div>`).join('')}<div></div></div><div class="anNote">Reservations in the period by weekday and week of the month (week 1 = days 1–7)</div>`;
  const best=colT.indexOf(Math.max(...colT));

  return `<div class="anGrid">${anCard_('How far the deals got',anBars_(funnel,{color:'#2f9a63'})+'<div class="anNote">Of the non-cancelled deals made in the period</div>','w6',anPerOnly_())}
    ${anCard_('Cancellations',`<div class="anBig"><div><b>${canc.length}</b><span>cancelled</span></div><div><b>${new Set(canc.map(anCk_)).size}</b><span>clients</span></div><div><b>${anP_(cur.length?canc.length/cur.length*100:null)}</b><span>cancel rate</span></div><div><b>${anM_(lost)}</b><span>value lost ${AN_.cur}</span></div><div><b>${days!=null?Math.round(days):'—'}</b><span>median days to close</span></div></div>`,'w6')}</div>
   <div class="anGrid">${anCard_('Speed between steps',speed,'w6',anPerOnly_())}${anCard_('Where deals are stuck now',bnHtml,'w6')}</div>
   <div class="anGrid">${anCard_('Speed per salesperson',spTab,'w12')}</div>
   <div class="anGrid">${anCard_('Reservation cohorts',cohort,'w8')}${anCard_('Busiest days',heat+(colT[best]?`<div class="anNote">Busiest day: <b>${dn[best]}</b></div>`:''),'')}</div>
   <div class="anGrid">${anCard_('Cancel rate per month',anCols_(months.map(anYmLabel_),[{name:'Cancel %',color:'#d12f2f',values:cr}],{top:i=>cr[i]?Math.round(cr[i])+'%':''}),'w6')}
    ${anCard_('Why deals were cancelled',anBars_(Object.entries(reasons).sort((a,b)=>b[1]-a[1]).slice(0,8),{color:'#d12f2f'}),'w6')}</div>
   <div class="anGrid">${anCard_('Cancel rate by source',anBars_(cBy('sourceType'),{fmt:v=>anP_(v),color:'#d12f2f'}),'w6')}${anCard_('Cancel rate by project',anBars_(cBy('project'),{fmt:v=>anP_(v),color:'#d12f2f'}),'w6')}</div>`;
}

/* ================= TAB 5 · CLIENTS & SOURCES ================= */
function anClients_(){

    {k:'cn',l:'Cancelled',n:1},{k:'canc',l:'Cancel %',n:1,f:o=>anP_(o.canc),cls:o=>o.canc>40?'dn':''},{k:'disc',l:'Avg disc.',n:1,f:o=>anP_(o.disc)}],rows,{sort:{k:'v',d:-1},h:460});
  return `<div class="anGrid">${anCard_('Sources, campaigns and brokers',perf+'<div class="anNote">Deals made in the period · signed = share of live deals that reached client signing · click a column to sort</div>','w12',anSegH_('src',[['sourceType','Source type'],['mainSource','Main source'],['campaignName','Campaign'],['brokerageCompany','Broker'],['mediaBuyer','Media buyer']],AN_.src)+' &nbsp;'+anPerLabel_())}</div>
   <div class="anGrid">${anCard_('Nationality',anBars_(cnt('nationality'),{color:'#5b6b85'}),'',anPerOnly_())}${anCard_('Client type',anBars_(cnt('clientType'),{color:AN_PAL_}),'')}
   ${anCard_('Clients',`<div class="anBig"><div><b>${anN_(newC)}</b><span>first-time buyers</span></div><div><b>${anN_(live.length-newC)}</b><span>bought before</span></div><div><b>${anN_(rep.length)}</b><span>clients with 2+ deals (all time)</span></div></div>`,'')}</div>

   ${anCard_('Main source · sales',anBars_(Object.entries(live.reduce((o,r)=>{const k=String(r.mainSource||'—').trim()||'—';o[k]=(o[k]||0)+(Number(r.amount)||0);return o;},{})).sort((a,b)=>b[1]-a[1]).slice(0,6),{fmt:anM_,color:AN_PAL_}),'w6')}</div>`;

/* ================= TAB 6 · COLLECTIONS & INVENTORY ================= */
function anMoney_(){
  const S=anScope_().filter(r=>!anCanc_(r)),R=anRange_(),today=new Date(),t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const cur=S.filter(r=>anIn_(r,R.a,R.b));

  const openDP=r=>Math.max(0,(Number(r.actualDP)||0)-(Number(r.dpPaid)||0));
  const unpaid=S.filter(r=>openDP(r)>1).sort((x,y)=>openDP(y)-openDP(x));
  // deals by unit, to link installments to a salesperson
  const byUnit={};S.forEach(r=>{const u=String(r.unitCode||'').trim().toUpperCase();if(u)byUnit[u]=r;});
  const filt=anActive_().length>0;
  let inst='<div class="anNote">Loading installments…</div>',rows=[];
  if(AN_.inst&&AN_.inst.err)inst=`<div class="anNote">${anEsc_(AN_.inst.err)}</div>`;
  else if(AN_.inst){
    rows=(AN_.inst.rows||[]).filter(x=>((/usd/i.test(x.currency)?'USD':'EGP')===AN_.cur)&&(!filt||byUnit[String(x.unitCode||'').trim().toUpperCase()]));
    const mOf=x=>{const d=anParseDate_(x.due);return d?d.getFullYear()*12+d.getMonth():null;};
    const inP=rows.filter(x=>{const k=mOf(x);return k!=null&&k>=R.a&&k<=R.b;});
    const dueP=inP.reduce((a,x)=>a+x.amount,0),paidP=inP.reduce((a,x)=>a+Math.min(x.paid,x.amount),0);
    const b=[0,0,0,0];rows.forEach(x=>{const d=anParseDate_(x.due);const left=x.amount-x.paid;if(!d||left<=1||d>=t0)return;const age=(t0-d)/864e5;b[age<=30?0:age<=60?1:age<=90?2:3]+=left;});
    const nm=anNowYm_(),next=[...Array(6)].map((_,i)=>nm+i),nv=next.map(k=>rows.filter(x=>mOf(x)===k).reduce((a,x)=>a+Math.max(0,x.amount-x.paid),0));
    inst=`<div class="anBig"><div><b>${anM_(paidP)}</b><span>collected of ${anM_(dueP)} due in the period</span></div><div><b>${anP_(dueP?paidP/dueP*100:null)}</b><span>collection rate</span></div><div><b>${anM_(b.reduce((a,x)=>a+x,0))}</b><span>overdue now</span></div></div>
      <div style="margin-top:10px">${anBars_([['1–30 days',b[0]],['31–60 days',b[1]],['61–90 days',b[2]],['90+ days',b[3]]],{fmt:anM_,color:['#e3b24f','#e0703f','#d12f2f','#8f1f1f']})}</div>
      <h3 style="margin-top:12px">Still to collect · next 6 months</h3>${anCols_(next.map(anYmLabel_),[{name:'Due',color:'#2f9a63',values:nv}])}`;
  }
  // collection risk: open DP + overdue installments per deal
  const risk={};
  const rk=r=>{const u=String(r.unitCode||'').trim().toUpperCase();return risk[u]=risk[u]||{r,u,dp:0,od:0,late:0,n:0};};
  unpaid.forEach(r=>{rk(r).dp=openDP(r);});
  rows.forEach(x=>{const u=String(x.unitCode||'').trim().toUpperCase(),r=byUnit[u];const d=anParseDate_(x.due),left=x.amount-x.paid;if(!r||!d||left<=1||d>=t0)return;const o=rk(r);o.od+=left;o.n++;o.late=Math.max(o.late,Math.round((t0-d)/864e5));});
  const RL=Object.values(risk).map(o=>({...o,tot:o.dp+o.od,client:anClient_(o.r),sales:String(o.r.salesName||'—'),age:(()=>{const d=anDate_(o.r);return d?Math.floor((today-d)/864e5):null;})()})).filter(o=>o.tot>1);
  const riskDeals=anTbl_('risk',[{k:'u',l:'Unit',f:o=>`<b>${anEsc_(o.r.unitCode||'')}</b>`},{k:'client',l:'Client'},{k:'sales',l:'Salesperson'},
    {k:'dp',l:'Open DP',n:1,f:o=>o.dp?anM_(o.dp):'—'},{k:'od',l:'Overdue inst.',n:1,f:o=>o.od?anM_(o.od):'—'},{k:'late',l:'Days late',n:1,f:o=>o.late||'—',cls:o=>o.late>60?'dn':''},
    {k:'tot',l:'At risk',n:1,f:o=>`<b>${anM_(o.tot)}</b>`},{k:'age',l:'Deal age',n:1,f:o=>o.age!=null?o.age+' d':'—'}],RL,{sort:{k:'tot',d:-1},limit:40,h:420});
  const PS={};RL.forEach(o=>anCredits_(o.r).forEach(([s,w])=>{const p=PS[s]=PS[s]||{s,n:0,dp:0,od:0,late:0};p.n+=w;p.dp+=o.dp*w;p.od+=o.od*w;p.late=Math.max(p.late,o.late);}));
  const riskPeople=anTbl_('riskp',[{k:'s',l:'Salesperson',f:o=>`<b>${anEsc_(o.s)}</b>`},{k:'n',l:'Deals',n:1,f:o=>anNum_(o.n)},{k:'dp',l:'Open DP',n:1,f:o=>anM_(o.dp)},{k:'od',l:'Overdue inst.',n:1,f:o=>anM_(o.od)},
    {k:'tot',l:'At risk',n:1,v:o=>o.dp+o.od,f:o=>`<b>${anM_(o.dp+o.od)}</b>`},{k:'late',l:'Oldest late',n:1,f:o=>o.late?o.late+' d':'—'}],Object.values(PS),{sort:{k:'tot',d:-1},h:420});
  // inventory
  const projs=[...new Set(anScope_().map(r=>String(r.project||'')))];
  const invKeys=projs.filter(p=>/eden walk|ccg|gldani/i.test(p));
  const invHtml=invKeys.map(p=>{
    const d=AN_.inv[p];if(!d)return anCard_(`Inventory · ${anEsc_(p)}`,'<div class="anNote">Loading…</div>','w6');
    if(d.err)return anCard_(`Inventory · ${anEsc_(p)}`,`<div class="anNote">${anEsc_(d.err)}</div>`,'w6');
    const rows=(d.rows||[]).filter(x=>!/^(divided|share)$/i.test(String(x.status||'').trim()));
    const kind=s=>{s=String(s||'').trim().toLowerCase();return /closed|done|sold|deliver/.test(s)?'Sold':/reserv/.test(s)?'Reserved':s==='available'?'Available':'Not on sale';};
    const fl={};rows.forEach(x=>{const f=String(x.floor||'—').trim()||'—';(fl[f]=fl[f]||{Sold:0,Reserved:0,Available:0,'Not on sale':0})[kind(x.status)]++;});
    const C={Sold:'#178a4c',Reserved:'#e3b24f',Available:'#3b6fd8','Not on sale':'#e2d7c4'};
    const avail=rows.filter(x=>kind(x.status)==='Available').length;
    const n=anNowYm_(),sold90=anScope_().filter(r=>String(r.project)===p&&!anCanc_(r)&&anIn_(r,n-2,n)).length;

    const availV=rows.filter(x=>kind(x.status)==='Available').reduce((a,x)=>a+(Number(String(x.totalPrice||'').replace(/[^\d.]/g,''))||0),0);
    return anCard_(`Inventory · ${anEsc_(p)}`,`<div class="anBig"><div><b>${avail}</b><span>units available</span></div><div><b>${sold90}</b><span>deals last 3 months</span></div><div><b>${months!=null?(Math.round(months*10)/10):'—'}</b><span>months of stock at this pace</span></div><div><b>${availV?anM_(availV):'—'}</b><span>value available</span></div></div>
      <div style="margin-top:12px">${Object.entries(fl).slice(0,10).map(([f,c])=>{const t=Object.values(c).reduce((a,x)=>a+x,0)||1;return `<div class="anB"><span class="l">${anEsc_(f)}</span><span class="anStk">${Object.keys(C).map(k=>`<i title="${k}: ${c[k]}" style="width:${c[k]/t*100}%;background:${C[k]}"></i>`).join('')}</span><b>${c.Sold+c.Reserved}/${c.Sold+c.Reserved+c.Available}</b></div>`;}).join('')}</div>
      <div class="anLg">${Object.entries(C).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}<span>· sold+reserved / on sale</span></div>`,'w6');
  }).join('');
  const rTot=RL.reduce((a,o)=>a+o.tot,0);
  return `<div class="anGrid">${anCard_('Down payments',`<div class="anBig"><div><b>${anM_(paid)}</b><span>paid of ${anM_(due)} due</span></div><div><b>${anP_(due?paid/due*100:null)}</b><span>collected</span></div><div><b>${anN_(unpaid.length)}</b><span>deals with DP still open (all time)</span></div></div>
      <h3 style="margin-top:12px">Largest open down payments</h3>${unpaid.slice(0,6).map(r=>`<div class="anB"><span class="l">${anEsc_(r.unitCode||'')} · ${anEsc_(anClient_(r))}</span><span></span><b>${anM_(openDP(r))}</b></div>`).join('')||'<div class="anNote">None.</div>'}`,'w6',anPerOnly_())}
    ${anCard_('Installments',inst,'w6')}</div>
    <div class="anGrid">${anCard_('Collection risk · per salesperson',riskPeople,'w12',`${anM_(rTot)} ${AN_.cur} at risk`)}</div>
    <div class="anGrid">${anCard_(`Collection risk · deals`,riskDeals+`<div class="anNote">Open down payment + installments past their due date · ${RL.length} deals (top 40 shown) · ${anM_(rTot)} ${AN_.cur} at risk${AN_.inst?'':' · installments loading'}</div>`,'w12')}</div>
    <div class="anGrid">${invHtml||anCard_('Inventory','<div class="anNote">No inventory sheet is linked for this project.</div>','w12')}</div>`;
}
function anLoadInv_(){
  const projs=[...new Set(anScope_().map(r=>String(r.project||'')))];
  projs.filter(p=>/eden walk|ccg|gldani/i.test(p)).forEach(p=>{
    if(AN_.inv[p]||AN_.inv[p+'_l'])return;AN_.inv[p+'_l']=1;

      .withFailureHandler(e=>{AN_.inv[p]={err:String(e&&e.message||e)};if(AN_.tab==='money'||AN_.tab==='sales')anRender_();}).getInventoryData(AUTH_TOKEN,p,false);
  });
}
function anLoadMoney_(){
  if(!AN_.inst&&!AN_.instLoading){AN_.instLoading=true;google.script.run.withSuccessHandler(d=>{AN_.inst=d||{rows:[]};AN_.instLoading=false;if(AN_.tab==='money')anRender_();})
    .withFailureHandler(e=>{AN_.inst={err:'Installments could not be loaded: '+(e&&e.message||e)};AN_.instLoading=false;if(AN_.tab==='money')anRender_();}).getInstallmentsOverview(AUTH_TOKEN);}
  anLoadInv_();
}

/* ---------- filter bar ---------- */
function anFilterBar_(){
  const el=document.getElementById('an');if(!el)return;
  const dims=AN_DIMS_.filter((_,i)=>i<AN_MAIN_DIMS_||AN_.more||(AN_.f[AN_DIMS_[i][0]]||[]).length);
  const views=anViews_(),vn=Object.keys(views);
  el.querySelector('.anFl').innerHTML=dims.map(([k,l])=>{const c=(AN_.f[k]||[]).length;return `<button type="button" class="anFb ${c?'on':''}" data-dim="${k}">${l}${c?` <em>${c}</em>`:''} ▾</button>`;}).join('')+
    `<button type="button" class="anFb ghost" data-more>${AN_.more?'− Fewer':'+ More filters'}</button>
     <button type="button" class="anFb lnk" data-ov title="Copy the filters you picked on the Overview page">⇢ Use Overview filters</button>
     <select data-views title="Saved views"><option value="">★ Saved views${vn.length?` (${vn.length})`:''}</option>${vn.map(v=>`<option value="v:${anEsc_(v)}">${anEsc_(v)}</option>`).join('')}<option value="save">＋ Save this view…</option>${vn.length?'<option value="del">🗑 Delete a view…</option>':''}</select>`;
  const act=anActive_();
  el.querySelector('.anChips').innerHTML=act.length?act.map(([k,l])=>{const v=AN_.f[k];return `<span class="anChip">${l}: <b>${v.length>2?v.length+' selected':v.map(anEsc_).join(', ')}</b><button type="button" data-unf="${k}" aria-label="Remove">×</button></span>`;}).join('')+'<button type="button" class="anFb lnk" data-clear>Clear all</button>':'';
  el.querySelectorAll('[data-dim]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();anPop_(b);}));
  el.querySelector('[data-more]').addEventListener('click',()=>{AN_.more=!AN_.more;anFilterBar_();});
  el.querySelector('[data-ov]').addEventListener('click',anFromOverview_);
  el.querySelector('[data-views]').addEventListener('change',e=>anViewPick_(e.target));
  el.querySelectorAll('[data-unf]').forEach(b=>b.addEventListener('click',()=>{delete AN_.f[b.dataset.unf];anChanged_();}));
  const cl=el.querySelector('[data-clear]');if(cl)cl.addEventListener('click',()=>{AN_.f={};anChanged_();});
}
function anChanged_(){
  // picking projects that share one currency switches the currency
  const p=AN_.f.project||[];if(p.length&&typeof projectCurrency_==='function'){const cs=[...new Set(p.map(x=>projectCurrency_({project:x})))];if(cs.length===1)AN_.cur=cs[0];}
  AN_._S=null;anFilterBar_();anRender_();
}
function anPopClose_(){document.querySelector('.anPop')?.remove();document.removeEventListener('click',anPopOut_,true);}
function anPopOut_(e){const p=document.querySelector('.anPop');if(p&&!p.contains(e.target)&&!e.target.closest('[data-dim]'))anPopClose_();}
function anPop_(btn){
  const k=btn.dataset.dim,was=document.querySelector('.anPop');anPopClose_();if(was&&was.dataset.dim===k)return;
  const all=(typeof rawRows!=='undefined'&&rawRows)||[],R=anRange_(),cnt={};
  all.forEach(r=>anVals_(r,k).forEach(v=>{if(!(v in cnt))cnt[v]=0;}));
  all.forEach(r=>{if(anCurOf_(r)!==AN_.cur||!anIn_(r,R.a,R.b)||!anMatch_(r,k))return;anVals_(r,k).forEach(v=>cnt[v]++);});
  const sel=new Set(AN_.f[k]||[]);
  const list=Object.keys(cnt).sort((a,b)=>(sel.has(b)-sel.has(a))||(cnt[b]-cnt[a])||a.localeCompare(b));
  const pop=document.createElement('div');pop.className='anPop';pop.dataset.dim=k;
  pop.innerHTML=`<div class="h"><input type="search" placeholder="Search ${anEsc_(AN_DIMS_.find(d=>d[0]===k)[1].toLowerCase())}…"><div><span>${list.length} options · count = deals in period</span><span><button type="button" data-a="only">Select shown</button> <button type="button" data-a="none">None</button></span></div></div>
    <div class="l">${list.map(v=>`<label class="${cnt[v]?'':'z'}"><input type="checkbox" value="${anEsc_(v)}"${sel.has(v)?' checked':''}><span>${anEsc_(v)}</span><small>${cnt[v]}</small></label>`).join('')}</div>`;
  document.body.appendChild(pop);
  const b=btn.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(window.innerWidth-298,b.left))+'px';pop.style.top=(b.bottom+6)+'px';
  pop.style.maxHeight=Math.max(220,Math.min(420,window.innerHeight-b.bottom-20))+'px';
  let t=0;const apply=()=>{clearTimeout(t);t=setTimeout(()=>{const v=[...pop.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(v.length)AN_.f[k]=v;else delete AN_.f[k];anChanged_();
    const nb=document.querySelector(`#an [data-dim="${k}"]`);if(nb){const r=nb.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(window.innerWidth-298,r.left))+'px';pop.style.top=(r.bottom+6)+'px';}},180);};
  const q=pop.querySelector('input[type=search]');
  q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();pop.querySelectorAll('label').forEach(l=>l.style.display=!s||l.textContent.toLowerCase().includes(s)?'':'none');});
  pop.querySelectorAll('input[type=checkbox]').forEach(c=>c.addEventListener('change',apply));
  pop.querySelector('[data-a=none]').addEventListener('click',()=>{pop.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);apply();});
  pop.querySelector('[data-a=only]').addEventListener('click',()=>{pop.querySelectorAll('label').forEach(l=>{l.querySelector('input').checked=l.style.display!=='none';});apply();});
  setTimeout(()=>{q.focus();document.addEventListener('click',anPopOut_,true);},0);
}
/* Copy what is ticked on the Overview page. */
function anFromOverview_(){
  if(typeof getMulti!=='function')return;
  const map={project:'project',sales:'sales',salesManager:'salesManager',dealStatus:'dealType',status:'status',branch:'branch',sourceType:'sourceType',mainSource:'mainSource',campaignName:'campaignName',brokerageCompany:'brokerageCompany',unitType:'unitCategory',nationality:'nationality',clientType:'clientType'};
  const f={};Object.entries(map).forEach(([k,n])=>{const v=getMulti(n);if(v.length)f[k]=v;});
  const ys=getMulti('year').map(Number).filter(Boolean),ms=getMulti('month').map(Number).filter(Boolean);
  if(!Object.keys(f).length&&!ys.length&&!ms.length){alert('No filters are picked on the Overview page.');return;}
  if(ys.length||ms.length){const y0=ys.length?Math.min(...ys):new Date().getFullYear(),y1=ys.length?Math.max(...ys):y0;
    AN_.from=anYmStr_(y0*12+(ms.length?Math.min(...ms):1)-1);AN_.to=anYmStr_(y1*12+(ms.length?Math.max(...ms):12)-1);AN_.per='custom';}
  AN_.f=f;
  anSyncBar_();anChanged_();
}
/* Saved views (this browser only). */
function anViews_(){try{return JSON.parse(localStorage.getItem('edenAnViews')||'{}')||{};}catch(e){return {};}}
function anViewsSave_(v){try{localStorage.setItem('edenAnViews',JSON.stringify(v));return true;}catch(e){alert('Views cannot be saved in this browser.');return false;}}
function anViewPick_(sel){
  const v=sel.value;sel.value='';const views=anViews_();
  if(v==='save'){const nm=(prompt('Name for this view (e.g. “Sheraton team · this quarter”):')||'').trim();if(!nm)return;
    views[nm]={f:AN_.f,per:AN_.per,from:AN_.from,to:AN_.to,cmp:AN_.cmp,cur:AN_.cur,grp:AN_.grp,tab:AN_.tab};if(anViewsSave_(views))anFilterBar_();return;}
  if(v==='del'){const nm=(prompt('Type the name of the view to delete:\n'+Object.keys(views).join('\n'))||'').trim();if(nm&&views[nm]){delete views[nm];anViewsSave_(views);anFilterBar_();}return;}
  if(v.startsWith('v:')){const x=views[v.slice(2)];if(!x)return;Object.assign(AN_,{f:JSON.parse(JSON.stringify(x.f||{})),per:x.per||'m0',from:x.from||'',to:x.to||'',cmp:x.cmp||'prev',cur:x.cur||'EGP',grp:x.grp||'manager',tab:x.tab||AN_.tab});anSyncBar_();anChanged_();}
}
function anSyncBar_(){
  const el=document.getElementById('an');if(!el)return;
  ['per','cur','grp','cmp'].forEach(k=>el.querySelectorAll(`.anBar [data-${k}]`).forEach(x=>x.classList.toggle('on',x.dataset[k]===AN_[k])));
  const c=el.querySelector('.anCustom');c.style.display=AN_.per==='custom'?'':'none';
  const R=anRange_();el.querySelector('[data-from]').value=AN_.from||anYmStr_(R.a);el.querySelector('[data-to]').value=AN_.to||anYmStr_(R.b);
}

/* ---------- frame ---------- */
function anRender_(){
  const el=document.getElementById('an');if(!el)return;
  AN_._S=null;
  el.querySelector('.anPer').innerHTML=anPerLabel_();
  el.querySelectorAll('.daTabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===AN_.tab));
  anSyncBar_();
  el.querySelectorAll('.anBar [data-grp]').forEach(b=>b.closest('.anSeg').style.display=AN_.tab==='team'?'':'none');
  const body=el.querySelector('.daBody');
  if(!((typeof rawRows!=='undefined'&&rawRows)||[]).length){body.innerHTML='<div class="daNote" style="text-align:center;padding:40px">Loading data…</div>';return;}
  if(AN_.tab==='money')anLoadMoney_();
  if(AN_.tab==='sales'&&AN_.dem==='floor')anLoadInv_();
  const st=body.scrollTop;
  try{body.innerHTML=({team:anTeam_,fc:anFc_,sales:anSales_,journey:anJourney_,clients:anClients_,money:anMoney_}[AN_.tab]||anTeam_)();}
  catch(e){console.error(e);body.innerHTML=`<div class="daNote daMsg err" style="padding:30px">Something went wrong: ${anEsc_(e.message)}</div>`;}
  body.scrollTop=st;
  body.querySelectorAll('[data-sort]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;AN_.sort=AN_.sort.k===k?{k,d:-AN_.sort.d}:{k,d:k==='s'||k==='team'||k==='rk'?1:-1};anRender_();}));
  body.querySelectorAll('[data-tsort]').forEach(th=>th.addEventListener('click',()=>{const [id,k]=th.dataset.tsort.split('|');const s=AN_.sorts[id];AN_.sorts[id]=s&&s.k===k?{k,d:-s.d}:{k,d:/^(s|k|nm|u|client|sales|team)$/.test(k)?1:-1};anRender_();}));
  body.querySelectorAll('tr[data-cx]').forEach(tr=>tr.addEventListener('click',()=>{const k='c|'+tr.dataset.cx;AN_.open[k]=!AN_.open[k];anRender_();}));
  ['tgs','dem','src'].forEach(a=>body.querySelectorAll(`[data-${a}]`).forEach(b=>b.addEventListener('click',()=>{AN_[a]=b.dataset[a];anRender_();})));
}
function anClose_(){anPopClose_();document.getElementById('an')?.remove();document.getElementById('anBack')?.remove();document.removeEventListener('keydown',anKey_);}
function anKey_(e){if(e.key==='Escape'){if(document.querySelector('.anPop'))anPopClose_();else anClose_();}}
function anOpen_(){
  if(!anCan_()){alert('Analytics is not available for this account.');return;}
  anClose_();
  const back=document.createElement('div');back.className='daBack';back.id='anBack';back.addEventListener('click',anClose_);
  const el=document.createElement('section');el.className='da';el.id='an';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  const seg=anSegH_;
  el.innerHTML=`<div class="daHead"><div><small>EDEN BI</small><h2>📈 Analytics</h2></div><div class="daTools">${anAdmin_()?'<button type="button" class="daBtn" data-wk title="Weekly analytics report on Telegram">✈ Weekly report</button>':''}<button type="button" class="daBtn" data-pdf>⬇ PDF</button><button type="button" class="daBtn" data-xl>⬇ Excel</button><button type="button" class="daX" aria-label="Close">×</button></div></div>
    <div class="anBar">${seg('per',[['m0','This month'],['m1','Last month'],['q','3 months'],['ytd','This year'],['y12','12 months'],['custom','Custom']],AN_.per)}
      <span class="anCustom" style="display:none"><input type="month" data-from> to <input type="month" data-to></span>
      ${seg('cmp',[['prev','vs before'],['ly','vs last year']],AN_.cmp)}
      ${seg('cur',[['EGP','EGP'],['USD','USD']],AN_.cur)}
      ${seg('grp',[['manager','By team'],['branch','By branch']],AN_.grp)}
      <span class="anPer"></span></div>
    <div class="anFl"></div><div class="anChips"></div>
    <div class="daTabs">${AN_TABS_.map(([k,l])=>`<button type="button" class="daTab" data-tab="${k}">${l}</button>`).join('')}</div><div class="daBody"></div>`;
  document.body.append(back,el);
  el.querySelector('.daX').addEventListener('click',anClose_);
  el.querySelector('[data-xl]').addEventListener('click',anExcel_);
  el.querySelector('[data-pdf]').addEventListener('click',anPdf_);
  const wk=el.querySelector('[data-wk]');if(wk)wk.addEventListener('click',anWeekly_);
  el.querySelectorAll('.daTabs button').forEach(b=>b.addEventListener('click',()=>{AN_.tab=b.dataset.tab;el.querySelector('.daBody').scrollTop=0;anRender_();}));
  ['per','cur','grp','cmp'].forEach(a=>el.querySelectorAll(`.anBar [data-${a}]`).forEach(b=>b.addEventListener('click',()=>{
    if(a==='per'&&b.dataset.per==='custom'&&AN_.per!=='custom'){const R=anRange_();AN_.from=anYmStr_(R.a);AN_.to=anYmStr_(R.b);}
    AN_[a]=b.dataset[a];AN_._S=null;anFilterBar_();anRender_();})));
  el.querySelectorAll('.anCustom input').forEach(i=>i.addEventListener('change',()=>{AN_.from=el.querySelector('[data-from]').value;AN_.to=el.querySelector('[data-to]').value;anRender_();}));
  document.addEventListener('keydown',anKey_);
  anFilterBar_();anRender_();
}
function anFiltersText_(){
  const act=anActive_();
  return [anTxt_(anPerLabel_()),AN_.cur,...act.map(([k,l])=>l+': '+AN_.f[k].join(', '))].join(' · ');
}
/* PDF: the open tab with its filters, in a print window. */
function anPdf_(){
  const el=document.getElementById('an');if(!el)return;
  const css=(document.getElementById('eden-analytics')||{}).textContent||'';
  const tab=(AN_TABS_.find(t=>t[0]===AN_.tab)||[])[1]||'';
  const body=el.querySelector('.daBody').cloneNode(true);
  body.querySelectorAll('.anSeg').forEach(s=>s.remove());
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>EDEN Analytics · ${anEsc_(tab)}</title><style>${css}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:#221e19;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #an .daBody{background:#fff;padding:0 18px 20px}#an .anScroll{max-height:none!important;overflow:visible}#an .anC,#an .anK,#an .anIns div{break-inside:avoid}
    #an table.anT th{position:static}.hd{padding:18px 18px 10px;border-bottom:2px solid #a8791f;margin-bottom:14px}.hd h1{margin:0;font-size:20px}.hd p{margin:4px 0 0;font-size:12px;color:#6b6255}
    .noprint{padding:10px 18px}@media print{.noprint{display:none}@page{size:A4 landscape;margin:10mm}}</style></head>
    <body><div class="noprint"><button onclick="window.print()">Print / Save as PDF</button></div><div id="an"><div class="hd"><h1>EDEN — Analytics · ${anEsc_(tab)}</h1><p>${anEsc_(anFiltersText_())}</p><p>Made ${new Date().toLocaleString('en-GB')}</p></div><div class="daBody">${body.innerHTML}</div></div></body></html>`;
  const w=window.open('','_blank');if(!w){alert('Allow pop-ups for this site to make the PDF.');return;}
  w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();w.print();}catch(e){}},500);

/* Excel: every table on the open tab. */
function anExcel_(){
  if(typeof edenXlsxDownload_!=='function'){alert('Excel export is not available.');return;}
  const el=document.getElementById('an');if(!el)return;
  const cards=[...el.querySelectorAll('.daBody .anC')].filter(c=>c.querySelector('table.anT'));
  if(!cards.length){alert('No tables on this tab to export.');return;}
  const clean=t=>t.textContent.replace(/[▾▴▸]/g,'').replace(/\s+/g,' ').trim();
  const out=[];let headers=null;
  cards.forEach((c,i)=>{const t=c.querySelector('table.anT'),h=[...t.querySelectorAll('thead th')].map(clean);
    const title=clean(c.querySelector('h3').childNodes[0]||c.querySelector('h3'));
    const rows=[...t.querySelectorAll('tbody tr:not(.anSub), tfoot tr')].map(tr=>[...tr.children].map(clean));
    if(i===0){headers=h;out.push(...rows);}else{out.push([''],[title],h,...rows);}
  });
  const tab=(AN_TABS_.find(t=>t[0]===AN_.tab)||[])[1]||'';
  const per=anTxt_(anPerLabel_());
  edenXlsxDownload_(`EDEN_Analytics_${tab.replace(/[^\w]+/g,'_')}_${AN_.cur}`,{title:`EDEN — ${tab} · ${per} · ${AN_.cur}`,sheetName:'Analytics',
    kpis:[['Period',per],['Currency',AN_.cur],['Filters',anActive_().map(([k,l])=>l+': '+AN_.f[k].join(', ')).join(' | ')||'None'],['Table',clean(cards[0].querySelector('h3').childNodes[0]||cards[0].querySelector('h3'))]],
    headers,rows:out});
}
/* Weekly Telegram report (admins): on/off + send now. */
function anWeekly_(){
  google.script.run.withSuccessHandler(info=>{
    const on=!!(info&&info.on);
    const a=prompt(`Weekly analytics report on Telegram — every Sunday morning.\nNow: ${on?'ON':'OFF'}\n\nType:\n  send  → send this week’s report now\n  on    → turn it on\n  off   → turn it off`,'send');
    const v=String(a||'').trim().toLowerCase();if(!v)return;
    if(v==='send')google.script.run.withSuccessHandler(r=>alert(r&&r.ok?'Sent to Telegram ✓':'Not sent — check the Telegram settings.')).withFailureHandler(e=>alert(e.message||e)).sendWeeklyAnalyticsNow(AUTH_TOKEN);
    else if(v==='on'||v==='off')google.script.run.withSuccessHandler(r=>alert('Weekly report is now '+(r&&r.on?'ON':'OFF'))).withFailureHandler(e=>alert(e.message||e)).setWeeklyAnalytics(AUTH_TOKEN,v==='on');
  }).withFailureHandler(e=>alert(e.message||e)).getWeeklyAnalyticsInfo(AUTH_TOKEN);
}
/* Sidebar button (moved into the Analytics group by NavGroups). */
function anMount_(){
  const menu=document.querySelector('#transactionsModule .moduleMenu');if(!menu)return;
  let b=document.querySelector('.nav [data-an]');
  if(!b){b=document.createElement('button');b.type='button';b.dataset.an='1';b.textContent='Analytics';b.addEventListener('click',anOpen_);menu.appendChild(b);}
  const d=anCan_()?'':'none';if(b.style.display!==d)b.style.display=d;
}
(function initEdenAnalytics_(){
  const hook=()=>{if(typeof render==='function'&&!render.__an){const o=render;render=function(){const r=o.apply(this,arguments);try{anMount_();}catch(e){}return r;};render.__an=true;}anMount_();};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(hook,0));else setTimeout(hook,0);
})();
