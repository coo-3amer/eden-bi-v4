<style id="eden-login-sky">
/* =====================================================================
   EDEN BI — Login sky that follows the time in Cairo.
   Day: the photo brightens, a blue sky and a slow glowing sun.
   Dusk / dawn: golden light. Night: the moon over the mall + stars.
   Changes on its own while the page is open (checked every minute).
   ===================================================================== */
#loginScreen.lxLogin .lxSky{position:absolute;top:0;bottom:0;left:0;right:24%;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 66%,transparent 100%);mask-image:linear-gradient(90deg,#000 66%,transparent 100%)}
#loginScreen.lxLogin .lxSky>*{position:absolute;transition:opacity 2.4s ease,transform 2.4s ease,filter 2.4s ease}
#loginScreen.lxLogin .lxBg{transition:filter 2.4s ease}

/* sky colour wash (top part of the photo) */
.lxSky .skyWash{inset:0;opacity:0;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.6) 36%,transparent 48%);mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.6) 36%,transparent 48%)}
.lxSky .dayWash{background:linear-gradient(180deg,#3f8fdc 0%,#78b6ee 40%,#bfe0fa 100%)}
.lxSky .duskWash{background:linear-gradient(180deg,#3b3a78 0%,#c4607a 45%,#f2a65a 100%)}
.lxSky .lightWash{inset:0;opacity:0;background:radial-gradient(ellipse at 58% 10%,rgba(255,240,190,.6),transparent 50%);mix-blend-mode:screen}
/* daylight: lifts the dark night shadows to a soft daytime ambient */
.lxSky .ambient{inset:0;opacity:0;background:linear-gradient(180deg,rgba(150,185,225,.0) 0%,rgba(175,200,228,.42) 35%,rgba(205,200,185,.38) 100%);mix-blend-mode:screen}

/* sun */
.lxSky .sun{width:110px;height:110px;left:calc(58% - 55px);top:7%;opacity:0;transform:translateY(60px) scale(.8);border-radius:50%;
  background:radial-gradient(circle,#fffbe6 0%,#fff0a8 38%,#ffd75e 62%,rgba(255,200,60,0) 72%);
  box-shadow:0 0 60px 30px rgba(255,214,90,.45),0 0 160px 80px rgba(255,214,90,.22)}
.lxSky .sun::before{content:"";position:absolute;inset:-70px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,130,.28) 0 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,transparent 34%,#000 40%,transparent 72%);mask-image:radial-gradient(circle,transparent 34%,#000 40%,transparent 72%);
  animation:skySpin 60s linear infinite}

/* moon */
.lxSky .moon{width:84px;height:84px;left:calc(58% - 42px);top:8%;opacity:0;transform:translateY(40px);border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fffdf5 0%,#f1ecdc 45%,#d9d2bd 78%,#c9c1aa 100%);
  box-shadow:0 0 40px 12px rgba(220,226,255,.28),0 0 120px 50px rgba(160,180,255,.16),inset -10px -8px 18px rgba(120,110,90,.25)}
.lxSky .moon i{position:absolute;border-radius:50%;background:rgba(150,140,115,.28);box-shadow:inset 2px 2px 3px rgba(90,80,60,.25)}
.lxSky .moon i:nth-child(1){width:16px;height:16px;left:22px;top:44px}
.lxSky .moon i:nth-child(2){width:10px;height:10px;left:50px;top:24px}
.lxSky .moon i:nth-child(3){width:7px;height:7px;left:30px;top:20px}
.lxSky .moon i:nth-child(4){width:12px;height:12px;left:52px;top:52px}
.lxSky .moonHalo{width:300px;height:300px;left:calc(58% - 150px);top:calc(8% - 108px);opacity:0;border-radius:50%;
  background:radial-gradient(circle,rgba(200,210,255,.18),transparent 65%);animation:skyBreath 7s ease-in-out infinite}

/* stars */
.lxSky .stars{inset:0 0 55% 0;opacity:0}
.lxSky .stars b{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);animation:skyTwinkle var(--d,3s) ease-in-out var(--w,0s) infinite}
.lxSky .shoot{top:12%;left:20%;width:120px;height:2px;opacity:0;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);transform:rotate(18deg)}
#loginScreen[data-sky="night"] .lxSky .shoot{animation:skyShoot 11s ease-in 3s infinite}

/* states */
#loginScreen[data-sky="day"] .lxBg{filter:brightness(1.45) contrast(.9) saturate(.85)}
#loginScreen[data-sky="day"] .lxSky .ambient{opacity:.72}
#loginScreen[data-sky="day"] .lxSky .dayWash{opacity:.97}
#loginScreen[data-sky="day"] .lxSky .lightWash{opacity:.7}
#loginScreen[data-sky="day"] .lxSky .sun{opacity:1;transform:none}
#loginScreen[data-sky="day"] .lxShade{background:linear-gradient(0deg,rgba(6,8,14,.55) 0%,rgba(6,8,14,.12) 34%,transparent 55%),linear-gradient(100deg,rgba(6,10,20,.55) 0%,rgba(6,10,20,.15) 32%,transparent 46%)!important}
#loginScreen[data-sky="day"]{background:linear-gradient(180deg,#3f8fdc 0%,#7fb7e8 38%,#5f7f9f 70%,#2b3a4d 100%)!important}

#loginScreen[data-sky="dusk"] .lxBg{filter:brightness(1.18) saturate(1.1) sepia(.18)}
#loginScreen[data-sky="dusk"]{background:linear-gradient(180deg,#3b3a78 0%,#9a5576 40%,#3a2a3a 75%,#141018 100%)!important}
#loginScreen[data-sky="dusk"] .lxSky .duskWash{opacity:.78}
#loginScreen[data-sky="dusk"] .lxSky .sun{opacity:.95;transform:translateY(70px) scale(.92);filter:hue-rotate(-18deg) saturate(1.3)}
#loginScreen[data-sky="dusk"] .lxSky .stars{opacity:.35}

#loginScreen[data-sky="night"] .lxSky .moon,#loginScreen[data-sky="night"] .lxSky .moonHalo{opacity:1;transform:none}
#loginScreen[data-sky="night"] .lxSky .stars{opacity:1}

@keyframes skySpin{to{transform:rotate(360deg)}}
@keyframes skyBreath{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes skyTwinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes skyShoot{0%,88%{opacity:0;transform:translate(0,0) rotate(18deg)}90%{opacity:1}100%{opacity:0;transform:translate(260px,85px) rotate(18deg)}}
@media(max-width:900px){
  #loginScreen.lxLogin .lxSky{right:0;-webkit-mask-image:none;mask-image:none}
  .lxSky .sun,.lxSky .moon{left:calc(70% - 42px);top:5%}
  .lxSky .moonHalo{left:calc(70% - 150px)}
}
@media(prefers-reduced-motion:reduce){.lxSky *{animation:none!important}}
</style>
<script>
(function initEdenLoginSky_(){
  const screen=document.getElementById('loginScreen');
  const bg=screen&&screen.querySelector('.lxBg');
  if(!screen||!bg||screen.querySelector('.lxSky'))return;
  const sky=document.createElement('div');sky.className='lxSky';sky.setAttribute('aria-hidden','true');
  let stars='';
  for(let i=0;i<46;i++){
    const x=(Math.random()*100).toFixed(1),y=(Math.random()*100).toFixed(1),s=(Math.random()<.18?3:2);
    stars+=`<b style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;--d:${(2+Math.random()*3).toFixed(1)}s;--w:${(Math.random()*3).toFixed(1)}s"></b>`;
  }
  sky.innerHTML=`<div class="skyWash dayWash"></div><div class="skyWash duskWash"></div><div class="ambient"></div><div class="lightWash"></div>
    <div class="stars">${stars}</div><div class="shoot"></div>
    <div class="moonHalo"></div><div class="moon"><i></i><i></i><i></i><i></i></div><div class="sun"></div>`;
  bg.insertAdjacentElement('afterend',sky);

  // Cairo time decides the sky (?sky=day|dusk|night forces one, for checking).
  const cairoHour=()=>{
    try{
      const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
      const h=Number(p.find(x=>x.type==='hour').value)%24,m=Number(p.find(x=>x.type==='minute').value);
      return h+m/60;
    }catch(e){const d=new Date();return d.getHours()+d.getMinutes()/60;}
  };
  const pick=()=>{
    const forced=(location.search.match(/[?&]sky=(day|dusk|night)/)||[])[1];
    if(forced)return forced;
    const h=cairoHour();
    if(h>=6.5&&h<17)return 'day';
    if((h>=5.5&&h<6.5)||(h>=17&&h<18.25))return 'dusk';
    return 'night';
  };
  const apply=()=>{const s=pick();if(screen.dataset.sky!==s)screen.dataset.sky=s;};
  // after first paint, so the sun / moon rise in
  setTimeout(apply,350);
  setInterval(apply,60000);
})();
</script>
