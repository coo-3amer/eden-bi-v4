#loginScreen.lxLogin .lxShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,5,.12) 0%,rgba(10,8,5,.32) 42%,rgba(10,8,5,.84) 66%,rgba(10,8,5,.94) 100%),linear-gradient(0deg,rgba(10,8,5,.55) 0%,transparent 38%)}
#loginScreen.lxLogin .lxLogo{position:absolute;left:clamp(24px,4vw,64px);top:clamp(24px,5vh,48px);height:40px;width:auto;filter:drop-shadow(0 2px 12px rgba(0,0,0,.4))}
#loginScreen.lxLogin .lxCap{position:absolute;left:clamp(24px,4vw,64px);bottom:clamp(32px,7vh,64px);max-width:600px;animation:lxUp .9s .15s ease both}
#loginScreen.lxLogin .lxKicker{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#e2c27a}
#loginScreen.lxLogin .lxCap h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(46px,5.4vw,78px);line-height:1;margin:14px 0 16px;color:#fbf6ea;text-shadow:0 2px 30px rgba(0,0,0,.5)}
#loginScreen.lxLogin .lxCap p{font-size:15px;line-height:1.6;color:rgba(245,239,227,.8);margin:0}
#loginScreen.lxLogin .lxCard{position:absolute;right:clamp(24px,5vw,80px);top:50%;transform:translateY(-50%);width:min(430px,calc(100vw - 48px));padding:44px 40px 34px;border-radius:24px;background:rgba(22,18,12,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(226,194,122,.26);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:lxCard .8s ease both}
#loginScreen.lxLogin .lxTop{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.2em;color:#e2c27a}
#loginScreen.lxLogin .lxTop time{color:rgba(245,239,227,.45);letter-spacing:.12em}
#loginScreen.lxLogin .lxCard h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:46px;line-height:1.05;margin:16px 0 8px;color:#fbf6ea}
#loginScreen.lxLogin .lxCard>p{font-size:14px;color:rgba(245,239,227,.62);margin:0 0 30px}
#loginScreen.lxLogin .lxField{display:block;margin-bottom:18px}
#loginScreen.lxLogin .lxField>span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.18em;color:rgba(245,239,227,.58);margin-bottom:8px}
#loginScreen.lxLogin .lxInput{position:relative}
#loginScreen.lxLogin .lxInput .loginInput{width:100%;height:52px;margin:0!important;padding:0 48px 0 18px!important;border-radius:12px!important;background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.13)!important;color:#f5efe3!important;font:500 15px 'Inter',sans-serif!important;outline:none;box-shadow:none;transition:border-color .2s,background .2s,box-shadow .2s}
#loginScreen.lxLogin .lxInput .loginInput::placeholder{color:rgba(245,239,227,.36)}
#loginScreen.lxLogin .lxInput .loginInput:focus{border-color:rgba(226,194,122,.7)!important;background:rgba(226,194,122,.06)!important;box-shadow:0 0 0 4px rgba(226,194,122,.12)!important}
#loginScreen.lxLogin .lxInput button{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:rgba(245,239,227,.5);cursor:pointer;display:grid;place-items:center}
#loginScreen.lxLogin .lxInput button:hover{color:#e2c27a;background:rgba(255,255,255,.06)}
#loginScreen.lxLogin .lxInput button svg{width:18px;height:18px}
#loginScreen.lxLogin .loginBtn{width:100%;height:54px;margin:10px 0 0;padding:0 22px;border:0;border-radius:12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#c9a14f,#e8cd85)!important;color:#1a140a!important;font:700 12px 'Inter',sans-serif;letter-spacing:.18em;cursor:pointer;box-shadow:0 12px 30px rgba(201,161,79,.35);transition:transform .15s,box-shadow .2s,filter .2s}
#loginScreen.lxLogin .loginBtn:hover{filter:brightness(1.05);box-shadow:0 16px 36px rgba(201,161,79,.45)}
#loginScreen.lxLogin .loginBtn:active{transform:translateY(1px)}
#loginScreen.lxLogin .loginBtn:disabled{opacity:.7;cursor:wait}
#loginScreen.lxLogin .loginBtn b{font-size:17px;transition:transform .2s}
#loginScreen.lxLogin .loginBtn:hover b{transform:translateX(4px)}
#loginScreen.lxLogin .loginError{min-height:18px;margin:12px 0 0!important;color:#f0a3a3!important;font-size:12px;font-weight:600!important}
#loginScreen.lxLogin .hiddenLoginReaction{min-height:0;font-size:11px;color:rgba(245,239,227,.45)}
#loginScreen.lxLogin .lxFoot{display:flex;justify-content:space-between;margin-top:14px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(245,239,227,.5)}
#loginScreen.lxLogin .lxFoot i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6fd08c;margin-right:8px;box-shadow:0 0 0 3px rgba(111,208,140,.18)}
#loginScreen.lxLogin.loginWrong .lxCard{animation:lxShake .4s ease}
#loginScreen.lxLogin.loginWrong .loginInput{border-color:rgba(240,163,163,.55)!important}
#loginScreen.lxLogin.loginSuccess .lxCard{border-color:rgba(111,208,140,.45)}
@keyframes lxZoom{from{transform:scale(1.06)}to{transform:scale(1)}}
@keyframes lxUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes lxCard{from{opacity:0;transform:translateY(calc(-50% + 18px))}to{opacity:1;transform:translateY(-50%)}}
@keyframes lxShake{0%,100%{transform:translateY(-50%)}25%{transform:translate(-8px,-50%)}50%{transform:translate(7px,-50%)}75%{transform:translate(-4px,-50%)}}
@media(max-width:900px){
 #loginScreen.lxLogin .lxShade{background:linear-gradient(180deg,rgba(10,8,5,.25) 0%,rgba(10,8,5,.75) 45%,rgba(10,8,5,.94) 100%)}
 #loginScreen.lxLogin .lxCap{display:none}
 #loginScreen.lxLogin .lxCard{left:50%;right:auto;top:auto;bottom:24px;transform:translateX(-50%);padding:32px 24px 26px;animation:none}
 #loginScreen.lxLogin.loginWrong .lxCard{animation:none}
 #loginScreen.lxLogin .lxCard h2{font-size:38px}
}
@media(prefers-reduced-motion:reduce){#loginScreen.lxLogin *{animation:none!important}}
