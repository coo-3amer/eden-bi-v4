# Pushes the Apps Script code and updates the live web app (same /exec URL)
# on every push to `redesign` that touches the server files.
# One-time setup: add the repository secret CLASPRC_JSON = the full content of
# C:\Users\<you>\.clasprc.json (created by `npx clasp login`).
name: Deploy Apps Script

on:
  push:
    branches: [redesign]
    paths:
      - '**.js'
      - '**.html'
      - 'appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '!web/**'
      - '!tools/build_web.py'
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Add the CLASPRC_JSON secret (content of .clasprc.json) in GitHub → Settings → Secrets → Actions"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Push code (clasp)
        run: |
          set +e
          out=$(npx --yes @google/clasp@3 push --force 2>&1); code=$?
          echo "$out" | tail -40
          if [ $code -ne 0 ]; then
            msg=$(echo "$out" | tr '\n' ' ' | tail -c 900)
            echo "::error title=clasp push failed::$msg"
            exit $code
          fi
      - name: New version + update the live deployment
        env:
          CLASPRC_PATH: /home/runner/.clasprc.json
        run: |
          set +e
          out=$(node tools/deploy_appsscript.js 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then echo "::error title=Deploy failed::$(echo "$out" | tr '\n' ' ' | tail -c 900)"; exit $code; fi
