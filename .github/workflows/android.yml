# Builds the EDEN BI Android app (APK) and publishes it on the
# "android-app" release:  https://github.com/<repo>/releases/latest
# One-time setup: repository secret ANDROID_KEYSTORE_PASSWORD
# (a long password you choose). The first run creates the signing key with
# it and keeps it in android/eden-release.p12 (protected by that password),
# plus web/.well-known/assetlinks.json so the app opens without a URL bar.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [redesign]
    paths:
      - 'android/build_twa.js'
      - '.github/workflows/android.yml'
      - 'web/manifest.webmanifest'
      - 'web/icon-512.png'

permissions:
  contents: write
  actions: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Signing key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            # Test build only: a throw-away key, nothing is saved or published.
            echo "::warning title=Test build::No ANDROID_KEYSTORE_PASSWORD secret yet — building with a temporary key; nothing is published."
            echo "TEST_BUILD=1" >> "$GITHUB_ENV"; echo "KS_PASS=temporary-test-key" >> "$GITHUB_ENV"
            KS_PASS=temporary-test-key; rm -f android/eden-release.p12
          fi
          if [ ! -f android/eden-release.p12 ]; then
            keytool -genkeypair -storetype PKCS12 -keystore android/eden-release.p12 -alias eden -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=EDEN Development, O=EDEN Development, C=EG"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi
          FP=$(keytool -list -v -keystore android/eden-release.p12 -alias eden -storepass "$KS_PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          if [ -z "$FP" ]; then echo "::error title=Signing key::Could not read the key — is ANDROID_KEYSTORE_PASSWORD the same password as the first build?"; exit 1; fi
          mkdir -p web/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.edenalkhalij.dashboard","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" > web/.well-known/assetlinks.json
          echo "Key fingerprint: $FP"

      - name: Save key + asset links in the repo
        if: env.TEST_BUILD != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/eden-release.p12 web/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Android signing key / asset links"
            git push origin HEAD:redesign
            gh workflow run pages.yml --ref redesign   # republish the site with assetlinks.json
          fi

      - name: Generate Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm i --no-save --no-audit --no-fund @bubblewrap/core@1 >/dev/null
          set +e
          out=$(node android/build_twa.js twa 2>&1); code=$?
          echo "$out" | tail -60
          if [ $code -ne 0 ]; then echo "::error title=Generate project failed::$(echo "$out" | tr '\n' ' ' | tail -c 900)"; exit $code; fi

      - name: Build + sign APK
        run: |
          [ -z "$KS_PASS" ] && KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; export KS_PASS
          set +e
          cd twa
          chmod +x gradlew
          out=$(./gradlew --no-daemon assembleRelease 2>&1); code=$?
          echo "$out" | tail -80
          if [ $code -ne 0 ]; then echo "::error title=Gradle failed::$(echo "$out" | grep -iE 'error|failed|what went wrong' | head -15 | tr '\n' ' ' | tail -c 900)"; exit $code; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks ../android/eden-release.p12 --ks-key-alias eden --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../EDEN-BI.apk aligned.apk
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=Signing failed::apksigner exit $code"; exit $code; fi
          "$BT/apksigner" verify ../EDEN-BI.apk && ls -la ../EDEN-BI.apk

      - name: Keep the test APK (test builds)
        if: env.TEST_BUILD == '1'
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-BI-test-apk
          path: EDEN-BI.apk
          retention-days: 3

      - name: Publish on the "android-app" release
        if: env.TEST_BUILD != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-app >/dev/null 2>&1 || gh release create android-app --title "EDEN BI — Android app" --notes "Download EDEN-BI.apk on the phone and open it to install."
          gh release upload android-app EDEN-BI.apk --clobber
          echo "::notice title=APK ready::https://github.com/${GITHUB_REPOSITORY}/releases/download/android-app/EDEN-BI.apk (build ${{ github.run_number }})"
