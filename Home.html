<style id="eden-home">
/* ===== Executive home ===== */
html[data-theme] #appRoot .dsHome{display:flex;flex-direction:column;gap:18px;margin:0 0 22px}
html[data-theme] #appRoot .dsWelcome h2{margin:0;font-family:var(--ds-font)!important;font-size:26px;font-weight:500;color:var(--ds-heading);letter-spacing:-.01em}
html[data-theme] #appRoot .dsWelcome h2 b{font-weight:700}
html[data-theme] #appRoot .dsWelcome p{margin:4px 0 0;color:var(--ds-muted);font-size:14px}

html[data-theme] #appRoot .dsBand{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,24vw,440px);gap:16px}
html[data-theme] #appRoot .dsKpiRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
html[data-theme] #appRoot .dsKpi{position:relative;display:flex;gap:12px;padding:16px 14px 14px;border-radius:16px;background:var(--ds-surface);border:1px solid var(--ds-line);box-shadow:var(--ds-shadow);overflow:hidden;min-height:150px}
html[data-theme] #appRoot .dsKpiIco{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--tone);border:1.5px solid var(--tone);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tone) 22%,transparent),transparent 70%);box-shadow:0 0 22px color-mix(in srgb,var(--tone) 30%,transparent)}
html[data-theme] #appRoot .dsKpiIco .dsIco{width:21px;height:21px;flex-basis:21px}
html[data-theme] #appRoot .dsKpi.tone-blue{--tone:#3f8cff}
html[data-theme] #appRoot .dsKpi.tone-gold{--tone:#d6a64f}
html[data-theme] #appRoot .dsKpi.tone-teal{--tone:#2fbfae}
html[data-theme] #appRoot .dsKpi.tone-violet{--tone:#9a6bff}
html[data-theme] #appRoot .dsKpiBody{display:flex;flex-direction:column;min-width:0}
html[data-theme] #appRoot .dsKpiLabel{font-size:13px;font-weight:600;color:var(--ds-text)}
html[data-theme] #appRoot .dsKpiValue{font-size:clamp(20px,1.7vw,30px);font-weight:700;color:var(--ds-heading);letter-spacing:-.02em;line-height:1.15;margin-top:6px;white-space:nowrap}
html[data-theme] #appRoot .dsKpiSub{font-size:11px;color:var(--ds-muted);min-height:14px}

<script>
/* =====================================================================
   EDEN BI — Executive home (Overview page)
   Reads the already-filtered dashboard rows; no server calls, no changes
   to business logic. Re-renders after every render() of the dashboard.
   ===================================================================== */
let EDEN_HOME_RANK='sales';
let EDEN_HOME_REF_LABEL='vs last month';
const EDEN_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EDEN_PIPE_COLORS=['#3f8cff','#2fbfae','#d6a64f','#9a6bff','#5a6cff','#3fbf7f','#e0795b','#5fc2c8'];
const EDEN_AVATAR_COLORS=['#3f8cff','#2fbfae','#d6a64f','#9a6bff','#e0795b','#3fbf7f','#5a6cff','#c86fb3'];

function edenEsc_(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function edenNum_(n,d=0){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});}
function edenShort_(n){
  const a=Math.abs(Number(n)||0);
  if(a>=1e9)return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(a>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return edenNum_(n);
}
function edenIsUsd_(r){return String(r.currency||'').toUpperCase()==='USD';}
function edenCancelled_(v){
  if(typeof isCancelledStatus_==='function')return isCancelledStatus_(v);
  const s=String(v||'').trim().toLowerCase();return s==='cancel'||s==='cancelled'||s==='canceled';
}
function edenScopeRows_(){
  if(typeof statusScopeRows==='function')return statusScopeRows();
  return (filtered||[]).filter(r=>!edenCancelled_(r.status));
}
function edenYm_(r){return (Number(r.year)||0)*12+((Number(r.month)||1)-1);}

/* ---------- mount ---------- */
function edenHomeMount_(){
  const main=document.querySelector('#appRoot .main');
  const topbar=main&&main.querySelector('.topbar');
  if(!main||!topbar)return;
  if(!document.getElementById('dsHomeTop')){
    const t=document.getElementById('edenHomeTop');
    if(t)topbar.parentNode.insertBefore(t.content.cloneNode(true),topbar);
  }
  if(!document.getElementById('dsHomeBottom')){
    const t=document.getElementById('edenHomeBottom');
    const anchor=document.getElementById('dsStatusBar')||main.querySelector('section.filters');
    if(t&&anchor)anchor.insertAdjacentElement('afterend',t.content.cloneNode(true).firstElementChild);
  }
  if(!document.getElementById('dsFooter')){
    const t=document.getElementById('edenHomeFooter');
    if(t)main.appendChild(t.content.cloneNode(true));
  }
  if(!document.querySelector('#appRoot .dsSideArt')){
    const t=document.getElementById('edenSideArt');
    const card=document.querySelector('#appRoot .dsUserCard');
    if(t&&card)card.parentNode.insertBefore(t.content.cloneNode(true),card);
  }
  // The old hero/projects row is replaced by this home.
  document.getElementById('dsHero')?.remove();
  document.getElementById('dsProjects')?.remove();

  document.querySelector('#dsHomeBottom .dsTabs')?.addEventListener('click',e=>{
    const b=e.target.closest('button[data-rank]');if(!b)return;
    EDEN_HOME_RANK=b.dataset.rank;
    edenHomeRender_();
  });
  document.getElementById('dsPipeCols')?.addEventListener('click',e=>{
    const col=e.target.closest('.dsPipeCol');if(!col)return;
    const box=[...document.querySelectorAll('input[name="status"]')].find(x=>String(x.value)===col.dataset.status);
    if(!box)return;
    box.checked=!box.checked;
    if(typeof updateMultiLabels==='function')updateMultiLabels();
    if(typeof applyFilters==='function')applyFilters();
  });
  document.getElementById('dsProjList')?.addEventListener('click',e=>{
    const it=e.target.closest('.dsProjItem');if(!it)return;
    if(typeof selectProject==='function')selectProject(it.dataset.project);
    const nav=[...document.querySelectorAll('.moduleMenu button')].find(b=>String(b.getAttribute('onclick')||'').includes("'projects'"));
    document.querySelectorAll('.moduleMenu button').forEach(b=>b.classList.remove('active'));
    nav?.classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

/* ---------- pieces ---------- */
function edenKpiSet_(key,{value,sub,series}){
  const card=document.querySelector(`#dsHomeTop .dsKpi[data-kpi="${key}"]`);if(!card)return;
  card.querySelector('[data-f="value"]').textContent=value;
  card.querySelector('[data-f="sub"]').textContent=sub||'';
  const cur=series[series.length-1]||0,prev=series[series.length-2]||0;
  let delta;
  const ref=EDEN_HOME_REF_LABEL;
  if(!prev&&!cur)delta=`<b>—</b>${ref}`;
  else if(!prev)delta=`<b class="up">↑ New</b>${ref}`;
  else{const p=(cur-prev)/prev*100;delta=`<b class="${p>=0?'up':'down'}">${p>=0?'↑':'↓'} ${Math.abs(p).toFixed(0)}%</b>${ref}`;}
  card.querySelector('[data-f="delta"]').innerHTML=delta;
  const mx=Math.max(1,...series);
  card.querySelector('[data-f="bars"]').innerHTML=series.map(v=>`<i style="height:${Math.max(10,v/mx*100)}%"></i>`).join('');
}

function edenHomeKpis_(rows){
  // Compare the latest month that has data with the month before it.
  const now=new Date(),nowYm=now.getFullYear()*12+now.getMonth();
  const ym=(rawRows||[]).reduce((m,r)=>{const v=edenYm_(r);return r.year&&v<=nowYm&&v>m?v:m;},0)||nowYm;
  const months=[...Array(7)].map((_,i)=>ym-6+i);
  EDEN_HOME_REF_LABEL=`${EDEN_MONTHS[ym%12]} vs ${EDEN_MONTHS[(ym-1)%12]}`;
  const byMonth=fn=>months.map(m=>fn(rows.filter(r=>edenYm_(r)===m)));
  const egp=rs=>rs.filter(r=>!edenIsUsd_(r)).reduce((a,r)=>a+(Number(r.amount)||0),0);
  const usd=rs=>rs.filter(edenIsUsd_).reduce((a,r)=>a+(Number(r.amount)||0),0);
  const clients=rs=>new Set(rs.map(r=>r.clientKey||r.clientName).filter(Boolean)).size;
  const units=rs=>new Set(rs.map(r=>r.unitCode).filter(Boolean)).size;
  const usdTotal=usd(rows);
  edenKpiSet_('deals',{value:edenNum_(rows.length),sub:'Excluding cancelled',series:byMonth(rs=>rs.length)});
  edenKpiSet_('value',{value:edenShort_(egp(rows)),sub:'EGP'+(usdTotal?` · ${edenShort_(usdTotal)} USD`:''),series:byMonth(egp)});
  edenKpiSet_('clients',{value:edenNum_(clients(rows)),sub:'Distinct clients',series:byMonth(clients)});
  edenKpiSet_('units',{value:edenNum_(units(rows)),sub:'Distinct unit codes',series:byMonth(units)});
  const pv=document.getElementById('dsPerfValue');
  if(pv)pv.textContent=edenShort_(egp(rows))+' EGP';
}

function edenHomePipeline_(){
  const wrap=document.getElementById('dsPipeCols');if(!wrap)return;
  const base=(typeof STATUS_BASE_ROWS!=='undefined'&&STATUS_BASE_ROWS.length)?STATUS_BASE_ROWS:(filtered||[]);
  const counts={};
  base.forEach(r=>{const k=String(r.status||'').trim();if(k)counts[k]=(counts[k]||0)+1;});
  const selected=new Set((typeof getMulti==='function'?getMulti('status'):[]).map(String));
  const list=Object.entries(counts).sort((a,b)=>{
    const ca=edenCancelled_(a[0]),cb=edenCancelled_(b[0]);
    return ca!==cb?(ca?1:-1):b[1]-a[1];
  });
  const mx=Math.max(1,...list.map(x=>x[1]));
  document.getElementById('dsPipeTotal').textContent=edenNum_(list.reduce((a,x)=>a+(edenCancelled_(x[0])?0:x[1]),0));
  wrap.innerHTML=list.map(([k,v],i)=>{
    const c=edenCancelled_(k)?'#e05c5c':EDEN_PIPE_COLORS[i%EDEN_PIPE_COLORS.length];
    return `<button type="button" class="dsPipeCol${selected.has(k)?' on':''}" data-status="${edenEsc_(k)}" style="--c:${c}" title="Filter by ${edenEsc_(k)}">
      <span class="dsPipeTrack"><span class="dsPipeBar" style="height:${Math.max(4,v/mx*100)}%"></span></span>
      <b>${edenNum_(v)}</b><small>${edenEsc_(k)}</small></button>`;
  }).join('')||'<p style="color:var(--ds-muted)">No deals in the current filters.</p>';
}

function edenHomeNewClients_(rows){
  const wrap=document.getElementById('dsNewClientsCols');if(!wrap)return;
  const first=new Map();
  (rawRows||[]).forEach(r=>{
    const k=r.clientKey||r.clientName;if(!k||!r.year||!r.month||edenCancelled_(r.status))return;
    const m=edenYm_(r);if(!first.has(k)||m<first.get(k))first.set(k,m);
  });
  const years=(typeof getMulti==='function'?getMulti('year'):[]).map(Number).filter(Boolean);
  const now=new Date();
  const year=years.length===1?years[0]:now.getFullYear();
  const lastMonth=year===now.getFullYear()?now.getMonth():11;
  const counts=Array(lastMonth+1).fill(0);
  new Set(rows.map(r=>r.clientKey||r.clientName).filter(Boolean)).forEach(k=>{
    const m=first.get(k);if(m===undefined)return;
    const y=Math.floor(m/12),mo=m%12;
    if(y===year&&mo<=lastMonth)counts[mo]++;
  });
  document.getElementById('dsNewClientsYear').textContent=year===now.getFullYear()?`This year · ${year}`:String(year);
  const mx=Math.max(1,...counts);
  wrap.innerHTML=counts.map((v,i)=>`<div class="dsCol${i===lastMonth&&year===now.getFullYear()?' now':''}"><b>${v}</b><i style="height:${Math.max(4,v/mx*78)}%"></i><small>${EDEN_MONTHS[i]}</small></div>`).join('');
}

function edenThumbFor_(name){
  const n=String(name||'').toUpperCase();
  if(n.includes('WALK'))return EDEN_HOME_THUMBS['eden-walk'];
  if(n.includes('GLDANI')||n.includes('CCG')||n.includes('CITY'))return EDEN_HOME_THUMBS['city-center-gldani'];
  if(n.includes('KOBULETI'))return EDEN_HOME_THUMBS['kobuleti'];
  if(n.replace(/[\s-]/g,'').includes('EONE'))return EDEN_HOME_THUMBS['e-one'];
  return '';
}
function edenHomeProjects_(rows){
  const wrap=document.getElementById('dsProjList');if(!wrap)return;
  const g={};
  rows.forEach(r=>{
    const p=String(r.project||'').trim()||'Other';
    g[p]=g[p]||{deals:0,egp:0,usd:0};
    g[p].deals++;
    g[p][edenIsUsd_(r)?'usd':'egp']+=Number(r.amount)||0;
  });
  const total=rows.length||1;
  const list=Object.entries(g).sort((a,b)=>b[1].deals-a[1].deals).slice(0,6);
  const grads=[['#2fbfae','#5fd6c8'],['#9a6bff','#d6a64f'],['#3f8cff','#6fb0ff'],['#3f8cff','#6fb0ff'],['#3f8cff','#6fb0ff'],['#3f8cff','#6fb0ff']];
  wrap.innerHTML=list.map(([p,x],i)=>{
    const val=x.usd>x.egp?`${edenShort_(x.usd)} USD`:`${edenShort_(x.egp)} EGP`;
    const pct=x.deals/total*100;
    const th=edenThumbFor_(p);
    return `<button type="button" class="dsProjItem" data-project="${edenEsc_(p)}" title="Open ${edenEsc_(p)}">
      ${th?`<img class="dsProjThumb" src="${th}" alt="">`:'<span class="dsProjThumb"></span>'}
      <span class="dsProjMid"><b>${edenEsc_(p)}</b>
        <span class="dsProjTrack" style="--c1:${grads[i][0]};--c2:${grads[i][1]}"><i style="width:${pct}%"></i></span></span>
      <span class="dsProjRight"><b>${val}</b><span>${pct.toFixed(0)}% of deals</span></span></button>`;
  }).join('')||'<p style="color:var(--ds-muted)">No deals in the current filters.</p>';
}

function edenHomeRanking_(rows){
  const body=document.getElementById('dsRankBody');if(!body)return;
  document.querySelectorAll('#dsHomeBottom .dsTabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.rank===EDEN_HOME_RANK)));
  let key,head,src=rows,credit=r=>1;
  if(EDEN_HOME_RANK==='brokers'){key=r=>String(r.brokerageCompany||'').trim();head='Brokerage Company';}
  else if(EDEN_HOME_RANK==='branches'){key=r=>{const b=String(r.branch||'').trim();return typeof branchDisplayLabel_==='function'?branchDisplayLabel_(b):b;};head='Branch';}
  else{
    head='Sales Name';
    src=typeof salesCreditRows_==='function'?salesCreditRows_(rows):rows;
    key=r=>String(r.salesName||'').trim();
    credit=r=>Number(r.dealCredit??1);
  }
  document.getElementById('dsRankNameHead').textContent=head;
  const g={};
  src.forEach(r=>{
    const k=key(r);if(!k||k==='Not Assigned')return;
    g[k]=g[k]||{deals:0,egp:0};
    g[k].deals+=credit(r);
    if(!edenIsUsd_(r))g[k].egp+=Number(r.amount)||0;
  });
  const total=Object.values(g).reduce((a,x)=>a+x.deals,0)||1;
  const list=Object.entries(g).sort((a,b)=>b[1].deals-a[1].deals||b[1].egp-a[1].egp).slice(0,6);
  const initials=n=>(String(n).match(/[A-Za-z0-9\u0600-\u06FF]+/g)||['?']).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  body.innerHTML=list.map(([n,x],i)=>`<tr><td>${i+1}</td>
    <td><span class="dsRankName"><i style="--c:${EDEN_AVATAR_COLORS[i%EDEN_AVATAR_COLORS.length]}">${edenEsc_(initials(n))}</i><span>${edenEsc_(n)}</span></span></td>
    <td>${edenNum_(x.deals,1)}</td><td>${edenShort_(x.egp)}</td><td>${(x.deals/total*100).toFixed(0)}%</td></tr>`).join('')
    ||'<tr><td colspan="5" class="dsRankEmpty">No data in the current filters.</td></tr>';
}

function edenHomeClientType_(rows){
  const seen=new Map();
  rows.forEach(r=>{const k=r.clientKey||r.clientName;if(k&&!seen.has(k))seen.set(k,String(r.clientType||'').trim().toLowerCase());});
  let internal=0,overseas=0,other=0;
  seen.forEach(t=>{if(t==='internal')internal++;else if(t==='overseas')overseas++;else other++;});
  const total=seen.size,C=2*Math.PI*46;
  const a=total?internal/total:0,b=total?overseas/total:0;
  const A=document.getElementById('dsDonutA'),B=document.getElementById('dsDonutB');
  if(!A||!B)return;
  const gap=total&&a&&b?6:0;
  A.style.strokeDasharray=`${Math.max(0,a*C-gap)} ${C}`;
  B.style.strokeDasharray=`${Math.max(0,b*C-gap)} ${C}`;
  B.style.strokeDashoffset=`${-a*C}`;
  document.getElementById('dsDonutTotal').textContent=edenNum_(total);
  const pct=v=>total?Math.round(v/total*100):0;
  document.getElementById('dsDonutLegend').innerHTML=
    `<li><i style="--c:#3f8cff"></i><b>Internal</b><span>${edenNum_(internal)} (${pct(internal)}%)</span></li>`+
    `<li><i style="--c:#d6a64f"></i><b>Overseas</b><span>${edenNum_(overseas)} (${pct(overseas)}%)</span></li>`+
    (other?`<li><i style="--c:var(--ds-line-strong)"></i><b>Not set</b><span>${edenNum_(other)} (${pct(other)}%)</span></li>`:'');
}

/* ---------- render ---------- */
function edenHomeRender_(){
  const top=document.getElementById('dsHomeTop'),bottom=document.getElementById('dsHomeBottom');
  if(!top||!bottom)return;
  const show=(typeof currentView==='undefined'?'dashboard':currentView)==='dashboard';
  top.classList.toggle('hidden',!show);
  bottom.classList.toggle('hidden',!show);
  if(!show)return;
  const now=new Date();
  document.getElementById('dsHomeDay').textContent=now.toLocaleDateString('en-GB',{weekday:'long'});
  document.getElementById('dsHomeDate').textContent=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const box=document.getElementById('loggedUserBox');
  document.getElementById('dsHomeName').textContent=String(box?.textContent||'').split('•')[0].trim().split(/\s+/)[0]||'there';
  const rows=edenScopeRows_();
  try{edenHomeKpis_(rows);}catch(e){console.error('Home KPIs',e);}
  try{edenHomePipeline_();}catch(e){console.error('Home pipeline',e);}
  try{edenHomeNewClients_(rows);}catch(e){console.error('Home new clients',e);}
  try{edenHomeProjects_(rows);}catch(e){console.error('Home projects',e);}
  try{edenHomeRanking_(rows);}catch(e){console.error('Home ranking',e);}
  try{edenHomeClientType_(rows);}catch(e){console.error('Home client type',e);}
}

(function initEdenHome_(){
  edenHomeMount_();
  if(typeof render==='function'&&!render.__dsHome){
    const original=render;
    render=function(){const r=original.apply(this,arguments);try{edenHomeRender_();}catch(e){console.error(e);}return r;};
    render.__dsHome=true;
  }
  if(typeof setView==='function'&&!setView.__dsHomeView){
    const original=setView;
    setView=function(){const r=original.apply(this,arguments);try{edenHomeRender_();}catch(e){}return r;};
    setView.__dsHomeView=true;
  }
  const box=document.getElementById('loggedUserBox');
  if(box)new MutationObserver(()=>{try{edenHomeRender_();}catch(e){}}).observe(box,{childList:true,characterData:true,subtree:true});
  edenHomeRender_();
})();

</script>
