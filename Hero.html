<style id="eden-hero">
/* Hero band */
html[data-theme] #appRoot .dsHero{position:relative;overflow:hidden;border-radius:var(--ds-r-xl);margin:0 0 22px;min-height:250px;background:#14110c;color:#fff;box-shadow:var(--ds-shadow)}
html[data-theme] #appRoot .dsHeroBg{position:absolute;inset:0;background-size:cover;background-position:center 42%}
html[data-theme] #appRoot .dsHero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,11,7,.92) 0%,rgba(14,11,7,.72) 34%,rgba(14,11,7,.18) 68%,rgba(14,11,7,.30) 100%)}
html[data-theme] #appRoot .dsHeroInner{position:relative;z-index:1;padding:38px 40px;max-width:760px}
html[data-theme] #appRoot .dsHeroWelcome{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.88)}
html[data-theme] #appRoot .dsHeroWelcome span,html[data-theme] #appRoot .dsHeroWelcome i{color:#e4c27a;font-style:normal}
html[data-theme] #appRoot .dsHeroTitle{font-family:var(--ds-serif)!important;font-weight:600!important;font-size:clamp(32px,3.2vw,50px)!important;line-height:1.05!important;letter-spacing:.02em!important;color:#fff!important;margin:12px 0 8px!important}
html[data-theme] #appRoot .dsHeroSub{margin:0 0 22px;font-size:16px;color:rgba(255,255,255,.8)}
html[data-theme] #appRoot .dsHeroChips{display:flex;flex-wrap:wrap;gap:10px}
html[data-theme] #appRoot .dsChip{display:inline-flex;align-items:center;gap:9px;padding:10px 15px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
html[data-theme] #appRoot .dsChip .dsIco{width:16px;height:16px;flex-basis:16px;color:#e4c27a}

/* Projects row */
html[data-theme] #appRoot .dsProjects{margin:0 0 26px}
html[data-theme] #appRoot .dsProjectsTitle{display:flex;align-items:center;gap:10px;margin:0 0 14px!important;font-family:var(--ds-font)!important;font-size:17px!important;font-weight:700!important;color:var(--ds-heading)!important}
html[data-theme] #appRoot .dsProjectsTitle .dsIco{color:var(--ds-gold)}
