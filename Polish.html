<style id="eden-polish">
/* =====================================================================
   EDEN BI — visual polish (v6). Loaded after the design system.
   Richer gold, stronger contrast and status colours, steadier numbers,
   crisper charts, a skeleton while data loads, status dots, count-up.
   ===================================================================== */
html[data-theme="light"]{
  --ds-text:#221e19;
  --ds-heading:#120f0b;
  --ds-muted:#6b6255;
  --ds-subtle:#91877a;
  --ds-line:#e2d7c4;
  --ds-line-strong:#cdbfa6;
  --ds-gold:#a8791f;
  --ds-gold-strong:#835c12;
  --ds-gold-soft:rgba(176,124,30,.13);
  --ds-gold-line:rgba(168,121,31,.36);
  --ds-green:#178a4c;
  --ds-red:#d12f2f;
  --ds-blue:#2d62d0;
  --ds-violet:#6a45c9;
  --ds-green-soft:rgba(23,138,76,.12);
  --ds-red-soft:rgba(209,47,47,.10);
  --ds-blue-soft:rgba(45,98,208,.10);
  --ds-shadow:0 1px 2px rgba(60,44,18,.05),0 10px 28px -6px rgba(60,44,18,.10);
  --ds-shadow-lg:0 22px 56px -10px rgba(60,44,18,.20);
  --ds-grid:rgba(60,44,18,.06);
  --ds-chart-1:#c08a2e;--ds-chart-2:#5b6b85;--ds-chart-3:#2f9a63;--ds-chart-4:#3b6fd8;
  --ds-chart-5:#e0703f;--ds-chart-6:#8a5cd6;--ds-chart-7:#1f9f9a;--ds-chart-8:#e3b24f;
}
html[data-theme="dark"]{
  --ds-text:#efe9de;
  --ds-muted:#ab9f8e;
  --ds-gold:#e2b55c;
  --ds-gold-strong:#f2cb7e;
  --ds-gold-soft:rgba(226,181,92,.15);
  --ds-gold-line:rgba(226,181,92,.38);
  --ds-green:#4fd08c;
  --ds-red:#ff7676;
  --ds-blue:#7aa9ff;
  --ds-grid:rgba(255,255,255,.06);
  --ds-chart-1:#e2b55c;--ds-chart-2:#9aa8c2;--ds-chart-3:#55c98b;--ds-chart-4:#7aa9ff;
  --ds-chart-5:#ff9a6b;--ds-chart-6:#b494ff;--ds-chart-7:#4fd1c9;--ds-chart-8:#ffd27a;
}
html[data-theme="light"],html[data-theme="dark"]{
  --ds-gold-grad:linear-gradient(135deg,#dcae52 0%,#c08a2e 50%,#a2721d 100%);
}
/* crisper text and steady numbers */
html[data-theme] body{text-rendering:optimizeLegibility;-moz-osx-font-smoothing:grayscale}
html[data-theme] #appRoot :is(table td,table th,.value,.edenKpiCard,.dsTgNums,.dsCollKpi b,.icKpi b,.dsProjQuick strong,.dsStatusChip b,.dsTgBig strong){font-variant-numeric:tabular-nums}
html[data-theme] #appRoot #cards .edenKpiCard .value{letter-spacing:-.01em}
html[data-theme] #appRoot :is(.title,#pageTitle){letter-spacing:-.01em}
/* status dots on the status chips */
html[data-theme] #appRoot .chip[class*="status-"]{display:inline-flex;align-items:center;gap:6px}
html[data-theme] #appRoot .chip[class*="status-"]::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
html[data-theme] #appRoot .chip.status-Client,html[data-theme] #appRoot .chip.status-Company{background:var(--ds-green-soft);color:var(--ds-green)}
html[data-theme] #appRoot .chip.status-Part,html[data-theme] #appRoot .chip.status-Total{background:var(--ds-blue-soft);color:var(--ds-blue)}
html[data-theme] #appRoot .chip.status-Delivered{background:var(--ds-green-soft);color:var(--ds-green)}

/* skeleton while the data loads (replaces the "Loading…" text) */
html[data-theme] .loader.dsSkelOn{display:block!important;padding:0;font-size:0;color:transparent!important;background:var(--ds-bg)!important}
html[data-theme] .loader.dsSkelOn.hidden{display:none!important}
.dsSkel{position:absolute;inset:0;display:grid;grid-template-columns:260px 1fr;gap:24px;padding:22px;overflow:hidden}
.dsSkel .sb{border-radius:18px}
.dsSkel .mn{display:flex;flex-direction:column;gap:18px;min-width:0}
.dsSkel .row{display:grid;gap:14px}
.dsSkel .b{border-radius:16px;background:linear-gradient(100deg,var(--ds-surface-3) 20%,var(--ds-surface) 40%,var(--ds-surface-3) 60%) 0 0/200% 100%;animation:dsShimmer 1.4s ease-in-out infinite}
.dsSkel .msg{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font:600 13px var(--ds-font);color:var(--ds-muted);letter-spacing:.04em}
@keyframes dsShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media(max-width:900px){.dsSkel{grid-template-columns:1fr}.dsSkel .sb{display:none}}
@media(prefers-reduced-motion:reduce){.dsSkel .b{animation:none}}
</style>
<script>
/* Charts: draw at screen resolution (at least 2x) so lines and text are sharp. */
(function(){
  const set=()=>{if(window.Chart&&Chart.defaults){Chart.defaults.devicePixelRatio=Math.max(2,window.devicePixelRatio||1);return true;}return false;};
  if(!set())document.addEventListener('DOMContentLoaded',set);
})();
/* Skeleton loading screen inside the existing loader. */
(function(){
  const build=()=>{
    const l=document.getElementById('loader');if(!l||l.dataset.skel)return;
    l.dataset.skel='1';l.classList.add('dsSkelOn');
    const card='<div class="b" style="height:104px"></div>';
    l.innerHTML=`<div class="dsSkel" aria-label="Loading"><div class="b sb"></div><div class="mn">
      <div class="b" style="height:44px;max-width:520px"></div>
      <div class="b" style="height:190px"></div>
      <div class="row" style="grid-template-columns:repeat(5,minmax(0,1fr))">${card.repeat(5)}</div>
      <div class="row" style="grid-template-columns:2fr 1fr"><div class="b" style="height:300px"></div><div class="b" style="height:300px"></div></div>
    </div><div class="msg">Loading EDEN BI…</div></div>`;
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();
})();
/* Numbers count up to their value when a page opens or a figure changes. */
function edenCountUp_(el){
  const txt=el.textContent.trim();
  if(el.dataset.cu===txt)return;               // unchanged
  if(el.__cuLast&&txt===el.__cuLast)return;    // our own in-between frame
  const m=txt.match(/^([^\d\-]*)(-?[\d,]*\.?\d+)(.*)$/);
  el.dataset.cu=txt;
  if(!m||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const pre=m[1],num=m[2],suf=m[3],target=parseFloat(num.replace(/,/g,''));
  if(!isFinite(target)||Math.abs(target)<2)return;
  const dec=(num.split('.')[1]||'').length,comma=num.includes(',');
  const fmt=v=>{let s=v.toFixed(dec);if(comma){const [i,d]=s.split('.');s=Number(i).toLocaleString('en-US')+(d?'.'+d:'');}return pre+s+suf;};
  const t0=performance.now(),dur=700;
  cancelAnimationFrame(el.__cu);
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    if(k<1){el.__cuLast=fmt(target*e);el.textContent=el.__cuLast;el.__cu=requestAnimationFrame(step);}else{el.__cuLast='';el.textContent=txt;}};
  el.__cu=requestAnimationFrame(step);
}
(function(){
  const run=()=>{document.querySelectorAll('#appRoot #cards .edenKpiCard .value,#appRoot .dsTgBig strong,#appRoot .dsCollKpi > strong,#appRoot .dsCollKpi > b').forEach(el=>{if(el.offsetParent)edenCountUp_(el);});};
  const hook=()=>{if(typeof render==='function'&&!render.__cu){const o=render;render=function(){const r=o.apply(this,arguments);try{requestAnimationFrame(run);}catch(e){}return r;};render.__cu=true;}};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(hook,0));else setTimeout(hook,0);
})();
</script>
