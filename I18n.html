const I18N_PH_AR_={
'search client, unit or campaign...':'دوّر على عميل أو وحدة أو حملة...','search client / unit / campaign...':'دوّر على عميل / وحدة / حملة...','search company…':'دوّر على شركة…',

'select a unit first':'اختار الوحدة الأول','find unit…':'دوّر على وحدة…','search by unit code, floor, type or view':'دوّر بكود الوحدة أو الدور أو النوع'
};
const I18N_RULES_=[
  [/^(\d[\d,.]*)\s+deals?$/i,'$1 ديل'],[/^(\d[\d,.]*)\s+companies$/i,'$1 شركة'],[/^(\d[\d,.]*)\s+records?$/i,'$1 سجل'],
  [/^(\d[\d,.]*)\s+options?$/i,'$1 اختيار'],[/^(\d[\d,.]*)\s+projects?$/i,'$1 مشروع'],[/^(\d[\d,.]*)\s+rows?$/i,'$1 صف'],
  [/^(\d[\d,.]*)\s+days$/i,'$1 يوم'],[/^showing (\d[\d,.]*) rows from transactions$/i,'عرض $1 صف من المبيعات'],
  [/^step (\d) of (\d)$/i,'خطوة $1 من $2'],[/^view more \((\d+)\)$/i,'عرض المزيد ($1)']
];
const I18N_SKIP_='script,style,tbody,textarea,code,pre,.dsLogo,.lxCap,.welcomeStack,.noI18n,[data-noi18n],#mBar .mT small';
function i18nText_(t){
  const k=t.replace(/\s+/g,' ').trim();if(!k)return null;
  const v=I18N_AR_[k.toLowerCase()];if(v)return t.replace(t.trim(),v);
  for(const [re,rep] of I18N_RULES_)if(re.test(k))return t.replace(t.trim(),k.replace(re,rep));
  return null;
}
function i18nNode_(n){
  if(n.nodeType===3){
    const p=n.parentElement;if(!p||p.closest(I18N_SKIP_))return;
    if(n.__ar!==undefined&&n.nodeValue===n.__ar)return;
    const t=i18nText_(n.nodeValue||'');if(t!=null&&t!==n.nodeValue){n.__ar=t;n.nodeValue=t;}
    return;
  }
  if(n.nodeType!==1||n.closest&&n.closest(I18N_SKIP_))return;
  ['placeholder','title','aria-label'].forEach(a=>{
    const v=n.getAttribute&&n.getAttribute(a);if(!v||n.getAttribute('data-i18n-'+a)===v)return;
    const t=I18N_PH_AR_[v.trim().toLowerCase()]||I18N_AR_[v.trim().toLowerCase()];
    if(t){n.setAttribute(a,t);n.setAttribute('data-i18n-'+a,t);}
  });
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:x=>x.nodeType===1&&x.matches(I18N_SKIP_)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let x;while((x=w.nextNode()))if(x!==n)i18nNode_(x);
}
function edenSetLang_(l){try{localStorage.setItem(EDEN_LANG_KEY_,l);}catch(e){}location.reload();}
(function(){
  // Language button (desktop app bar + phone top bar).
  const mount=()=>{
    const label=EDEN_LANG_==='ar'?'EN':'ع',title=EDEN_LANG_==='ar'?'English':'عربي';
    const bar=document.querySelector('.dsAppBarRight');
    if(bar&&!bar.querySelector('.langBtn')){const b=document.createElement('button');b.type='button';b.className='langBtn noI18n';b.textContent=label;b.title=title;b.addEventListener('click',()=>edenSetLang_(EDEN_LANG_==='ar'?'en':'ar'));bar.insertBefore(b,bar.firstChild);}
    const mb=document.getElementById('mBar');
    if(mb&&!mb.querySelector('.langBtn')){const b=document.createElement('button');b.type='button';b.className='langBtn noI18n';b.textContent=label;b.title=title;b.addEventListener('click',()=>edenSetLang_(EDEN_LANG_==='ar'?'en':'ar'));mb.insertBefore(b,mb.lastElementChild);}
  };
  const start=()=>{
    mount();
    if(EDEN_LANG_!=='ar')return;
    if(!document.querySelector('link[data-cairo]')){const l=document.createElement('link');l.rel='stylesheet';l.dataset.cairo='1';l.href='https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap';document.head.appendChild(l);}
    i18nNode_(document.body);
    let queued=new Set(),pending=false;
    const flush=()=>{pending=false;const list=[...queued];queued.clear();list.forEach(n=>{if(n.isConnected)i18nNode_(n);});};
    new MutationObserver(ms=>{
      ms.forEach(m=>{
        if(m.type==='characterData')queued.add(m.target);
        else if(m.type==='attributes')queued.add(m.target);
        else m.addedNodes.forEach(n=>queued.add(n));
      });
      if(!pending&&queued.size){pending=true;requestAnimationFrame(flush);}
    }).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title']});
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
