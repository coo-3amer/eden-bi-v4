<script>
/* =====================================================================
   EDEN BI DESIGN SYSTEM — client helpers (v5)
   Theme switching (Light / Dark), app bar search, avatar, live time.
   Loaded after Scripts.html; does not change any data logic.
   ===================================================================== */
const EDEN_THEME_MODE_KEY='EDEN_BI_THEME_MODE';

function edenThemeMode_(){
  let m='light';
  try{m=localStorage.getItem(EDEN_THEME_MODE_KEY)||'light';}catch(e){}
  return m==='dark'?'dark':'light';
}

/* Replaces the legacy single-theme setAppTheme(). */
function setAppTheme(mode){
  const next=(mode==='dark'||mode==='light')?mode:edenThemeMode_();
  const changed=document.documentElement.getAttribute('data-theme')!==next;
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem(EDEN_THEME_MODE_KEY,next);}catch(e){}
  document.querySelectorAll('[data-ds-theme]').forEach(b=>
    b.setAttribute('aria-pressed',String(b.getAttribute('data-ds-theme')===next)));
  // Charts read their colours from CSS variables, so redraw them in the new theme.
  if(changed && typeof render==='function' && typeof rawRows!=='undefined' && rawRows.length){
    try{render();}catch(e){console.error('Theme re-render failed:',e);}
  }
}
function initAppTheme(){setAppTheme(edenThemeMode_());}

function edenInitials_(text){
  const name=String(text||'').split('•')[0].trim();
  const parts=name.split(/\s+/).filter(Boolean);
  if(!parts.length)return 'ED';
  return ((parts[0][0]||'')+(parts.length>1?parts[parts.length-1][0]:'')).toUpperCase();
}
function edenSyncAvatar_(){
  const box=document.getElementById('loggedUserBox');
  const av=document.getElementById('dsUserAvatar');
  if(box&&av)av.textContent=edenInitials_(box.textContent);
}
function edenUpdateLiveTime_(){
  const el=document.getElementById('dsLiveTime');
  if(el)el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function initEdenDesignSystem_(){
  setAppTheme(edenThemeMode_());

  document.querySelectorAll('[data-ds-theme]').forEach(b=>
    b.addEventListener('click',()=>setAppTheme(b.getAttribute('data-ds-theme'))));

  // App bar search mirrors the Transactions search box.
  const g=document.getElementById('dsGlobalSearch');
  const s=document.getElementById('search');
  if(g&&s){
    g.addEventListener('input',()=>{
      s.value=g.value;
      if(typeof applyFilters==='function')applyFilters();
    });
    s.addEventListener('input',()=>{if(g.value!==s.value)g.value=s.value;});
  }
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){
      e.preventDefault();
      g?.focus();g?.select();
    }
  });

  // Reload keeps the session (token lives in sessionStorage).
  document.getElementById('dsRefreshBtn')?.addEventListener('click',e=>{
    const btn=e.currentTarget;
    if(typeof reloadDashboardData_!=='function'||!EDEN_BOOT_COMPLETE){btn.classList.add('spinning');location.reload();return;}
    btn.classList.add('spinning');
    reloadDashboardData_();
    const stop=()=>{if(!document.body.classList.contains('dsDataUpdating')){btn.classList.remove('spinning');clearInterval(t);}};
    const t=setInterval(stop,300);
  });

  const box=document.getElementById('loggedUserBox');
  if(box)new MutationObserver(edenSyncAvatar_).observe(box,{childList:true,characterData:true,subtree:true});
  edenSyncAvatar_();
  edenUpdateLiveTime_();
  setInterval(edenUpdateLiveTime_,30000);
}
initEdenDesignSystem_();

/* ---------- Sales Status quick filter (multi-select chips) ----------
   Mirrors the existing Status filter checkboxes, so the dropdown, Reset and
   Clear all stay in sync. Counts respect every other active filter. */
const EDEN_STATUS_ORDER=['closed','reservation','renovation','client signed','part of dp'];
function edenStatusTone_(v){
  const s=String(v||'').trim().toLowerCase();
  if(s==='cancel'||s==='cancelled'||s==='canceled')return 'red';
  if(s.includes('closed')||s.includes('sold')||s.includes('signed'))return 'green';
  if(s.includes('reserv'))return 'gold';
  if(s.includes('renov')||s.includes('progress')||s.includes('dp'))return 'blue';
  return 'grey';
}
function edenStatusChipsMount_(){
  if(document.getElementById('dsStatusBar'))return;
  const filters=document.querySelector('#appRoot section.filters');
  if(!filters)return;
  const bar=document.createElement('section');
  bar.id='dsStatusBar';
  bar.className='dsStatusBar';
  bar.setAttribute('aria-label','Sales status');
  bar.innerHTML=`
    <div class="dsStatusHead">
      <span class="dsStatusTitle">Sales Status</span>
      <span class="dsStatusHint">Select one or more</span>
    </div>
    <div class="dsStatusChips" id="dsStatusChips" role="group"></div>`;
  filters.insertAdjacentElement('afterend',bar);
  bar.addEventListener('click',e=>{
    const chip=e.target.closest('.dsStatusChip');
    if(!chip)return;
    const value=chip.dataset.status;
    const boxes=[...document.querySelectorAll('input[name="status"]')];
    if(value==='__all__'){
      boxes.forEach(b=>b.checked=false);
    }else{
      const box=boxes.find(b=>String(b.value)===value);
      if(box)box.checked=!box.checked;
    }
    if(typeof updateMultiLabels==='function')updateMultiLabels();
    if(typeof applyFilters==='function')applyFilters();
  });
}
function edenStatusChipsRender_(){
  const bar=document.getElementById('dsStatusBar');
  const wrap=document.getElementById('dsStatusChips');
  if(!bar||!wrap)return;
  const filters=document.querySelector('#appRoot section.filters');
  const visible=!!filters&&!filters.classList.contains('hidden')&&getComputedStyle(filters).display!=='none';
  bar.classList.toggle('hidden',!visible);
  if(!visible)return;

  const boxes=[...document.querySelectorAll('input[name="status"]')];
  const base=(typeof STATUS_BASE_ROWS!=='undefined'&&STATUS_BASE_ROWS.length)?STATUS_BASE_ROWS:[];
  const counts={};
  base.forEach(r=>{const k=String(r.status||'');counts[k]=(counts[k]||0)+1;});
  const rank=v=>{
    const s=String(v).trim().toLowerCase();
    if(edenStatusTone_(v)==='red')return 999;
    const i=EDEN_STATUS_ORDER.indexOf(s);
    return i<0?100:i;
  };
  const values=boxes.map(b=>String(b.value)).filter(Boolean)
    .sort((a,b)=>rank(a)-rank(b)||(counts[b]||0)-(counts[a]||0)||a.localeCompare(b));
  const selected=new Set(boxes.filter(b=>b.checked).map(b=>String(b.value)));
  const activeCount=base.filter(r=>edenStatusTone_(r.status)!=='red').length;
  const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>Number(n||0).toLocaleString('en-US');

  wrap.innerHTML=
    `<button type="button" class="dsStatusChip all${selected.size?'':' on'}" data-status="__all__" aria-pressed="${!selected.size}" title="All statuses except Cancel (default)">
       <span>All active</span><b>${fmt(activeCount)}</b>
     </button>`+
    values.map(v=>{
      const on=selected.has(v);
      const label=boxes.find(b=>String(b.value)===v)?.dataset.label||v;
      return `<button type="button" class="dsStatusChip tone-${edenStatusTone_(v)}${on?' on':''}" data-status="${esc(v)}" aria-pressed="${on}">
        <i></i><span>${esc(label)}</span><b>${fmt(counts[v]||0)}</b>
      </button>`;
    }).join('');
}
(function initEdenStatusChips_(){
  edenStatusChipsMount_();
  if(typeof render==='function'&&!render.__dsStatus){
    const original=render;
    render=function(){const r=original.apply(this,arguments);try{edenStatusChipsRender_();}catch(e){console.error(e);}return r;};
    render.__dsStatus=true;
  }
  edenStatusChipsRender_();
})();

/* ---------- Project flip cards: back-face summary ----------
   Sales figures come from the rows in the current filters (Cancel excluded
   by default). Project size comes from the Inventory sheet, loaded once per
   project on first hover. */
const EDEN_INV_KEYS={'KOBULETI':'KOBULETI','GLDANI':'CITY_CENTER_GLDANI','EDEN WALK':'EDEN_WALK'};
const EDEN_INV_CACHE={};
function edenCompact_(n){
  const a=Math.abs(Number(n)||0);
  if(a>=1e9)return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(a>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return Number(n||0).toLocaleString('en-US');
}
function edenProjectRows_(card){
  const keys=String(card.dataset.projectMatch||'').split('|').map(k=>k.trim().toUpperCase()).filter(Boolean);
  const scope=(typeof statusScopeRows==='function')?statusScopeRows():(typeof filtered!=='undefined'?filtered:[]);
  return scope.filter(r=>{const p=String(r.project||'').toUpperCase();return keys.some(k=>p.includes(k));});
}
function edenInvKeyFor_(card){
  const name=String(card.dataset.projectName||'').toUpperCase();
  const hit=Object.keys(EDEN_INV_KEYS).find(k=>name.includes(k));
  return hit?EDEN_INV_KEYS[hit]:'';
}
function edenRenderSize_(card){
  const box=card.querySelector('[data-f="size"]');if(!box)return;
  const key=edenInvKeyFor_(card);
  const entry=key?EDEN_INV_CACHE[key]:null;
  if(!key){box.innerHTML='<span>Project size: inventory not linked yet</span>';return;}
  if(!entry||entry.state==='loading'){box.innerHTML='<span>Loading project size…</span>';return;}
  if(entry.state==='error'){box.innerHTML='<span>Project size unavailable right now</span>';return;}
  const s=entry.stats||{};
  const total=Number(s.totalUnits)||0;
  if(!total){box.innerHTML='<span>No units in the inventory sheet</span>';return;}
  const sold=Number(s.closed)||0,res=Number(s.reservation)||0,av=Number(s.available)||0;
  const other=Math.max(0,total-sold-res-av);
  const pct=v=>(v/total*100).toFixed(1);
  box.innerHTML=
    `<span>Project size: <b>${total.toLocaleString('en-US')} units</b> · ${Math.round(sold/total*100)}% sold</span>`+
    `<span class="dsSizeBar"><i style="width:${pct(sold)}%;background:var(--ds-green)"></i><i style="width:${pct(res)}%;background:var(--ds-gold)"></i><i style="width:${pct(av)}%;background:var(--ds-blue)"></i><i style="width:${pct(other)}%;background:var(--ds-line-strong)"></i></span>`+
    `<span class="dsSizeLegend"><span style="--c:var(--ds-green)">${sold} sold</span><span style="--c:var(--ds-gold)">${res} reserved</span><span style="--c:var(--ds-blue)">${av} available</span></span>`;
}
function edenLoadInventory_(card){
  const key=edenInvKeyFor_(card);
  if(!key||EDEN_INV_CACHE[key]||typeof google==='undefined'||!google.script||typeof AUTH_TOKEN==='undefined')return;
  EDEN_INV_CACHE[key]={state:'loading'};
  google.script.run
    .withSuccessHandler(data=>{
      EDEN_INV_CACHE[key]={state:'ok',stats:(data&&data.stats)||{}};
      document.querySelectorAll('#dsProjects .dsProjCard').forEach(c=>{if(edenInvKeyFor_(c)===key)edenRenderSize_(c);});
    })
    .withFailureHandler(()=>{
      EDEN_INV_CACHE[key]={state:'error'};
      document.querySelectorAll('#dsProjects .dsProjCard').forEach(c=>{if(edenInvKeyFor_(c)===key)edenRenderSize_(c);});
    })
    .getInventoryData(AUTH_TOKEN,key,false);
}
function edenFillProjectBack_(card){
  const rows=edenProjectRows_(card);
  const usd=String(card.dataset.currency||'').toUpperCase()==='USD';
  const cur=usd?'USD':'EGP';
  const inCur=rows.filter(r=>(String(r.currency||'').toUpperCase()==='USD')===usd);
  const value=inCur.reduce((a,r)=>a+(Number(r.amount)||0),0);
  const units=new Set(rows.map(r=>r.unitCode).filter(Boolean)).size;
  const area=rows.reduce((a,r)=>a+(Number(r.area)||0),0);
  const clients=new Set(rows.map(r=>r.clientKey||r.clientName).filter(Boolean)).size;
  const avg=inCur.length?value/inCur.length:0;
  const stat=(label,v)=>`<span><small>${label}</small><strong>${v}</strong></span>`;
  const box=card.querySelector('[data-f="stats"]');
  if(box)box.innerHTML=rows.length
    ? stat('Deals',rows.length.toLocaleString('en-US'))+
      stat('Sales '+cur,edenCompact_(value))+
      stat('Avg deal',edenCompact_(avg))+
      stat('Units sold',units.toLocaleString('en-US'))+
      stat('Area sold',edenCompact_(area)+' m²')+
      stat('Clients',clients.toLocaleString('en-US'))
    : '<span style="grid-column:1/-1;color:var(--ds-muted);font-size:12px">No deals in the current filters.</span>';
  edenRenderSize_(card);
  edenLoadInventory_(card);
}

/* ---------- Home hero (Overview page only) ---------- */
function edenMountHero_(){
  const tpl=document.getElementById('edenHeroTpl');
  const main=document.querySelector('#appRoot .main');
  const topbar=main&&main.querySelector('.topbar');
  if(!tpl||!main||!topbar||document.getElementById('dsHero'))return;
  topbar.parentNode.insertBefore(tpl.content.cloneNode(true),topbar);

  document.querySelectorAll('#dsProjects .dsProjCard').forEach(card=>{
    const fill=()=>{try{edenFillProjectBack_(card);}catch(e){console.error('Project card summary',e);}};
    card.addEventListener('mouseenter',fill);
    card.addEventListener('focus',fill);
    card.addEventListener('click',()=>{
      const keys=String(card.dataset.projectMatch||'').split('|').map(k=>k.trim().toUpperCase()).filter(Boolean);
      const options=[...document.querySelectorAll('input[name="project"]')].map(cb=>String(cb.value));
      const match=options.find(v=>keys.some(k=>v.toUpperCase().includes(k)));
      if(!match){alert('This project has no transactions in the loaded data yet.');return;}
      if(typeof selectProject==='function')selectProject(match);
      const navBtn=[...document.querySelectorAll('.moduleMenu button')]
        .find(b=>String(b.getAttribute('onclick')||'').includes("'projects'"));
      document.querySelectorAll('.moduleMenu button').forEach(b=>b.classList.remove('active'));
      navBtn?.classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}
function edenUpdateHero_(){
  const hero=document.getElementById('dsHero');
  if(!hero)return;
  const view=(typeof currentView!=='undefined')?currentView:'dashboard';
  const show=view==='dashboard';
  hero.classList.toggle('hidden',!show);
  document.getElementById('dsProjects')?.classList.toggle('hidden',!show);
  document.getElementById('appRoot')?.classList.toggle('dsHasHero',show);
  if(!show)return;
  const now=new Date();
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&el.textContent!==v)el.textContent=v;};
  set('dsHeroDate',now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
  set('dsHeroTime',now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));
  set('dsHeroBranch',document.getElementById('branchLabel')?.textContent?.trim()||'All Branches');
  const box=document.getElementById('loggedUserBox');
  const name=String(box?.textContent||'').split('•')[0].trim().split(/\s+/)[0]||'there';
  const welcome=document.querySelector('.dsHeroWelcome');
  const gp=typeof edenGreetingParts_==='function'?edenGreetingParts_():null;
  if(welcome){
    const key=gp?'g:'+gp.lead.join(' ')+'|'+gp.hi.join(' '):'d';
    if(welcome.dataset.dsGreet!==key){
      welcome.dataset.dsGreet=key;
      if(gp){
        welcome.textContent=(gp.lead.length?gp.lead.join(' ')+' ':'');
        const sp=document.createElement('span');sp.id='dsHeroName';sp.textContent=gp.hi.join(' ');
        welcome.appendChild(sp);welcome.insertAdjacentHTML('beforeend',' <i>✦</i>');
      }else{
        welcome.innerHTML='Welcome back, <span id="dsHeroName">there</span> <i>✦</i>';
      }
    }
  }
  if(!gp)set('dsHeroName',name);
}
(function initEdenHero_(){
  edenMountHero_();
  // Keep the hero in step with navigation without changing setView itself.
  if(typeof setView==='function'&&!setView.__dsHero){
    const original=setView;
    setView=function(){const r=original.apply(this,arguments);edenUpdateHero_();return r;};
    setView.__dsHero=true;
  }
  const box=document.getElementById('loggedUserBox');
  if(box)new MutationObserver(edenUpdateHero_).observe(box,{childList:true,characterData:true,subtree:true});
  const branch=document.getElementById('branchLabel');
  if(branch)new MutationObserver(edenUpdateHero_).observe(branch,{childList:true,characterData:true,subtree:true});
  edenUpdateHero_();
  setInterval(edenUpdateHero_,30000);
})();
</script>
