<style id="eden-global-search">
html[data-theme] #appRoot .dsAppBar{position:sticky}
#dsGsPanel{position:absolute;z-index:60;top:calc(100% - 6px);left:0;width:min(560px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;
  background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:14px;box-shadow:0 18px 42px rgba(0,0,0,.18);padding:6px;display:none}
#dsGsPanel.show{display:block}
#dsGsPanel .gsGroup{padding:8px 10px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ds-muted);display:flex;justify-content:space-between}
#dsGsPanel .gsItem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;cursor:pointer;border:0;background:none;text-align:left;color:var(--ds-text);font:inherit}
#dsGsPanel .gsItem:hover,#dsGsPanel .gsItem.on{background:var(--ds-gold-soft)}
#dsGsPanel .gsIco{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ds-surface-2);color:var(--ds-gold-strong);font-size:13px;font-weight:800}
#dsGsPanel .gsMain{flex:1;min-width:0}
#dsGsPanel .gsTitle{font-size:13px;font-weight:700;color:var(--ds-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dsGsPanel .gsSub{font-size:11.5px;color:var(--ds-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#dsGsPanel .gsTag{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ds-surface-2);color:var(--ds-muted)}
#dsGsPanel .gsTag.cancel{color:var(--ds-red)}
#dsGsPanel mark{background:none;color:var(--ds-gold-strong);font-weight:800}
#dsGsPanel .gsEmpty{padding:18px 12px;text-align:center;color:var(--ds-muted);font-size:13px}
#dsGsPanel .gsAll{margin-top:4px;border-top:1px solid var(--ds-line);border-radius:0 0 10px 10px;justify-content:center;font-size:12px;font-weight:700;color:var(--ds-gold-strong)}
#dsGsPanel .gsHint{padding:6px 10px 4px;font-size:10.5px;color:var(--ds-subtle);text-align:right}
</style>
<script>
/* =====================================================================
   EDEN BI — Global search
   Typing in the top search box shows the matches right under it:
   clients, unit codes and brokerage companies. Pick one to open it
   (Client 360 / company profile) — no scrolling to the table.
   "Show in table" still filters the Deals table like before.
   ===================================================================== */
(function initEdenGlobalSearch_(){
  const input=document.getElementById('dsGlobalSearch');
  const bar=input&&input.closest('.dsAppBar');
  if(!input||!bar)return;
  const panel=document.createElement('div');
  panel.id='dsGsPanel';panel.setAttribute('role','listbox');
  bar.appendChild(panel);
  let items=[],active=-1,timer=null;

  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const digits=v=>String(v||'').replace(/\D/g,'');
  const hl=(text,q)=>{
    const t=String(text||'');const i=t.toLowerCase().indexOf(q);
    if(!q||i<0)return esc(t);
    return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
  };
  const cancelled=s=>typeof isCancelledStatus_==='function'?isCancelledStatus_(s):/^cancel/i.test(String(s||''));

  function search(qRaw){
    const q=String(qRaw||'').trim().toLowerCase();
    const qd=digits(q);
    const out={clients:[],units:[],brokers:[],deals:0};
    if(q.length<2)return out;
    const rows=(typeof rawRows!=='undefined'&&rawRows)||[];
    const phoneHit=r=>qd.length>=4&&digits(r.mobile).includes(qd);
    // Clients (one entry per client)
    const byClient=new Map();
    rows.forEach(r=>{
      const nameHit=String(r.clientName||'').toLowerCase().includes(q);
      if(!nameHit&&!phoneHit(r))return;
      const k=typeof clientKeyOf==='function'?clientKeyOf(r):r.clientName;
      if(!byClient.has(k))byClient.set(k,{key:k,name:r.clientName,rows:[]});
      byClient.get(k).rows.push(r);
    });
    out.clients=[...byClient.values()].sort((a,b)=>{
      const as=String(a.name||'').toLowerCase().startsWith(q),bs=String(b.name||'').toLowerCase().startsWith(q);
      return (bs-as)||(b.rows.length-a.rows.length);
    });
    // Units
    out.units=rows.filter(r=>String(r.unitCode||'').toLowerCase().includes(q))
      .sort((a,b)=>cancelled(a.status)-cancelled(b.status)||String(a.unitCode).localeCompare(String(b.unitCode),undefined,{numeric:true}));
    // Brokerage companies
    const brokers=(typeof brokerRows!=='undefined'&&brokerRows)||[];
    const seen=new Set();
    out.brokers=brokers.filter(b=>{
      const hit=String(b.company||'').toLowerCase().includes(q)||String(b.admin||'').toLowerCase().includes(q)||(qd.length>=4&&digits(b.mobile).includes(qd));
      const k=String(b.company||'').trim().toLowerCase();
      if(!hit||!k||seen.has(k))return false;seen.add(k);return true;
    });
    out.deals=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)).length;
    return out;
  }

  function render(){
    const q=input.value.trim().toLowerCase();
    if(q.length<2){hide();return;}
    const res=search(q);
    items=[];let html='';
    const group=(title,list,max,fn)=>{
      if(!list.length)return;
      html+=`<div class="gsGroup"><span>${title}</span><span>${list.length>max?max+' of '+list.length:list.length}</span></div>`;
      list.slice(0,max).forEach(x=>{const it=fn(x);items.push(it.go);html+=`<button type="button" class="gsItem" data-i="${items.length-1}">${it.html}</button>`;});
    };
    group('Clients',res.clients,6,c=>{
      const active=c.rows.filter(r=>!cancelled(r.status));
      const units=[...new Set(c.rows.map(r=>r.unitCode).filter(Boolean))];
      const projects=[...new Set(c.rows.map(r=>r.project).filter(Boolean))];
      const phone=c.rows.map(r=>r.mobile).find(Boolean)||'';
      return {go:()=>openClient(c.key),html:`<span class="gsIco">${esc(String(c.name||'?').trim().charAt(0).toUpperCase())}</span>
        <span class="gsMain"><div class="gsTitle">${hl(c.name,q)}</div><div class="gsSub">${esc(projects.join(' • '))}${units.length?' — '+esc(units.slice(0,3).join(', '))+(units.length>3?' …':''):''}${phone?' — '+hl(phone,q):''}</div></span>
        ${active.length?`<span class="gsTag">${active.length} active</span>`:'<span class="gsTag cancel">Cancelled</span>'}`};
    });
    group('Units',res.units,6,r=>({go:()=>openClient(typeof clientKeyOf==='function'?clientKeyOf(r):r.clientName),
      html:`<span class="gsIco">⌂</span><span class="gsMain"><div class="gsTitle">${hl(r.unitCode,q)} <span style="font-weight:500;color:var(--ds-muted)">· ${esc(r.project)}</span></div>
      <div class="gsSub">${esc(r.clientName)} — ${esc(r.salesName||'')}</div></span><span class="gsTag${cancelled(r.status)?' cancel':''}">${esc(r.status||'')}</span>`}));
    group('Brokerage companies',res.brokers,5,b=>({go:()=>openBroker(b.company),
      html:`<span class="gsIco">◆</span><span class="gsMain"><div class="gsTitle">${hl(b.company,q)}</div>
      <div class="gsSub">${esc([b.admin,b.edenSales].filter(Boolean).join(' — '))}</div></span>${b.status?`<span class="gsTag">${esc(b.status)}</span>`:''}`}));
    if(!items.length)html+=`<div class="gsEmpty">No client, unit or company matches “${esc(input.value.trim())}”.</div>`;
    if(res.deals){
      items.push(()=>showInTable(input.value.trim()));
      html+=`<button type="button" class="gsItem gsAll" data-i="${items.length-1}">Show all ${res.deals} matching deals in the table →</button>`;
    }
    html+='<div class="gsHint">↑ ↓ to move • Enter to open • Esc to close</div>';
    panel.innerHTML=html;
    // Line the panel up with the search box.
    const sb=input.closest('.dsSearch')||input;
    panel.style.left=sb.offsetLeft+'px';
    panel.style.top=(sb.offsetTop+sb.offsetHeight+6)+'px';
    panel.style.width=Math.max(sb.offsetWidth,Math.min(560,window.innerWidth-24))+'px';
    if(sb.offsetLeft+panel.offsetWidth>window.innerWidth-12)panel.style.left=Math.max(12-bar.getBoundingClientRect().left,0)+'px';
    panel.classList.add('show');
    active=-1;
  }
  function hide(){panel.classList.remove('show');active=-1;}
  function pick(i){const go=items[i];if(!go)return;hide();input.blur();go();}
  function move(d){
    const btns=[...panel.querySelectorAll('.gsItem')];if(!btns.length)return;
    active=(active+d+btns.length)%btns.length;
    btns.forEach((b,i)=>b.classList.toggle('on',i===active));
    btns[active].scrollIntoView({block:'nearest'});
  }

  function openClient(key){
    if(typeof c360Open_==='function')c360Open_(key);
  }
  function openBroker(company){
    if(typeof openBrokerCompanyDetails_==='function'){openBrokerCompanyDetails_(company);window.scrollTo({top:0,behavior:'smooth'});}
  }
  function showInTable(q){
    const s=document.getElementById('search');
    if(s){s.value=q;}
    if(typeof applyFilters==='function')applyFilters();
    const t=document.getElementById('mainTable');
    const box=t&&(t.closest('.tableCard,.card,section')||t);
    if(box)box.scrollIntoView({behavior:'smooth',block:'start'});
  }

  input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,120);});
  input.addEventListener('focus',()=>{if(input.value.trim().length>=2)render();});
  input.addEventListener('keydown',e=>{
    if(!panel.classList.contains('show'))return;
    if(e.key==='ArrowDown'){e.preventDefault();move(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
    else if(e.key==='Enter'){e.preventDefault();pick(active>=0?Number(panel.querySelectorAll('.gsItem')[active].dataset.i):0);}
    else if(e.key==='Escape'){hide();}
  });
  input.addEventListener('search',()=>{if(!input.value){hide();const s=document.getElementById('search');if(s&&s.value){s.value='';if(typeof applyFilters==='function')applyFilters();}}});
  panel.addEventListener('mousedown',e=>e.preventDefault());   // keep focus while clicking
  panel.addEventListener('click',e=>{const b=e.target.closest('.gsItem');if(b)pick(Number(b.dataset.i));});
  document.addEventListener('mousedown',e=>{if(!panel.contains(e.target)&&e.target!==input)hide();});
  window.addEventListener('resize',hide);
})();
</script>
