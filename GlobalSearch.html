<style id="eden-global-search">
html[data-theme] #appRoot .dsAppBar{position:sticky}
#dsGsPanel{position:fixed;z-index:446;top:0;left:0;width:min(560px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;
  background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:14px;box-shadow:0 18px 42px rgba(0,0,0,.18);padding:6px;display:none}
#dsGsPanel.show{display:block}
#dsGsPanel .gsGroup{padding:8px 10px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ds-muted);display:flex;justify-content:space-between}
#dsGsPanel .gsItem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;cursor:pointer;border:0;background:none;text-align:left;color:var(--ds-text);font:inherit}
#dsGsPanel .gsItem:hover,#dsGsPanel .gsItem.on{background:var(--ds-gold-soft)}
#dsGsPanel .gsIco{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ds-surface-2);color:var(--ds-gold-strong);font-size:13px;font-weight:800}
#dsGsPanel .gsMain{flex:1;min-width:0}
#dsGsPanel .gsTitle{font-size:13px;font-weight:700;color:var(--ds-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dsGsPanel .gsSub{font-size:11.5px;color:var(--ds-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#dsGsPanel .gsTag{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ds-surface-2);color:var(--ds-muted)}
#dsGsPanel .gsTag.cancel{color:var(--ds-red)}
#dsGsPanel mark{background:none;color:var(--ds-gold-strong);font-weight:800}
#dsGsPanel .gsEmpty{padding:18px 12px;text-align:center;color:var(--ds-muted);font-size:13px}
#dsGsPanel .gsAll{margin-top:4px;border-top:1px solid var(--ds-line);border-radius:0 0 10px 10px;justify-content:center;font-size:12px;font-weight:700;color:var(--ds-gold-strong)}
#dsGsPanel .gsHint{padding:6px 10px 4px;font-size:10.5px;color:var(--ds-subtle);text-align:right}
/* Floating search button — bottom right on every page */
#dsGsFab{position:fixed;z-index:444;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;justify-content:flex-end;height:54px;width:54px;border-radius:999px;
  background:var(--ds-surface,#fffdf9);border:1px solid var(--ds-gold-line,#d9c08a);box-shadow:0 12px 30px rgba(0,0,0,.22);transition:width .25s ease,box-shadow .2s;overflow:hidden}
#dsGsFab:hover{box-shadow:0 14px 36px rgba(0,0,0,.28)}
#dsGsFab .gsFabBtn{flex:0 0 54px;width:54px;height:54px;margin:-1px;border:0;border-radius:999px;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--ds-gold,#b08a42),var(--ds-gold-strong,#8a6a2c))}
#dsGsFab .gsFabBtn svg{width:22px;height:22px}
#dsGsFab input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ds-heading,#120f0b);font:600 14px var(--ds-font,Inter,sans-serif);padding:0 6px 0 18px;display:none}
#dsGsFab input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
#dsGsFab input::placeholder{color:var(--ds-muted,#8a8070);font-weight:500}
#dsGsFab .gsFabX{display:none;border:0;background:transparent;color:var(--ds-muted,#8a8070);font-size:20px;cursor:pointer;padding:0 6px}
#dsGsFab.open{width:min(560px,calc(100vw - 32px))}
#dsGsFab.open input,#dsGsFab.open .gsFabX{display:block}
#dsGsFab.open .gsFabBtn{order:3}
body:has(#appRoot.hidden) #dsGsFab,body:has(#loginScreen:not(.hidden)) #dsGsFab{display:none}
body.gsUp .c360{z-index:438}body.gsUp .c360Back{z-index:437}
@media(max-width:700px){#dsGsFab{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);height:50px;width:50px}#dsGsFab .gsFabBtn{flex-basis:50px;width:50px;height:50px}#dsGsFab.open{width:calc(100vw - 32px)}}
@media print{#dsGsFab{display:none!important}}
</style>
<script>
/* =====================================================================
   EDEN BI — Global search
   Typing in the top search box (or the Search box in the filters)
   shows the matches right under it:
   clients, unit codes and brokerage companies. Pick one to open it
   (Client 360 / company profile) — no scrolling to the table.
   "Show in table" still filters the Deals table like before.
   ===================================================================== */
(function initEdenGlobalSearch_(){
  // The top bar search and the Search box in the filters panel.
  // Floating search button (bottom right): opens a search bar that works on every page.
  const fab=document.createElement('div');fab.id='dsGsFab';
  fab.innerHTML=`<input id="dsGsFabInput" type="search" placeholder="Search client, phone, unit or broker…" autocomplete="off" aria-label="Search"><button type="button" class="gsFabX" aria-label="Close search">×</button><button type="button" class="gsFabBtn" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>`;
  document.body.appendChild(fab);
  const fabIn=fab.querySelector('input');
  const fabOpen=()=>{fab.classList.add('open');setTimeout(()=>fabIn.focus(),60);};
  const fabClose=()=>{fab.classList.remove('open');fabIn.value='';hide();fabIn.blur();};
  fab.querySelector('.gsFabBtn').addEventListener('click',()=>{if(!fab.classList.contains('open'))fabOpen();else if(fabIn.value.trim().length>=2){input=fabIn;render();}else fabIn.focus();});
  fab.querySelector('.gsFabX').addEventListener('click',fabClose);
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){   // top search box when it can be seen, else this one
      const g=document.getElementById('dsGlobalSearch');
      if(document.querySelector('.da')||!g||g.offsetParent===null){e.preventDefault();fabOpen();}}
    else if(e.key==='Escape'&&document.activeElement===fabIn&&!panel.classList.contains('show'))fabClose();
  });
  document.addEventListener('mousedown',e=>{if(fab.classList.contains('open')&&!fab.contains(e.target)&&!panel.contains(e.target)&&!fabIn.value.trim())fab.classList.remove('open');});
  const inputs=['dsGlobalSearch','search','dsGsFabInput'].map(id=>document.getElementById(id)).filter(Boolean);
  if(!inputs.length)return;
  let input=inputs[0];
  const panel=document.createElement('div');
  panel.id='dsGsPanel';panel.setAttribute('role','listbox');
  document.body.appendChild(panel);
  let items=[],active=-1,timer=null;

  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const digits=v=>String(v||'').replace(/\D/g,'');
  const hl=(text,q)=>{
    const t=String(text||'');const i=t.toLowerCase().indexOf(q);
    if(!q||i<0)return esc(t);
    return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
  };
  const cancelled=s=>typeof isCancelledStatus_==='function'?isCancelledStatus_(s):/^cancel/i.test(String(s||''));

  function search(qRaw){
    const q=String(qRaw||'').trim().toLowerCase();
    const qd=digits(q);
    const out={clients:[],units:[],brokers:[],deals:0};
    if(q.length<2)return out;
    const rows=(typeof rawRows!=='undefined'&&rawRows)||[];
    // A pasted list ("a ; b ; c"): every client matching any line.
    if(q.indexOf(';')>=0&&typeof edenQ_==='function'){
      const hits=rows.filter(r=>edenQ_(Object.values(r).join(' '),q)),by=new Map();
      hits.forEach(r=>{const k=typeof clientKeyOf==='function'?clientKeyOf(r):r.clientName;if(!by.has(k))by.set(k,{key:k,name:r.clientName,rows:[]});by.get(k).rows.push(r);});
      out.clients=[...by.values()];out.deals=hits.length;out.multi=true;
      out.missing=typeof edenQMissing_==='function'?edenQMissing_(rows,q,r=>Object.values(r).join(' ')):[];
      return out;
    }
    const phoneHit=r=>qd.length>=4&&digits(r.mobile).includes(qd);
    // Clients (one entry per client)
    const byClient=new Map();
    rows.forEach(r=>{
      const nameHit=String(r.clientName||'').toLowerCase().includes(q);
      if(!nameHit&&!phoneHit(r))return;
      const k=typeof clientKeyOf==='function'?clientKeyOf(r):r.clientName;
      if(!byClient.has(k))byClient.set(k,{key:k,name:r.clientName,rows:[]});
      byClient.get(k).rows.push(r);
    });
    out.clients=[...byClient.values()].sort((a,b)=>{
      const as=String(a.name||'').toLowerCase().startsWith(q),bs=String(b.name||'').toLowerCase().startsWith(q);
      return (bs-as)||(b.rows.length-a.rows.length);
    });
    // Units
    out.units=rows.filter(r=>String(r.unitCode||'').toLowerCase().includes(q))
      .sort((a,b)=>cancelled(a.status)-cancelled(b.status)||String(a.unitCode).localeCompare(String(b.unitCode),undefined,{numeric:true}));
    // Brokerage companies
    const brokers=(typeof brokerRows!=='undefined'&&brokerRows)||[];
    const seen=new Set();
    out.brokers=brokers.filter(b=>{
      const hit=String(b.company||'').toLowerCase().includes(q)||String(b.admin||'').toLowerCase().includes(q)||(qd.length>=4&&digits(b.mobile).includes(qd));
      const k=String(b.company||'').trim().toLowerCase();
      if(!hit||!k||seen.has(k))return false;seen.add(k);return true;
    });
    out.deals=rows.filter(r=>edenQ_(Object.values(r).join(' '),q)).length;
    return out;
  }

  function render(){
    const q=input.value.trim().toLowerCase();
    if(q.length<2){hide();return;}
    const res=search(q);
    items=[];let html='';
    const group=(title,list,max,fn)=>{
      if(!list.length)return;
      html+=`<div class="gsGroup"><span>${title}</span><span>${list.length>max?max+' of '+list.length:list.length}</span></div>`;
      list.slice(0,max).forEach(x=>{const it=fn(x);items.push(it.go);html+=`<button type="button" class="gsItem" data-i="${items.length-1}">${it.html}</button>`;});
    };
    if(res.multi){const n=q.split(';').map(x=>x.trim()).filter(Boolean).length;
      html+=`<div class="gsGroup"><span>🔎 ${n-res.missing.length} of ${n} found</span><span></span></div>`+(res.missing.length?`<div class="gsEmpty" style="text-align:left;color:var(--ds-red,#b3261e)">Not found: ${input.value.split(';').map(x=>x.trim()).filter(x=>x&&res.missing.includes(x.toLowerCase())).map(esc).join(' · ')}</div>`:'');}
    group('Clients',res.clients,res.multi?60:6,c=>{
      const active=c.rows.filter(r=>!cancelled(r.status));
      const units=[...new Set(c.rows.map(r=>r.unitCode).filter(Boolean))];
      const projects=[...new Set(c.rows.map(r=>r.project).filter(Boolean))];
      const phone=c.rows.map(r=>r.mobile).find(Boolean)||'';
      return {go:()=>openClient(c.key),html:`<span class="gsIco">${esc(String(c.name||'?').trim().charAt(0).toUpperCase())}</span>
        <span class="gsMain"><div class="gsTitle">${hl(c.name,q)}</div><div class="gsSub">${esc(projects.join(' • '))}${units.length?' — '+esc(units.slice(0,3).join(', '))+(units.length>3?' …':''):''}${phone?' — '+hl(phone,q):''}</div></span>
        ${active.length?`<span class="gsTag">${active.length} active</span>`:'<span class="gsTag cancel">Cancelled</span>'}`};
    });
    group('Units',res.units,6,r=>({go:()=>openClient(typeof clientKeyOf==='function'?clientKeyOf(r):r.clientName),
      html:`<span class="gsIco">⌂</span><span class="gsMain"><div class="gsTitle">${hl(r.unitCode,q)} <span style="font-weight:500;color:var(--ds-muted)">· ${esc(r.project)}</span></div>
      <div class="gsSub">${esc(r.clientName)} — ${esc(r.salesName||'')}</div></span><span class="gsTag${cancelled(r.status)?' cancel':''}">${esc(r.status||'')}</span>`}));
    group('Brokerage companies',res.brokers,5,b=>({go:()=>openBroker(b.company),
      html:`<span class="gsIco">◆</span><span class="gsMain"><div class="gsTitle">${hl(b.company,q)}</div>
      <div class="gsSub">${esc([b.admin,b.edenSales].filter(Boolean).join(' — '))}</div></span>${b.status?`<span class="gsTag">${esc(b.status)}</span>`:''}`}));
    if(!items.length)html+=`<div class="gsEmpty">No client, unit or company matches “${esc(input.value.trim())}”.</div>`;
    if(res.deals){
      items.push(()=>showInTable(input.value.trim()));
      html+=`<button type="button" class="gsItem gsAll" data-i="${items.length-1}">Show all ${res.deals} matching deals in the table →</button>`;
    }
    html+='<div class="gsHint">↑ ↓ to move • Enter to open • Esc to close</div>';
    panel.innerHTML=html;
    panel.classList.add('show');
    place();
    active=-1;
  }
  // Line the panel up under the box being typed in (opens upwards if there is no room below).
  function place(){
    if(!panel.classList.contains('show'))return;
    const sb=(input.closest('.dsSearch,.filterGroup')||input).getBoundingClientRect();
    const w=Math.min(Math.max(sb.width,Math.min(560,window.innerWidth-24)),window.innerWidth-24);
    const left=Math.max(12,Math.min(sb.left,window.innerWidth-w-12));
    panel.style.width=w+'px';panel.style.left=left+'px';
    const h=panel.offsetHeight,below=window.innerHeight-sb.bottom-12;
    panel.style.top=(h>below&&sb.top>below?Math.max(8,sb.top-h-6):sb.bottom+6)+'px';
  }
  function hide(){panel.classList.remove('show');active=-1;}
  function pick(i){const go=items[i];if(!go)return;hide();input.blur();go();}
  function move(d){
    const btns=[...panel.querySelectorAll('.gsItem')];if(!btns.length)return;
    active=(active+d+btns.length)%btns.length;
    btns.forEach((b,i)=>b.classList.toggle('on',i===active));
    btns[active].scrollIntoView({block:'nearest'});
  }

  function openClient(key){
    if(typeof c360Open_!=='function')return;
    c360Open_(key);
    // opened over a full-screen page (Analytics, Approvals…): bring the deal card to the front
    if(input===fabIn&&document.querySelector('.da')){document.body.classList.add('gsUp');
      if(typeof c360Close_==='function'&&!c360Close_.__gs){const o=c360Close_;c360Close_=function(){document.body.classList.remove('gsUp');return o.apply(this,arguments);};c360Close_.__gs=true;}}
  }
  function openBroker(company){
    if(typeof openBrokerCompanyDetails_==='function'){openBrokerCompanyDetails_(company);window.scrollTo({top:0,behavior:'smooth'});}
  }
  function showInTable(q){
    if(input===fabIn){fab.classList.remove('open');fabIn.value='';
      document.querySelectorAll('.da .daX').forEach(b=>b.click());   // close full-screen pages so the table shows
      const t=document.getElementById('mainTable');
      if((!t||t.offsetParent===null)&&typeof setView==='function'){try{setView('dashboard',null);}catch(e){}}}
    const s=document.getElementById('search');
    if(s&&s.value!==q){s.value=q;}
    if(typeof applyFilters==='function')applyFilters();
    const t=document.getElementById('mainTable');
    const box=t&&(t.closest('.tableCard,.card,section')||t);
    if(box)box.scrollIntoView({behavior:'smooth',block:'start'});
  }

  inputs.forEach(el=>{
  el.addEventListener('input',()=>{input=el;clearTimeout(timer);timer=setTimeout(render,120);});
  el.addEventListener('focus',()=>{input=el;if(el.value.trim().length>=2)render();});
  el.addEventListener('keydown',e=>{
    input=el;
    if(!panel.classList.contains('show'))return;
    if(e.key==='ArrowDown'){e.preventDefault();move(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
    else if(e.key==='Enter'){e.preventDefault();pick(active>=0?Number(panel.querySelectorAll('.gsItem')[active].dataset.i):0);}
    else if(e.key==='Escape'){hide();}
  });
  el.addEventListener('search',()=>{if(!el.value){hide();const s=document.getElementById('search');if(s&&s.value){s.value='';if(typeof applyFilters==='function')applyFilters();}}});
  });
  panel.addEventListener('mousedown',e=>e.preventDefault());   // keep focus while clicking
  panel.addEventListener('click',e=>{const b=e.target.closest('.gsItem');if(b)pick(Number(b.dataset.i));});
  document.addEventListener('mousedown',e=>{if(!panel.contains(e.target)&&!inputs.includes(e.target))hide();});
  window.addEventListener('resize',hide);
  window.addEventListener('scroll',e=>{if(!panel.contains(e.target))place();},{passive:true,capture:true});
})();
</script>
