<script>
/* =====================================================================
   EDEN BI — Internal commissions (Transactions › Internal Commissions, admins)
   Month = the reservation month of the deal (cancelled deals excluded).
   Sales team: monthly target by role; credited sales = own deals in full
   + share deals split (50/50 by default); the month's achievement picks the
   rate tier for every deal of that person (In-direct / Direct / Private).
   Other departments (no target): % of sales, EGP per contract or EGP per 1M,
   on all the month's deals or only their team's (Sales Manager / Head of Sales).
   Settings: getCommSetup / saveCommSetup (CommissionSetup.js).
   ===================================================================== */
const IC_={setup:null,tab:'sales',from:'',to:'',sel:null,q:'',dpMin:9,dpMax:null,open:{},busy:false,draft:null};
const IC_SCHEMES_={tiers:'Sales tiers (target)',pct:'% of sales',perDeal:'EGP per contract',perMillion:'EGP per 1M'};
function icEsc_(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function icN_(n,d=0){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});}
function icPct_(x,d=1){return (Number(x||0)*100).toFixed(d).replace(/\.0$/,'')+'%';}
function icIsAdmin_(){const r=String((typeof AUTH_USER!=='undefined'&&AUTH_USER&&AUTH_USER.role)||'').trim().toLowerCase();return r==='admin'||r==='super admin';}
const icNorm_=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
const icIso_=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function icMonthRange_(back){const d=new Date();const a=new Date(d.getFullYear(),d.getMonth()-(back||0),1),b=new Date(a.getFullYear(),a.getMonth()+1,0);return [icIso_(a),icIso_(b)];}
function icRangeLabel_(){const f=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'…';
  const [a,b]=[IC_.from,IC_.to];if(a&&b){const A=new Date(a+'T00:00'),B=new Date(b+'T00:00');
    if(A.getDate()===1&&B.getMonth()===A.getMonth()&&B.getFullYear()===A.getFullYear()&&new Date(B.getFullYear(),B.getMonth()+1,0).getDate()===B.getDate())return A.toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
  return f(a)+' → '+f(b);}
/* How many calendar months the range touches (monthly targets are multiplied by it). */
function icMonths_(){if(!IC_.from||!IC_.to)return 1;const A=new Date(IC_.from+'T00:00'),B=new Date(IC_.to+'T00:00');return Math.max(1,(B.getFullYear()-A.getFullYear())*12+B.getMonth()-A.getMonth()+1);}
function icDealDay_(r){const y=Number(r.year),m=Number(r.month);if(!y||!m)return '';return y+'-'+String(m).padStart(2,'0')+'-'+String(Number(r.day)||1).padStart(2,'0');}
function icDpPct_(r){const a=Number(r.amount)||0;return a>0?Math.round((Number(r.actualPaid)||0)/a*10000)/100:0;}   // 2 decimals (see edenDpPct_)
function icType_(r){
  const t=[r.mainSource,r.sourceType,r.dealStatus].map(x=>String(x||'').toLowerCase()).join(' ');
  if(/private/.test(t))return 'Private';
  if(/^\s*direct/.test(String(r.mainSource||'').toLowerCase()))return 'Direct';
  return 'In-direct';
}
function icRate_(tiers,ach){let r=0;(tiers||[]).forEach(([min,rate])=>{if(ach>=min-1e-9)r=rate;});return r;}
/* Multi-choice filters (same fields as the Transactions filters). */
const IC_MF_=[
  ['project','Project',r=>r.project],
  ['status','Status',r=>r.status],
  ['branch','Branch',r=>r.branch],
  ['manager','Sales manager',r=>[r.salesManager,r.headOfSales]],
  ['sales','Sales',r=>[r.salesName,typeof isShareDeal_==='function'&&isShareDeal_(r)?r.sharedWith:'']],
  ['dealType','Deal type',r=>r.dealStatus],
  ['sharedWith','Shared with',r=>r.sharedWith],
  ['commission','Commission',r=>typeof commissionPaid_==='function'?(commissionPaid_(r)?'Paid':'Not paid'):''],
  ['mainSource','Main source',r=>r.mainSource],
  ['sourceType','Source type',r=>r.sourceType],
  ['campaign','Campaign name',r=>r.campaignName],
  ['mediaBuyer','Media buyer',r=>r.mediaBuyer],
  ['brokerage','Brokerage company',r=>r.brokerageCompany],
  ['clientType','Client type',r=>r.clientType],
  ['unitType','Unit type',r=>r.unitType]
];
const IC_MF_GROUPS_=[['',['project','status']],['Sales team',['branch','manager','sales','dealType','sharedWith','commission']],['Source',['mainSource','sourceType','campaign','mediaBuyer','brokerage']],['Client',['clientType','unitType']]];
function icMsGroupsHtml_(){return IC_MF_GROUPS_.map(([g,keys])=>`<div class="icGrp">${g?`<em>${g}</em>`:''}<div>${keys.map(k=>icMsHtml_(IC_MF_.find(f=>f[0]===k))).join('')}</div></div>`).join('');}
const icVals_=(f,r)=>[].concat(f[2](r)).map(x=>String(x??'').trim()).filter(Boolean);
function icDeals_(){
  const rows=(typeof rawRows!=='undefined'&&rawRows)||[],sel=IC_.sel||{};
  const cancelled=r=>typeof isCancelledStatus_==='function'?isCancelledStatus_(r.status):/^cancel/i.test(String(r.status||''));
  return rows.filter(r=>{
    const d=icDealDay_(r);if(!d||(IC_.from&&d<IC_.from)||(IC_.to&&d>IC_.to))return false;
    if(!(Number(r.amount)>0))return false;
    // cancelled deals never count unless "Cancel" is picked in Status
    if(cancelled(r)&&!(sel.status||[]).some(v=>/^cancel/i.test(v)))return false;
    if(IC_.q&&!Object.values(r).join(' ').toLowerCase().includes(IC_.q))return false;
    for(const f of IC_MF_){const want=sel[f[0]];if(want&&want.length&&!icVals_(f,r).some(v=>want.includes(v)))return false;}
    const p=icDpPct_(r);if(IC_.dpMin!=null&&p<IC_.dpMin-1e-9)return false;if(IC_.dpMax!=null&&p>IC_.dpMax+1e-9)return false;
    return true;
  });
}
function icMsHtml_(f){
  const want=(IC_.sel||{})[f[0]]||[];
  const lab=want.length?(want.length>2?want.slice(0,2).join(', ')+' +'+(want.length-2):want.join(', ')):'All';
  return `<div class="icMs" data-ms="${f[0]}"><span class="icMsL">${f[1]}</span><button type="button" class="icMsB${want.length?' on':''}">${icEsc_(lab)} ▾</button></div>`;
}
function icMsOpen_(btn){
  document.querySelector('.icMsPop')?.remove();
  const box=btn.closest('.icMs'),key=box.dataset.ms,f=IC_MF_.find(x=>x[0]===key);
  const rows=(typeof rawRows!=='undefined'&&rawRows)||[],counts={};
  rows.forEach(r=>{const d=icDealDay_(r);if(!d||(IC_.from&&d<IC_.from)||(IC_.to&&d>IC_.to))return;icVals_(f,r).forEach(v=>counts[v]=(counts[v]||0)+1);});
  rows.forEach(r=>icVals_(f,r).forEach(v=>{if(!(v in counts))counts[v]=0;}));
  const list=Object.keys(counts).sort((a,b)=>(counts[b]>0)-(counts[a]>0)||a.localeCompare(b));
  const want=new Set((IC_.sel[key]||[]));
  const pop=document.createElement('div');pop.className='icMsPop';
  pop.innerHTML=`<input type="search" placeholder="Search…"><div class="icMsAct"><button type="button" data-all>Select all</button><button type="button" data-none>Clear</button></div>
    <div class="icMsList">${list.map(v=>`<label class="${counts[v]?'':'zero'}"><input type="checkbox" value="${icEsc_(v)}"${want.has(v)?' checked':''}><span>${icEsc_(v)}</span><small>${counts[v]}</small></label>`).join('')||'<em>Nothing</em>'}</div>`;
  box.appendChild(pop);
  const apply=()=>{IC_.sel[key]=[...pop.querySelectorAll('.icMsList input:checked')].map(i=>i.value);const b=box.querySelector('.icMsB'),w=IC_.sel[key];
    b.textContent=(w.length?(w.length>2?w.slice(0,2).join(', ')+' +'+(w.length-2):w.join(', ')):'All')+' ▾';b.classList.toggle('on',!!w.length);icRender_(true);};
  pop.addEventListener('change',e=>{if(e.target.matches('.icMsList input'))apply();});
  pop.querySelector('[data-all]').addEventListener('click',()=>{pop.querySelectorAll('.icMsList label:not([hidden]) input').forEach(i=>i.checked=true);apply();});
  pop.querySelector('[data-none]').addEventListener('click',()=>{pop.querySelectorAll('.icMsList input').forEach(i=>i.checked=false);apply();});
  const q=pop.querySelector('input[type=search]');q.focus();
  q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase();pop.querySelectorAll('.icMsList label').forEach(l=>l.hidden=!!t&&!l.textContent.toLowerCase().includes(t));});
  pop.addEventListener('click',e=>e.stopPropagation());
}
document.addEventListener('click',e=>{if(!e.target.closest('.icMs'))document.querySelector('.icMsPop')?.remove();});
function icStaff_(){return ((IC_.setup&&IC_.setup.staff)||[]).filter(p=>p.active!==false);}
/* Sales team */
/* Target of a salesperson over the filter range, month by month: the Target Center
   (monthly, else quarterly ÷ 3, else yearly ÷ 12, EGP) wins; otherwise the role's monthly target. */
function icTcTarget_(name,roleMonthly){
  const T=(typeof TARGETS_DATA!=='undefined'&&Array.isArray(TARGETS_DATA))?TARGETS_DATA:[],n=icNorm_(name);
  const mine=T.filter(t=>icNorm_(t.scope)==='sales'&&icNorm_(t.name)===n);
  const M=['january','february','march','april','may','june','july','august','september','october','november','december'];
  if(!IC_.from||!IC_.to)return {v:roleMonthly,from:0};
  let d=new Date(IC_.from+'T00:00');const end=new Date(IC_.to+'T00:00');let v=0,from=0;
  while(d<=end||(d.getFullYear()===end.getFullYear()&&d.getMonth()===end.getMonth())){
    const y=d.getFullYear(),m=d.getMonth(),q='Q'+(Math.floor(m/3)+1);
    const yr=mine.filter(t=>Number(t.year)===y);
    const mo=yr.find(t=>icNorm_(t.period)==='monthly'&&(icNorm_(t.month)===M[m]||Number(t.month)===m+1));
    const qu=yr.find(t=>icNorm_(t.period)==='quarterly'&&String(t.quarter).toUpperCase()===q);
    const ye=yr.find(t=>icNorm_(t.period)==='yearly');
    const x=mo?Number(mo.targetEGP):qu?Number(qu.targetEGP)/3:ye?Number(ye.targetEGP)/12:0;
    if(x>0){v+=x;from++;}else v+=roleMonthly;
    d=new Date(y,m+1,1);if(d>end)break;
  }
  return {v,from};
}
function icSales_(){
  const S=IC_.setup,deals=icDeals_(),split=Number(S.shareSplit)||0.5,people={};
  const roleOf=n=>{const p=icStaff_().find(x=>icNorm_(x.name)===icNorm_(n)&&x.dept==='Sales');return p&&p.role||'';};
  const add=(name,r,credit,share)=>{const k=icNorm_(name);if(!k)return;
    const P=people[k]||(people[k]={name:String(name).trim(),deals:[],credited:0,by:{Direct:0,'In-direct':0,Private:0}});
    const type=icType_(r);P.deals.push({r,credit,share,type});P.credited+=credit;P.by[type]+=credit;};
  deals.forEach(r=>{
    const share=typeof isShareDeal_==='function'&&isShareDeal_(r),amt=Number(r.amount)||0;
    if(share){add(r.salesName,r,amt*split,true);add(r.sharedWith,r,amt*(1-split),true);}else add(r.salesName,r,amt,false);
  });
  icStaff_().filter(p=>p.dept==='Sales').forEach(p=>{const k=icNorm_(p.name);if(!people[k])people[k]={name:p.name,deals:[],credited:0,by:{Direct:0,'In-direct':0,Private:0}};});
  return Object.values(people).map(P=>{
    const role=roleOf(P.name),R=(S.roles||[]).find(x=>x.role===role)||(S.roles||[])[0]||{role:'',target:0};
    const tc=icTcTarget_(P.name,Number(R.target)||0),target=tc.v,ach=target?P.credited/target:0;
    let comm=0;P.deals.forEach(d=>{d.rate=d.type==='Private'?S.privateRate:icRate_(d.type==='Direct'?S.direct:S.indirect,ach);d.comm=d.credit*d.rate;comm+=d.comm;});
    return Object.assign(P,{role:R.role,roleSet:!!role||tc.from>0,tcFrom:tc.from,target,ach,comm});
  }).sort((a,b)=>b.credited-a.credited||a.name.localeCompare(b.name));
}
/* Other departments */
function icOthers_(){
  const deals=icDeals_();
  return icStaff_().filter(p=>p.dept!=='Sales').map(p=>{
    const mine=p.scope==='team'?deals.filter(r=>[r.salesManager,r.headOfSales,r.cco].some(x=>icNorm_(x)===icNorm_(p.name))):deals;
    const sales=mine.reduce((a,r)=>a+(Number(r.amount)||0),0),n=mine.length,v=Number(p.value)||0;
    const comm=p.scheme==='pct'?sales*v/100:p.scheme==='perDeal'?n*v:p.scheme==='perMillion'?sales/1e6*v:0;
    return Object.assign({},p,{n,sales,comm});
  }).sort((a,b)=>a.dept.localeCompare(b.dept)||b.comm-a.comm);
}
function icMount_(){
  const menu=document.querySelector('#transactionsModule .moduleMenu');if(!menu)return;
  let b=menu.querySelector('[data-ic]');
  if(!b){b=document.createElement('button');b.type='button';b.dataset.ic='1';b.textContent='Internal Commissions';b.addEventListener('click',icOpen_);
    const after=menu.querySelector('[data-eden-commissions]')||[...menu.querySelectorAll('button')].find(x=>/deals details/i.test(x.textContent));
    if(after)after.insertAdjacentElement('afterend',b);else menu.appendChild(b);}
  b.style.display=icIsAdmin_()?'':'none';
}
function icOpen_(){
  if(!icIsAdmin_()){alert('Internal commissions are for admins only.');return;}
  icClose_();if(!IC_.from){[IC_.from,IC_.to]=icMonthRange_(0);}
  const back=document.createElement('div');back.className='daBack';back.id='icBack';back.addEventListener('click',icClose_);
  const el=document.createElement('section');el.className='da';el.id='ic';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="daHead"><div><small>Transactions</small><h2>Internal Commissions</h2></div>
    <div class="daTools"><button type="button" class="daBtn" data-clearf>Clear filters</button><button type="button" class="daBtn" data-xl>⬇ Excel</button><button type="button" class="daX" aria-label="Close">×</button></div></div>
    <div class="icFilters"><label class="icQ">Search<input type="search" data-q placeholder="Client / unit / campaign…" value="${icEsc_(IC_.q)}"></label><label>From<input type="date" data-f="from" value="${icEsc_(IC_.from)}"></label><label>To<input type="date" data-f="to" value="${icEsc_(IC_.to)}"></label>
      <button type="button" class="daBtn" data-range="0">This month</button><button type="button" class="daBtn" data-range="1">Last month</button>
      <span class="icMsWrap"></span>
      <label title="Actual Paid ÷ Final Price">DP paid % from<input type="number" step="0.1" data-f="dpMin" value="${IC_.dpMin??''}" style="width:72px"></label><label>to<input type="number" step="0.1" data-f="dpMax" value="${IC_.dpMax??''}" placeholder="any" style="width:72px"></label></div>
    <div class="daTabs"></div><div class="daBody"><div class="daNote" style="text-align:center;padding:40px">Loading…</div></div>`;
  document.body.append(back,el);
  el.querySelector('.daX').addEventListener('click',icClose_);
  el.querySelector('[data-xl]').addEventListener('click',icExcel_);
  el.querySelectorAll('.icFilters [data-f]').forEach(i=>i.addEventListener('change',()=>{const k=i.dataset.f;
    IC_[k]=(k==='dpMin'||k==='dpMax')?(i.value===''?null:Number(i.value)):i.value;icRender_();}));
  el.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>{[IC_.from,IC_.to]=icMonthRange_(+b.dataset.range);el.querySelector('[data-f="from"]').value=IC_.from;el.querySelector('[data-f="to"]').value=IC_.to;icRender_();}));
  el.querySelector('.icFilters').addEventListener('click',e=>{const b=e.target.closest('.icMsB');if(b){e.stopPropagation();if(b.closest('.icMs').querySelector('.icMsPop'))document.querySelector('.icMsPop')?.remove();else icMsOpen_(b);}});
  el.querySelector('[data-q]').addEventListener('input',e=>{clearTimeout(IC_.qt);IC_.qt=setTimeout(()=>{IC_.q=e.target.value.trim().toLowerCase();icRender_(true);},250);});
  el.querySelector('[data-clearf]').addEventListener('click',()=>{IC_.q='';el.querySelector('[data-q]').value='';IC_.sel={project:IC_.setup&&IC_.setup.project?[IC_.setup.project]:[]};IC_.dpMin=9;IC_.dpMax=null;el.querySelector('[data-f="dpMin"]').value=9;el.querySelector('[data-f="dpMax"]').value='';icRender_();});
  document.addEventListener('keydown',icKey_);
  google.script.run.withSuccessHandler(s=>{IC_.setup=s;if(!IC_.sel)IC_.sel={project:s.project?[s.project]:[]};icRender_();})
    .withFailureHandler(err=>{const b=el.querySelector('.daBody');if(b)b.innerHTML=`<div class="daNote daMsg err" style="text-align:center;padding:40px">Could not load.<br>${icEsc_(err&&err.message||err)}</div>`;})
    .getCommSetup(AUTH_TOKEN);
}
function icClose_(){document.getElementById('ic')?.remove();document.getElementById('icBack')?.remove();document.removeEventListener('keydown',icKey_);}
function icKey_(e){if(e.key==='Escape')icClose_();}
function icRender_(keepFilters){
  const el=document.getElementById('ic');if(!el||!IC_.setup)return;
  const ff=el.querySelector('.icFilters');if(ff)ff.style.display=IC_.tab==='setup'?'none':'';
  const mw=el.querySelector('.icMsWrap');if(mw&&!keepFilters)mw.innerHTML=icMsGroupsHtml_();
  const sales=icSales_(),others=icOthers_();
  el.querySelector('.daTabs').innerHTML=[['sales','Sales team',sales.length],['others','Other departments',others.length],['setup','Setup','']].map(([k,l,n])=>`<button type="button" class="daTab${IC_.tab===k?' on':''}" data-tab="${k}">${l}${n!==''?`<b>${n}</b>`:''}</button>`).join('');
  el.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{IC_.tab=b.dataset.tab;IC_.draft=null;icRender_();}));
  const body=el.querySelector('.daBody');
  if(IC_.tab==='setup'){icSetup_(body);return;}
  const deals=icDeals_(),total=deals.reduce((a,r)=>a+(Number(r.amount)||0),0);
  const sc=sales.reduce((a,p)=>a+p.comm,0),oc=others.reduce((a,p)=>a+p.comm,0);
  let html=`<div class="icKpis"><div class="icKpi"><span>${icEsc_(icRangeLabel_())} · sales</span><b>${icN_(total)}</b></div><div class="icKpi"><span>Deals</span><b>${deals.length}</b></div>
    <div class="icKpi"><span>Sales team commission</span><b>${icN_(sc)}</b></div><div class="icKpi gold"><span>All commissions</span><b>${icN_(sc+oc)}</b></div></div>`;
  if(IC_.tab==='sales'){
    if(!sales.length)html+=`<div class="daNote" style="text-align:center;padding:30px">No deals for ${icEsc_(icRangeLabel_())}with these filters.</div>`;
    else{
      html+=`<table class="daTable"><thead><tr><th>Sales</th><th>Role</th><th class="num">Target</th><th class="num">Credited sales</th><th>Achievement</th><th class="num daHide">Direct</th><th class="num daHide">In-direct</th><th class="num daHide">Private</th><th class="num">Commission</th></tr></thead><tbody>`;
      sales.forEach((p,i)=>{
        const ok=p.ach>=1;
        html+=`<tr class="icRow" data-open="${i}"><td><b>${icEsc_(p.name)}</b> <small class="daMuted">${p.deals.length} deal${p.deals.length===1?'':'s'}</small></td>
          <td>${icEsc_(p.role)}${p.roleSet?'':'<br><span class="icWarn">role not set</span>'}</td><td class="num">${icN_(p.target)}${p.tcFrom?'<br><small class="icTc" title="From the Target Center">🎯 Target Center</small>':''}</td><td class="num"><b>${icN_(p.credited)}</b></td>
          <td><div class="icAch"><div class="icBar"><i class="${ok?'ok':''}" style="width:${Math.min(100,p.ach*100)}%"></i></div><b>${icPct_(p.ach)}</b>${ok?' ✅':''}</div></td>
          <td class="num daHide">${icN_(p.by.Direct)}</td><td class="num daHide">${icN_(p.by['In-direct'])}</td><td class="num daHide">${icN_(p.by.Private)}</td><td class="num"><b>${icN_(p.comm)}</b></td></tr>`;
        if(IC_.open[p.name])p.deals.forEach(d=>{html+=`<tr class="icSub"><td colspan="2">${icEsc_(d.r.unitCode)} · ${icEsc_(d.r.clientName||'')}</td><td class="num daMuted">${icN_(d.r.amount)}</td><td class="num">${icN_(d.credit)}${d.share?' <small class="daMuted">(share)</small>':''}</td>
          <td><span class="icTag ${d.type==='Direct'?'dir':d.type==='Private'?'prv':''}">${d.type}</span> ${icPct_(d.rate,2)}</td><td colspan="3" class="daHide daMuted">${icEsc_(d.r.status||'')} · ${icEsc_(d.r.date||'')}</td><td class="num">${icN_(d.comm)}</td></tr>`;});
      });
      html+=`</tbody></table>`;
    }
    html+=`<div class="daNote">Deals counted by their <b>reservation date</b> inside the chosen dates; cancelled deals are left out; only deals whose <b>DP paid %</b> (Actual Paid ÷ Final Price) is in the chosen range count (default from 9%). Targets are monthly — for a longer range the target is multiplied by the number of months (${icMonths_()}). Credited sales = own deals in full + ${icPct_(IC_.setup.shareSplit,0)} of each share deal. The month's achievement (credited ÷ target) sets the rate for <b>all</b> that person's deals. Direct = Main Source “Direct”; Private = “Private” in the source; everything else In-direct. Click a row to see its deals. Roles and rates are in <b>Setup</b>.</div>`;
  }else{
    if(!others.length)html+=`<div class="daNote" style="text-align:center;padding:30px">No staff from other departments yet — add them in <b>Setup</b>.</div>`;
    else{
      html+=`<table class="daTable"><thead><tr><th>Name</th><th>Department</th><th>How paid</th><th>Based on</th><th class="num">Deals</th><th class="num">Sales value</th><th class="num">Commission</th></tr></thead><tbody>`;
      let dept='';
      others.forEach(p=>{
        if(p.dept!==dept){dept=p.dept;const t=others.filter(x=>x.dept===dept).reduce((a,x)=>a+x.comm,0);html+=`<tr class="icSub"><td colspan="6"><b>${icEsc_(dept)}</b></td><td class="num"><b>${icN_(t)}</b></td></tr>`;}
        const how=p.scheme==='pct'?icN_(p.value,3)+'% of sales':p.scheme==='perDeal'?icN_(p.value)+' EGP / contract':p.scheme==='perMillion'?icN_(p.value)+' EGP / 1M':'—';
        html+=`<tr><td><b>${icEsc_(p.name)}</b>${p.role?` <small class="daMuted">${icEsc_(p.role)}</small>`:''}</td><td>${icEsc_(p.dept)}</td><td>${how}</td><td>${p.scope==='team'?'His team’s deals':'All deals'}</td><td class="num">${p.n}</td><td class="num">${icN_(p.sales)}</td><td class="num"><b>${icN_(p.comm)}</b></td></tr>`;
      });
      html+=`</tbody></table><div class="daNote">No target for these departments. “His team’s deals” = deals where the person is the Sales Manager, Head of Sales or CCO.</div>`;
    }
  }
  body.innerHTML=html;
  body.querySelectorAll('[data-open]').forEach(tr=>tr.addEventListener('click',()=>{const p=sales[+tr.dataset.open];IC_.open[p.name]=!IC_.open[p.name];icRender_();}));
}
/* ---------- Setup ---------- */
function icSetup_(body){
  const S=IC_.draft||(IC_.draft=JSON.parse(JSON.stringify(IC_.setup)));
  const names=[...new Set(((typeof rawRows!=='undefined'&&rawRows)||[]).flatMap(r=>[r.salesName,r.sharedWith,r.salesManager,r.headOfSales,r.cco]).map(x=>String(x||'').trim()).filter(Boolean))].sort();
  const tierRows=(k)=>S[k].map((t,i)=>`<tr><td><input type="number" step="0.01" data-tier="${k}" data-i="${i}" data-j="0" value="${+(t[0]*100).toFixed(2)}"></td><td><input type="number" step="0.001" data-tier="${k}" data-i="${i}" data-j="1" value="${+(t[1]*100).toFixed(3)}"></td><td><button type="button" class="daBtn no" data-deltier="${k}" data-i="${i}">×</button></td></tr>`).join('');
  const deptOpts=v=>S.depts.map(d=>`<option${d===v?' selected':''}>${icEsc_(d)}</option>`).join('');
  const roleOpts=v=>`<option value="">—</option>`+S.roles.map(r=>`<option${r.role===v?' selected':''}>${icEsc_(r.role)}</option>`).join('');
  const schemeOpts=(v,dept)=>Object.entries(IC_SCHEMES_).filter(([k])=>dept==='Sales'?k==='tiers':k!=='tiers').map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('');
  body.innerHTML=`<div class="icSet">
    <div class="icGrid">
      <div class="icBox"><h4>Sales roles · monthly target (EGP)</h4><table class="daTable"><tbody>${S.roles.map((r,i)=>`<tr><td><input data-role="${i}" data-k="role" value="${icEsc_(r.role)}"></td><td><input type="number" data-role="${i}" data-k="target" value="${r.target}"></td><td><button type="button" class="daBtn no" data-delrole="${i}">×</button></td></tr>`).join('')}</tbody></table><button type="button" class="daBtn" data-addrole>+ Role</button></div>
      <div class="icBox"><h4>In-direct (brokers) · from achievement % → rate %</h4><table class="daTable"><tbody>${tierRows('indirect')}</tbody></table><button type="button" class="daBtn" data-addtier="indirect">+ Tier</button></div>
      <div class="icBox"><h4>Direct (company data) · from achievement % → rate %</h4><table class="daTable"><tbody>${tierRows('direct')}</tbody></table><button type="button" class="daBtn" data-addtier="direct">+ Tier</button></div>
      <div class="icBox"><h4>Other</h4><table class="daTable"><tbody>
        <tr><td>Private rate %</td><td><input type="number" step="0.01" data-top="privateRate" value="${+(S.privateRate*100).toFixed(2)}"></td></tr>
        <tr><td>Share: first sales gets %</td><td><input type="number" step="1" data-top="shareSplit" value="${+(S.shareSplit*100).toFixed(0)}"></td></tr>
        <tr><td>Default project</td><td><input data-top="project" value="${icEsc_(S.project)}" placeholder="empty = all projects"></td></tr></tbody></table></div>
    </div>
    <h4>Staff · every department (${S.staff.length})</h4>
    <datalist id="icNames">${names.map(n=>`<option value="${icEsc_(n)}">`).join('')}</datalist>
    <table class="daTable"><thead><tr><th>Name</th><th>Department</th><th>Role / title</th><th>How paid</th><th>Value</th><th>Based on</th><th>Active</th><th></th></tr></thead><tbody>
    ${S.staff.map((p,i)=>`<tr><td><input list="icNames" data-st="${i}" data-k="name" value="${icEsc_(p.name)}"></td><td><select data-st="${i}" data-k="dept">${deptOpts(p.dept)}</select></td>
      <td>${p.dept==='Sales'?`<select data-st="${i}" data-k="role">${roleOpts(p.role)}</select>`:`<input data-st="${i}" data-k="role" value="${icEsc_(p.role)}" placeholder="e.g. Contracts officer">`}</td>
      <td><select data-st="${i}" data-k="scheme">${schemeOpts(p.scheme,p.dept)}</select></td>
      <td>${p.dept==='Sales'?'<small class="daMuted">by target</small>':`<input type="number" step="any" data-st="${i}" data-k="value" value="${p.value}">`}</td>
      <td>${p.dept==='Sales'?'<small class="daMuted">own deals</small>':`<select data-st="${i}" data-k="scope"><option value="all"${p.scope!=='team'?' selected':''}>All deals</option><option value="team"${p.scope==='team'?' selected':''}>His team’s deals</option></select>`}</td>
      <td><input type="checkbox" data-st="${i}" data-k="active"${p.active!==false?' checked':''} style="width:auto"></td><td><button type="button" class="daBtn no" data-delst="${i}">×</button></td></tr>`).join('')}
    </tbody></table>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center"><button type="button" class="daBtn" data-addst>+ Person</button><button type="button" class="daBtn" data-adddept>+ Department</button><button type="button" class="daBtn" data-addsales>+ All sales from this month</button>
      <span style="flex:1"></span><span class="daMsg" data-msg></span><button type="button" class="daBtn ok" data-save>Save setup</button></div>
    <div class="daNote">Value: for “% of sales” write the % (e.g. 0.05); for “EGP per contract” the amount per contract (e.g. 250); for “EGP per 1M” the amount per million of contract value (e.g. 1000).</div></div>`;
  const upd=()=>{icSetup_(body);};
  body.querySelectorAll('[data-role]').forEach(i=>i.addEventListener('change',()=>{const r=S.roles[+i.dataset.role];r[i.dataset.k]=i.dataset.k==='target'?Number(i.value)||0:i.value;}));
  body.querySelectorAll('[data-tier]').forEach(i=>i.addEventListener('change',()=>{S[i.dataset.tier][+i.dataset.i][+i.dataset.j]=(Number(i.value)||0)/100;}));
  body.querySelectorAll('[data-top]').forEach(i=>i.addEventListener('change',()=>{const k=i.dataset.top;S[k]=k==='project'?i.value.trim():(Number(i.value)||0)/100;}));
  body.querySelectorAll('[data-st]').forEach(i=>i.addEventListener('change',()=>{const p=S.staff[+i.dataset.st],k=i.dataset.k;
    p[k]=k==='active'?i.checked:k==='value'?Number(i.value)||0:i.value;
    if(k==='dept'){p.scheme=p.dept==='Sales'?'tiers':(p.scheme==='tiers'?'perDeal':p.scheme);if(p.dept!=='Sales'&&S.roles.some(r=>r.role===p.role))p.role='';upd();}}));
  body.querySelectorAll('[data-delrole]').forEach(b=>b.addEventListener('click',()=>{S.roles.splice(+b.dataset.delrole,1);upd();}));
  body.querySelectorAll('[data-deltier]').forEach(b=>b.addEventListener('click',()=>{S[b.dataset.deltier].splice(+b.dataset.i,1);upd();}));
  body.querySelectorAll('[data-delst]').forEach(b=>b.addEventListener('click',()=>{S.staff.splice(+b.dataset.delst,1);upd();}));
  body.querySelector('[data-addrole]').addEventListener('click',()=>{S.roles.push({role:'',target:0});upd();});
  body.querySelectorAll('[data-addtier]').forEach(b=>b.addEventListener('click',()=>{const t=S[b.dataset.addtier],last=t[t.length-1]||[0,0];t.push([last[0]+0.25,last[1]]);upd();}));
  body.querySelector('[data-adddept]').addEventListener('click',()=>{const n=String(prompt('New department name:')||'').trim();if(!n)return;if(!S.depts.includes(n)){const o=S.depts.indexOf('Other');o>=0?S.depts.splice(o,0,n):S.depts.push(n);}upd();});
  body.querySelector('[data-addst]').addEventListener('click',()=>{S.staff.push({name:'',dept:'Customer Service / Contracts',role:'',scheme:'perDeal',value:0,scope:'all',active:true});upd();});
  body.querySelector('[data-addsales]').addEventListener('click',()=>{const have=new Set(S.staff.map(p=>icNorm_(p.name)));
    icSales_().forEach(p=>{if(!have.has(icNorm_(p.name)))S.staff.push({name:p.name,dept:'Sales',role:'Senior',scheme:'tiers',value:0,scope:'all',active:true});});upd();});
  body.querySelector('[data-save]').addEventListener('click',e=>{
    const m=body.querySelector('[data-msg]');if(IC_.busy)return;IC_.busy=true;e.target.disabled=true;m.className='daMsg';m.textContent='Saving…';
    google.script.run.withSuccessHandler(s=>{IC_.busy=false;IC_.setup=s;IC_.draft=null;icRender_();const mm=document.querySelector('#ic [data-msg]');if(mm){mm.textContent='Saved ✓';}})
      .withFailureHandler(err=>{IC_.busy=false;e.target.disabled=false;m.className='daMsg err';m.textContent=err&&err.message||String(err);})
      .saveCommSetup(AUTH_TOKEN,S);
  });
}
function icExcel_(){
  if(!IC_.setup||typeof edenXlsxDownload_!=='function')return;
  const label=icRangeLabel_()+((IC_.sel&&IC_.sel.project||[]).length?' · '+IC_.sel.project.join(', '):'')+(IC_.dpMin!=null||IC_.dpMax!=null?' · DP paid '+(IC_.dpMin??0)+'%'+(IC_.dpMax!=null?'–'+IC_.dpMax+'%':'+'):'');
  if(IC_.tab==='others'){
    const o=icOthers_();
    edenXlsxDownload_('EDEN internal commissions (other departments) '+IC_.from+' to '+IC_.to,{title:'Internal commissions — other departments · '+label,sheetName:'Other departments',
      headers:['Name','Department','Role','How paid','Value','Based on','Deals','Sales value','Commission'],
      rows:o.map(p=>[p.name,p.dept,p.role,IC_SCHEMES_[p.scheme]||p.scheme,Number(p.value)||0,p.scope==='team'?'His team':'All deals',p.n,Math.round(p.sales),Math.round(p.comm)])});
    return;
  }
  const s=icSales_(),rows=[];
  s.forEach(p=>p.deals.forEach(d=>rows.push([p.name,p.role,p.target,icPct_(p.ach),d.r.unitCode,d.r.clientName||'',d.r.date||'',d.r.amount,d.share?'Share':'Solo',d.credit,d.type,icPct_(d.rate,2),Math.round(d.comm*100)/100])));
  edenXlsxDownload_('EDEN internal commissions (sales) '+IC_.from+' to '+IC_.to,{title:'Internal commissions — sales team · '+label,sheetName:'Sales team',
    kpis:s.map(p=>[p.name+' ('+icPct_(p.ach)+')',icN_(p.comm)]),
    headers:['Sales','Role','Target','Achievement','Unit','Client','Reservation date','Contract value','Solo / Share','Credited','Type','Rate','Commission'],rows});
}
function icEgv_(){
  const egv=typeof isEgyptViewer_==='function'&&isEgyptViewer_();
  document.documentElement.classList.toggle('edenEgv',egv);
  if(egv){
    if(typeof currentView!=='undefined'&&currentView==='commissions'&&typeof setView==='function')setView('dashboard');
    document.querySelectorAll('input[name="commission"]:checked').forEach(b=>b.checked=false);
    icClose_();
  }
}
(function(){
  // client card: no commission lookups for Egypt Viewer
  if(typeof c360CommLoad_==='function'&&!c360CommLoad_.__egv){const o=c360CommLoad_;c360CommLoad_=function(){if(typeof isEgyptViewer_==='function'&&isEgyptViewer_())return;return o.apply(this,arguments);};c360CommLoad_.__egv=true;}
})();
(function(){const go=()=>{icMount_();icEgv_();setInterval(()=>{icMount_();icEgv_();},2000);};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();})();
</script>
