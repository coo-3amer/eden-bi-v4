function groupRows(key){
  const base=statusScopeRows();
  if(key==='salesName'){
    const credits=salesCreditRows_(base);
    const g=by(credits,'salesName');
    return Object.keys(g).map(k=>{
      const a=g[k];
      return {
        name:k,
        deals:a.reduce((n,r)=>n+Number(r.dealCredit??1),0),
        valueEGP:sum(a.filter(r=>projectCurrency_(r)==='EGP'),'amount'),
        valueUSD:sum(a.filter(r=>projectCurrency_(r)==='USD'),'amount'),
        meters:sum(a,'area'),
        units:a.reduce((n,r)=>n+Number(r.dealCredit??1),0),
        uniqueClients:new Set(a.map(r=>r.clientName)).size,
        salesCount:1,
        projectsCount:new Set(a.map(r=>r.project)).size,
        branchesCount:new Set(a.map(r=>r.branch)).size
      };
    }).sort((a,b)=>b.valueEGP-a.valueEGP||b.valueUSD-a.valueUSD||b.deals-a.deals);
  }
  const g=by(base,key);
  return Object.keys(g).map(k=>{
    const a=g[k];
    return {
      name:k,deals:a.length,
      valueEGP:sum(a.filter(r=>projectCurrency_(r)==='EGP'),'amount'),
      valueUSD:sum(a.filter(r=>projectCurrency_(r)==='USD'),'amount'),
      meters:sum(a,'area'),
      units:a.filter(r=>r.unitCode).length,
      uniqueClients:new Set(a.map(r=>r.clientName)).size,
      salesCount:new Set(a.map(r=>r.salesName)).size,
      projectsCount:new Set(a.map(r=>r.project)).size,
      branchesCount:new Set(a.map(r=>r.branch)).size
    };
  }).sort((a,b)=>b.deals-a.deals);
}
function normalizeClientName(s){return String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآا]/g,'ا').replace(/[ى]/g,'ي').replace(/[ة]/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\s+/g,' ').trim()}
function clientKeyOf(r){return r.clientKey || normalizeClientName(r.clientName)}
function uniq(arr){return [...new Set(arr.filter(Boolean))]}
function tierByDeals(n){if(n>=4)return 'VIP'; if(n===3)return 'Gold'; if(n===2)return 'Silver'; return 'First Time'}
function getClientAnalysis(){
  const rows=statusScopeRows().filter(r=>clientKeyOf(r));
  const byClient={};
  rows.forEach(r=>{const k=clientKeyOf(r);(byClient[k]=byClient[k]||[]).push(r)});
  const same=[];
  const multi=[];
  Object.keys(byClient).forEach(k=>{
    const all=byClient[k];
    const display=all.find(r=>r.clientName)?.clientName || k;
    const projectGroups=by(all,'project');
    Object.keys(projectGroups).forEach(project=>{
      const a=projectGroups[project];
      if(a.length>1){
        same.push(clientSummaryRow('Same Project Repeated', display, a, [project]));
      }
    });
    const projects=uniq(all.map(r=>r.project));
    if(projects.length>1){
      multi.push(clientSummaryRow('Multi Project Client', display, all, projects));
    }
  });
  const repeatedKeys=new Set([...same,...multi].map(r=>normalizeClientName(r.clientName)));
  return {same:same.sort((a,b)=>b.deals-a.deals), multi:multi.sort((a,b)=>b.deals-a.deals), uniqueRepeatedClients:repeatedKeys.size};
}
function clientSummaryRow(type,clientName,rows,projects){
  const cleanRows=rows.slice().sort((a,b)=>String(a.yearMonth||'').localeCompare(String(b.yearMonth||'')));
  return {
    analysisType:type,
    clientName,
    projects:projects.join(' | '),
    deals:rows.length,
    units:rows.filter(r=>r.unitCode).length,
    customerValue:tierByDeals(rows.length),
    customerJourney:cleanRows.map(r=>r.project).filter(Boolean).join(' ➜ '),
    valueEGP:sum(rows.filter(r=>projectCurrency_(r)==='EGP'),'amount'),
    valueUSD:sum(rows.filter(r=>projectCurrency_(r)==='USD'),'amount'),
    sales:uniq(rows.map(r=>r.salesName)).join(' | '),
    branches:uniq(rows.map(r=>r.branch)).join(' | '),
    statuses:uniq(rows.map(r=>r.status)).join(' | '),
    unitCodes:uniq(rows.map(r=>r.unitCode)).join(' | ')
  }
}

function newClientIdentity_(r){
  let name=String(r.clientName||'').trim();

  // Remove project / unit suffixes appended to the client name, such as:
  // "Mohamed Ahmed Mohamed Omar - CCG-A-105"
  // "Client Name - K-F18-174"
  // "Client Name - EW -F1-B3/4"
  const suffixIndex=name.search(/\s*-\s*(?=[A-Z0-9][A-Z0-9\s\/-]*\d)/i);
  if(suffixIndex>0){
    name=name.slice(0,suffixIndex).trim();
  }

  return normalizeClientName(name);
}

function newClientStatus_(r){
  return String(r.status||'').trim().toLowerCase();
}

function newClientAdditional_(r){
  return String(r.additionalStatus||'').trim().toLowerCase();
}

function newClientIsRenovation_(r){
  const renovation=String(r.renovationStatus||'').trim().toLowerCase();
  const additional=newClientAdditional_(r);

  return (
    (renovation==='renovation') ||
    (additional==='renovation')
  );
}

function newClientIsShifted_(r){
  return newClientAdditional_(r).includes('shifted');
}

function newClientDateInfo_(r){
  const yearFromRow=parseInt(String(r.year||'').replace(/\D/g,''),10);
  const monthFromRow=parseInt(String(r.month||'').replace(/\D/g,''),10);
  const dayFromRow=parseInt(String(r.day||'').replace(/\D/g,''),10);

  if(yearFromRow>=1900){
    const month=monthFromRow>=1&&monthFromRow<=12?monthFromRow:1;
    const day=dayFromRow>=1&&dayFromRow<=31?dayFromRow:1;
    return {
      year:yearFromRow,
      month:month,
      day:day,
      sortKey:yearFromRow*10000+month*100+day
    };
  }

  const raw=String(r.date||'').trim();
  if(raw){
    const parsed=new Date(raw);
    if(!isNaN(parsed.getTime())){
      return {
        year:parsed.getFullYear(),
        month:parsed.getMonth()+1,
        day:parsed.getDate(),
        sortKey:parsed.getFullYear()*10000+(parsed.getMonth()+1)*100+parsed.getDate()
      };
    }

    const yearMatch=raw.match(/(19|20)\d{2}/);
    if(yearMatch){
      const year=Number(yearMatch[0]);
      return {year:year,month:1,day:1,sortKey:year*10000+101};
    }
  }

  return {year:'Unknown',month:0,day:0,sortKey:99999999};
}

function getNewClientsByYear(){
  const visibleRows=statusScopeRows();
  const visibleClients=new Map();

  // Same visible population used by Total Unique Clients.
  visibleRows.forEach(r=>{
    const key=newClientIdentity_(r);
    if(!key)return;

    const current=visibleClients.get(key);
    const info=newClientDateInfo_(r);

    if(!current||info.sortKey<current.info.sortKey){
      visibleClients.set(key,{row:r,info:info});
    }
  });

  const grouped={};

  visibleClients.forEach((visible,key)=>{
    const history=rawRows.filter(r=>newClientIdentity_(r)===key);

    const cleanHistory=(history.length?history:[visible.row]).filter(
      r=>!newClientIsRenovation_(r)
    );

    const nonCancel=cleanHistory.filter(
      r=>newClientStatus_(r)!=='cancel'
    );

    // Only cancelled rows means no valid acquisition yet.
    if(!nonCancel.length)return;

    const hasShifted=cleanHistory.some(newClientIsShifted_);

    // Normal case: first non-cancel deal/reservation.
    // Shifted case: earliest historical row, because the client existed before transfer.
    const sourceRows=hasShifted?cleanHistory:nonCancel;

    const firstRow=[...sourceRows].sort(
      (a,b)=>newClientDateInfo_(a).sortKey-newClientDateInfo_(b).sortKey
    )[0];

    let firstInfo=newClientDateInfo_(firstRow);

    // Fallback prevents the client disappearing when an old row has no readable date.
    if(firstInfo.year==='Unknown'){
      firstInfo=visible.info;
    }

    const selectedYears=getMulti('year').map(v=>String(v));
    if(selectedYears.length&&!selectedYears.includes(String(firstInfo.year)))return;

    const year=String(firstInfo.year);
    const display=visible.row;

    const client={
      key:key,
      year:year,
      clientName:String(display.clientName||firstRow.clientName||key).trim(),
      project:String(display.project||'').trim(),
      unitCode:String(display.unitCode||'').trim(),
      salesName:String(display.salesName||'').trim(),
      branch:String(display.branch||'').trim(),
      date:firstRow.date||display.date||'',
      shifted:hasShifted
    };

    if(!grouped[year])grouped[year]=[];
    grouped[year].push(client);
  });

  return Object.keys(grouped).map(year=>{
    const clients=grouped[year].sort((a,b)=>
      a.clientName.localeCompare(b.clientName,undefined,{sensitivity:'base'})
    );

    return {
      year:year,
      count:clients.length,
      clients:clients
    };
  }).sort((a,b)=>{
    if(a.year==='Unknown')return 1;
    if(b.year==='Unknown')return -1;
    return Number(a.year)-Number(b.year);
  });
}

// One cell can hold several phone numbers ("0100… - 0111…"): show each on its own line.
function splitPhoneNumbers_(v){
  const raw=String(v??'').trim();
  if(!raw)return [];
  const parts=raw.split(/\s*(?:\s-\s|[\/,;|\n]|\s+و\s+|\s{2,})\s*/).map(x=>x.trim()).filter(Boolean);
  const digits=x=>x.replace(/\D/g,'').length;
  return parts.length>1&&parts.every(x=>digits(x)>=7)?parts:[raw];
}
function mobileCellHtml_(v){
  const nums=splitPhoneNumbers_(v);
  if(!nums.length)return '';
  const more=nums.length>1?`<span class="mobileMore" title="${escapeAttr(nums.slice(1).join(' • '))}">+${nums.length-1}</span>`:'';

ate))warning.push('Delivered Without Company Sign');const c=[...new Set(critical)],w=[...new Set(warning)],severity=c.length?'Critical':(w.length?'Needs Review':'Healthy'),all=[...c,...w];return {...row,healthStatus:severity,severity,issues:all.join(' | '),issueList:all,criticalCount:c.length,warningCount:w.length};});}

function brokerCompanyKey_(value){
  return String(value||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/&/g,' and ')
    .replace(/[^a-z0-9\u0600-\u06ff]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}


function brokerCompanyDealRows_(company){
  const key=brokerCompanyKey_(company);
  if(!key)return [];

  const rows=(rawRows||[]).filter(r=>String(r.brokerageCompany||'').trim());

  let matched=rows.filter(r=>brokerCompanyKey_(r.brokerageCompany)===key);
  if(matched.length){
    return matched.sort((a,b)=>brokerDateValue_(b)-brokerDateValue_(a));
  }

  const candidates=[...new Set(rows.map(r=>String(r.brokerageCompany||'').trim()).filter(Boolean))];
  const strong=candidates.filter(name=>{
    const k=brokerCompanyKey_(name);
    return k && (k.includes(key)||key.includes(k)) && Math.min(k.length,key.length)>=4;
  });

  if(strong.length===1){
    const resolved=brokerCompanyKey_(strong[0]);
    matched=rows.filter(r=>brokerCompanyKey_(r.brokerageCompany)===resolved);
  }

  return matched.sort((a,b)=>brokerDateValue_(b)-brokerDateValue_(a));
}


function brokerCompanySourceRow_(company){
  const key=brokerCompanyKey_(company);
  return (brokerRows||[]).find(r=>brokerCompanyKey_(r.company)===key)||null;
}

function brokerOverviewBar_(canvasId,data,label,{horizontal=true,moneyCurrency='',onClickName=null}={}){

  const theme=brokerOverviewTheme_();

  }

    type:'bar',
    data:{
      labels:data.map(x=>x.name),
      datasets:[{label,data:data.map(x=>x.value),borderWidth:1,borderRadius:7}]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      indexAxis:horizontal?'y':'x',

        const target=evt?.native?.target;

      onClick:(evt,elements)=>{
        if(elements?.length&&typeof onClickName==='function'){
          onClickName(data[elements[0].index]?.name||'');

      },
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          label:ctx=>moneyCurrency
            ?`${moneyCurrency} ${money(ctx.raw)}`

        }}
      },
      scales:{
        x:{beginAtZero:true,grid:{color:theme.line},ticks:{color:theme.text,callback:v=>moneyCurrency?money(v):v}},
        y:{beginAtZero:true,grid:{color:theme.line},ticks:{color:theme.text}}

    }
  });

function brokerOverviewCountRank_(rows,key,limit=10){
  const map={};
  (rows||[]).forEach(r=>{
    const name=String(r?.[key]||'').trim();
    if(name)map[name]=(map[name]||0)+1;
  });
  return Object.entries(map)
    .map(([name,value])=>({name,value}))
    .sort((a,b)=>b.value-a.value||a.name.localeCompare(b.name))
    .slice(0,limit);
}

function brokerOverviewValueRank_(rows,key,currency,limit=10){
  const map={};
  (rows||[]).filter(r=>projectCurrency_(r)===currency).forEach(r=>{
    const name=String(r?.[key]||'').trim();
    if(name)map[name]=(map[name]||0)+Number(r.amount||0);
  });
  return Object.entries(map)
    .map(([name,value])=>({name,value}))
    .sort((a,b)=>b.value-a.value||a.name.localeCompare(b.name))
    .slice(0,limit);
}

function brokerOverviewBar_(canvasId,data,label,{horizontal=true,moneyCurrency='',onClickName=null}={}){
  const canvas=document.getElementById(canvasId);
  if(!canvas||!window.Chart)return;
  const theme=brokerOverviewTheme_();

  if(!data?.length){
    const ctx=canvas.getContext('2d');
    if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }

  const chart=new Chart(canvas,{
    type:'bar',
    data:{
      labels:data.map(x=>x.name),
      datasets:[{label,data:data.map(x=>x.value),borderWidth:1,borderRadius:7}]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      indexAxis:horizontal?'y':'x',
      onHover:(evt,elements)=>{
        const target=evt?.native?.target;
        if(target)target.style.cursor=(elements?.length&&typeof onClickName==='function')?'pointer':'default';
      },
      onClick:(evt,elements)=>{
        if(elements?.length&&typeof onClickName==='function'){
          onClickName(data[elements[0].index]?.name||'');
        }
      },
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          label:ctx=>moneyCurrency
            ?`${moneyCurrency} ${money(ctx.raw)}`
            :`${Number(ctx.raw||0).toLocaleString('en-US')} deals`
        }}
      },
      scales:{
        x:{
          beginAtZero:true,
          grid:{color:theme.line},
          ticks:{color:theme.text,callback:v=>moneyCurrency?money(v):v}
        },
        y:{
          beginAtZero:true,
          grid:{color:theme.line},
          ticks:{color:theme.text}
        }
      }
    }
  });

  BROKER_OVERVIEW_CHARTS.push(chart);
}

function brokerOverviewDoughnut_(canvasId,data,label){
  const canvas=document.getElementById(canvasId);
  if(!canvas||!window.Chart||!data?.length)return;

  const chart=new Chart(canvas,{
    type:'doughnut',
    data:{
      labels:data.map(x=>x.name),
      datasets:[{label,data:data.map(x=>x.value),borderWidth:1}]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          position:'bottom',
          labels:{color:brokerOverviewTheme_().text,usePointStyle:true,boxWidth:8}
        },
        tooltip:{
          callbacks:{
            label:ctx=>`${ctx.label}: ${Number(ctx.raw||0).toLocaleString('en-US')} deals`
          }
        }
      }
    }
  });

  BROKER_OVERVIEW_CHARTS.push(chart);
}

function brokerOverviewTrend_(rows){
  const canvas=document.getElementById('brokerOverviewTrendChart');
  if(!canvas||!window.Chart)return;

  const map={};
  rows.forEach(r=>{
    const y=Number(r.year)||0;
    const mo=Number(r.month)||0;
    if(!y||!mo)return;
    const key=`${y}-${String(mo).padStart(2,'0')}`;
    if(!map[key]){
      map[key]={
        name:new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'}),
        sort:y*100+mo,
        value:0
      };
    }
    map[key].value++;
  });

  const data=Object.values(map).sort((a,b)=>a.sort-b.sort);
  if(!data.length)return;

  const theme=brokerOverviewTheme_();
  const chart=new Chart(canvas,{
    type:'line',
    data:{
      labels:data.map(x=>x.name),
      datasets:[{
        label:'Broker Deals',
        data:data.map(x=>x.value),
        borderWidth:3,
        pointRadius:4,
        tension:.34,
        fill:false
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:theme.line},ticks:{color:theme.text,maxRotation:0,autoSkip:true}},
        y:{beginAtZero:true,grid:{color:theme.line},ticks:{color:theme.text,precision:0}}
      }
    }
  });

  BROKER_OVERVIEW_CHARTS.push(chart);
}

function creationPeriodText(){
  const days=getMulti('brokerDay').join(' + ');
  const months=getMulti('brokerMonth').map(m=>monthName(Number(m))).join(' + ');
  const years=getMulti('brokerYear').join(' + ');
  if(days && months && years) return `Created on day ${days} / ${months} / ${years}`;
  if(days && months) return `Created on day ${days} / ${months}`;

function rankHealth(arr){
  const groups={Healthy:0,'No Group Link':0,'Missing Mobile':0,'Missing Assignment':0};
  arr.forEach(r=>{
    const issues=healthIssues(r);
    if(!issues.length) groups.Healthy++;
    else if(issues.includes('No WhatsApp Group')) groups['No Group Link']++;
    else if(issues.includes('Missing Mobile')) groups['Missing Mobile']++;

  });
  return Object.keys(groups).map(name=>({name,value:groups[name]})).filter(x=>x.value>0);
}

function healthIssues(r){
  const issues=[];

  // Validate a field only when its header exists in the broker source sheet.
  if(
    brokerAvailableFields.creationDate!==false &&
    !String(r.creationDate||r.createdDate||'').trim()
  ) issues.push('Missing Creation Date');

  if(
    brokerAvailableFields.groupLink!==false &&
    !String(r.groupLink||'').trim()
  ) issues.push('No WhatsApp Group');

  if(
    brokerAvailableFields.mobile!==false &&
    !String(r.mobile||'').trim()
  ) issues.push('Missing Mobile');

  if(
    brokerAvailableFields.edenSales!==false &&
    (!String(r.edenSales||'').trim() || r.edenSales==='Not Assigned')
  ) issues.push('Missing Eden Sales');

  if(
    brokerAvailableFields.admin!==false &&
    (!String(r.admin||'').trim() || r.admin==='Not Assigned')
  ) issues.push('Missing Admin');

  if(
    brokerAvailableFields.brokerSales!==false &&
    !Number(r.brokerSales||0)
  ) issues.push('No Sales Count');

  return issues;
}

function getOrientationRows(rows){

      if(!date) continue;
      output.push({
        company:r.company,
        companyKey:r.companyKey,
        orientationNo:'Orientation '+i,
        orientationDate:date,
        sales:r.edenSales || 'Not Assigned',
        edenSales:r.edenSales || 'Not Assigned',
        sharedWith:r.sharedWith || '',
        createdBy:r.createdBy || 'Not Assigned',
        creationDate:r.creationDate || '',
        status:r.status || '',
        mobile:r.mobile || '',
        groupLink:r.groupLink || ''
      });
    }
  });
  return output.sort((a,b)=>String(b.orientationDate).localeCompare(String(a.orientationDate)) || String(a.company).localeCompare(String(b.company)));

function inventoryTextKey(value){
  return String(value||'').trim().toLowerCase();
}

function inventoryFloorRank(value){
  const text=inventoryTextKey(value);
  if(!text)return [99,999,''];

  const normalized=text
    .replace(/[_\-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();

  const wordNumbers={
    'ground':0,
    'first':1,
    'second':2,
    'third':3,
    'fourth':4,
    'fifth':5,
    'sixth':6,
    'seventh':7,
    'eighth':8,
    'ninth':9,
    'tenth':10,
    'eleventh':11,
    'twelfth':12,
    'thirteenth':13,
    'fourteenth':14,
    'fifteenth':15,
    'sixteenth':16,
    'seventeenth':17,
    'eighteenth':18,
    'nineteenth':19,
    'twentieth':20,
    'twenty first':21,
    'twenty second':22,
    'twenty third':23,
    'twenty fourth':24,
    'twenty fifth':25,
    'twenty sixth':26,
    'twenty seventh':27,
    'twenty eighth':28,
    'twenty ninth':29,
    'thirtieth':30
  };

  if(normalized.includes('basement')){
    const n=normalized.match(/\d+/);
    return [0,n?-Number(n[0]):-1,normalized];
  }

  if(
    normalized==='ground' ||
    normalized==='ground floor' ||
    normalized==='gf' ||
    normalized==='g floor'
  ){
    return [0,0,normalized];
  }

  if(normalized.includes('lower ground'))return [0,-0.5,normalized];
  if(normalized.includes('mezzanine')||normalized==='mezz')return [0,0.5,normalized];

  for(const [word,rank] of Object.entries(wordNumbers)){
    if(normalized===word || normalized===`${word} floor` || normalized===`floor ${word}`){
      return [0,rank,normalized];
    }
  }

  const ordinalMatch=normalized.match(/(\d+)(st|nd|rd|th)?/);
  if(ordinalMatch)return [0,Number(ordinalMatch[1]),normalized];

  if(normalized.includes('roof'))return [0,999,normalized];
  if(normalized.includes('penthouse'))return [0,1000,normalized];

  return [1,500,normalized];
}

function sortInventoryFloors(items){
  return [...items].sort((a,b)=>{
    const x=inventoryFloorRank(a),y=inventoryFloorRank(b);
    return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2],undefined,{numeric:true});
  });
}

function sortInventoryStatuses(items){
  const order=['available','reservation','reserved','part of dp','total dp','client signed','client sigend','company signed','closed','sold','delivered','cancel','not available','not specified'];
  return [...items].sort((a,b)=>{
    const ak=inventoryTextKey(a),bk=inventoryTextKey(b);
    const ai=order.findIndex(x=>ak.includes(x));
    const bi=order.findIndex(x=>bk.includes(x));
    return (ai<0?999:ai)-(bi<0?999:bi)||ak.localeCompare(bk,undefined,{numeric:true});
  });
}

function sortInventoryTypes(items){
  const order=['commercial','admin','medical','residential','hotel apartment','studio','one bedroom','1 bedroom','2 bedroom','3 bedroom','ground villa','villa','roof villa','sky villa','sky roof villa'];
  return [...items].sort((a,b)=>{
    const ak=inventoryTextKey(a),bk=inventoryTextKey(b);
    const ai=order.indexOf(ak),bi=order.indexOf(bk);
    return (ai<0?999:ai)-(bi<0?999:bi)||ak.localeCompare(bk,undefined,{numeric:true});
  });
}

function inventoryOptionCounts(field){

function normalizeInventoryDiscount_(value) {
  const discount = parseFloat(value);

  if (isNaN(discount)) return 0;

  return Math.max(0, Math.min(100, discount));
}

function applyInventoryDiscount() {
  const input = document.getElementById('inventoryDiscountPercent');

  let discount = parseFloat(input?.value);

  if (isNaN(discount)) discount = 0;

  discount = Math.max(0, Math.min(100, discount));

  inventoryDiscountPercent = discount;

  renderInventoryCards();
  renderInventoryTable();
}

function inventoryNumber_(value){
  const normalized=String(value??'').replace(/,/g,'').replace(/[^0-9.-]/g,'');
  const number=parseFloat(normalized);
  return Number.isFinite(number)?number:0;
}

function applyInventoryFilters(){
  const q=String(document.getElementById('inventorySearch')?.value||'').trim().toLowerCase();
  const categories=getMulti('inventoryCategory');
  const floors=getMulti('inventoryFloor');
  const unitTypes=getMulti('inventoryUnitType');
  const types=getMulti('inventoryType');
  const statuses=getMulti('inventoryStatus');
  const companies=getMulti('inventoryCompany');

  inventoryFiltered=inventoryRows.filter(r=>
    (!categories.length||categories.includes(String(r.inventoryCategory))) &&
    (!floors.length||floors.includes(String(r.floor))) &&
    (!unitTypes.length||unitTypes.includes(String(r.unitType))) &&
    (!types.length||types.includes(String(r.type))) &&
    (!statuses.length||statuses.includes(String(r.status))) &&
    (!companies.length||companies.includes(String(r.company))) &&
    (!q||Object.values(r).join(' ').toLowerCase().includes(q))
  );

  inventoryDiscountPercent=normalizeInventoryDiscount_(
    document.getElementById('inventoryDiscountPercent')?.value
  );

  const sortBy=String(document.getElementById('inventorySortBy')?.value||'');
  if(sortBy){
    inventoryFiltered=[...inventoryFiltered].sort((a,b)=>{
      const areaA=inventoryNumber_(a.totalGross||a.area);
      const areaB=inventoryNumber_(b.totalGross||b.area);

      const totalA=inventoryNumber_(a.totalPrice)*(1-inventoryDiscountPercent/100);
      const totalB=inventoryNumber_(b.totalPrice)*(1-inventoryDiscountPercent/100);

      const meterA=areaA?totalA/areaA:0;
      const meterB=areaB?totalB/areaB:0;

      if(sortBy==='areaDesc')return areaB-areaA;
      if(sortBy==='areaAsc')return areaA-areaB;
      if(sortBy==='meterPriceAsc')return meterA-meterB;
      if(sortBy==='meterPriceDesc')return meterB-meterA;
      if(sortBy==='totalAsc')return totalA-totalB;
      if(sortBy==='totalDesc')return totalB-totalA;
      return 0;
    });
  }

  updateInventoryMultiLabels();
  renderInventoryCards();
  renderInventoryTable();
}

function renderInventoryCards(){
  const rows=inventoryFiltered;
  const available=rows.filter(r=>String(r.status).toLowerCase()==='available').length;
  const reservation=rows.filter(r=>String(r.status).toLowerCase().includes('reservation')).length;
  const closed=rows.filter(r=>['closed','sold'].includes(String(r.status).toLowerCase())).length;
  const originalValue=rows.reduce((a,r)=>a+(Number(r.totalPrice)||0),0);
  const discountValue=originalValue*(inventoryDiscountPercent/100);
  const finalValue=originalValue-discountValue;
  const currency=(inventoryMeta&&inventoryMeta.currency)||rows.find(r=>r.currency)?.currency||'';

  document.getElementById('inventoryCards').innerHTML=`
    ${inventoryCard('Total Units',rows.length,'Current filters')}
    ${inventoryCard('Available',available,'Can be used for a new deal','available')}
    ${inventoryCard('Reservation',reservation,'Requires review','reservation')}
    ${inventoryCard('Closed / Sold',closed,'Blocked from new deals','closed')}
    ${inventoryCard('Original Inventory Value',formatInventoryMoney(originalValue,currency),currency+' before discount','value')}
    ${inventoryCard('Discount Value',formatInventoryMoney(discountValue,currency),inventoryDiscountPercent.toFixed(1)+'% on current selection','discount')}
    ${inventoryCard('Value After Discount',formatInventoryMoney(finalValue,currency),currency+' after discount','netValue')}`;
}


function formatInventoryMoney(value,currency){
  const amount=money(Number(value)||0);
  if(currency==='USD')return '$ '+amount;
  if(currency==='EGP')return amount+' EGP';
  return currency?amount+' '+currency:amount;
}

}

function renderInventoryTable(){

  table.innerHTML=`<thead><tr><th>Unit Category</th><th>Floor</th><th>Unit Type</th><th>Unit Code</th><th>Type</th><th>Area</th><th>View</th><th>Price / M²</th><th>Original Price</th><th>Discount %</th><th>Discount Value</th><th>Price After Discount</th><th>Price/M² After Discount</th><th>Status</th><th>Company</th><th>Deal Check</th></tr></thead><tbody>`+
  inventoryFiltered.map(r=>{
    const originalPrice=inventoryNumber_(r.totalPrice);

const DEAL_PROJECTS_=['EDEN WALK','CCG'];
let DEAL_UNITS_REQ_=0, DEAL_CHECK_REQ_=0;
/* Units per project are kept in the page, prefetched in the background, and
   shown at once; a fresh list replaces them quietly when it arrives. */
const DEAL_UNITS_CACHE_={};
function dealFetchUnits_(project,cb,fail){
  google.script.run.withSuccessHandler(rows=>{DEAL_UNITS_CACHE_[project]={rows:rows||[],at:Date.now()};cb&&cb(rows||[]);})
    .withFailureHandler(e=>fail&&fail(e)).getDealInventoryUnits(AUTH_TOKEN,project);
}
let DEAL_UNITS_ALL_=[];
function dealRenderUnits_(rows){
  // Every unit except the sold ones (Closed / Done). Units that already have an
  // active deal in the Deals sheet are listed but cannot be picked.
  const closed=s=>['closed','done','sold','delivered'].includes(String(s||'').trim().toLowerCase());
  DEAL_UNITS_ALL_=(rows||[]).filter(r=>!closed(r.status));
  dealUnits=DEAL_UNITS_ALL_.filter(r=>!r.dealStatus);
  const floors=[...new Set(DEAL_UNITS_ALL_.map(r=>String(r.floor||'').trim()).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const fl=dealEl('dealUnitFloor');
  if(fl){const cur=fl.value;fl.innerHTML='<option value="">All floors</option>'+floors.map(f=>`<option value="${escapeAttr(f)}">${escapeHtml(f)}</option>`).join('');if(floors.includes(cur))fl.value=cur;}
  dealFilterUnits_();
}
function dealFilterUnits_(){
  const sel=dealEl('dealUnitCode');if(!sel)return;
  const q=String(dealEl('dealUnitSearch')?.value||'').trim().toLowerCase();
  const floor=dealValue('dealUnitFloor');
  const key=r=>`${r.unitCode}||${r.inventoryCategory||''}`;
  const keep=dealSelectedUnit?key(dealSelectedUnit):sel.value;
  const label=r=>[r.unitCode,r.type||r.unitType,r.floor,r.area?`${r.area} m²`:'',r.status&&String(r.status).toLowerCase()!=='available'?`[${r.status}]`:'',r.dealStatus?`has a deal (${r.dealStatus})`:''].filter(Boolean).map(escapeHtml).join(' — ');
  const list=DEAL_UNITS_ALL_.filter(r=>(!floor||String(r.floor||'').trim()===floor)&&
    (!q||[r.unitCode,r.type,r.unitType,r.floor,r.area,r.status,r.view,r.inventoryCategory].join(' ').toLowerCase().includes(q)));
  const groups={};list.forEach(r=>{(groups[r.inventoryCategory||'Units']=groups[r.inventoryCategory||'Units']||[]).push(r);});
  const names=Object.keys(groups);
  const opts=names.map(g=>{
    const items=groups[g].sort((a,b)=>String(a.unitCode).localeCompare(String(b.unitCode),undefined,{numeric:true}))
      .map(r=>`<option value="${escapeAttr(key(r))}"${r.dealStatus?' disabled':''}>${label(r)}</option>`).join('');
    return names.length>1?`<optgroup label="${escapeAttr(g)} (${groups[g].length})">${items}</optgroup>`:items;
  }).join('');
  const free=list.filter(r=>!r.dealStatus).length;
  sel.innerHTML=list.length
    ?`<option value="">Select Unit — ${free} of ${list.length} shown${q||floor?' (filtered)':''}</option>`+opts
    :`<option value="">${DEAL_UNITS_ALL_.length?'No unit matches the search':'No units in the inventory'}</option>`;
  if(keep&&list.some(r=>key(r)===keep&&!r.dealStatus))sel.value=keep;
}
function loadDealUnits(){
  const project=dealValue('dealProject')||'EDEN WALK';
  const req=++DEAL_UNITS_REQ_;
  dealUnits=[];dealSelectedUnit=null;dealUnitValidated=false;DEAL_CHECK_REQ_++;
  dealEl('dealUnitCard').classList.add('hidden');
  ['dealResCurrency','dealDPCurrency'].forEach(id=>{const el=dealEl(id);if(el)el.value='';});
  hideDealAlert();
  if(dealEl('dealUnitSearch'))dealEl('dealUnitSearch').value='';
  if(dealEl('dealUnitFloor'))dealEl('dealUnitFloor').value='';
  const cached=DEAL_UNITS_CACHE_[project];
  if(cached)dealRenderUnits_(cached.rows);
  else dealEl('dealUnitCode').innerHTML='<option value="">Loading units...</option>';
  if(cached&&Date.now()-cached.at<60000)return;   // fresh enough
  dealFetchUnits_(project,rows=>{
    if(req!==DEAL_UNITS_REQ_||dealValue('dealProject')!==project)return;   // answer for an older choice
    dealRenderUnits_(rows);
  },e=>{
    if(req!==DEAL_UNITS_REQ_||cached)return;
    dealEl('dealUnitCode').innerHTML='<option value="">Unable to load units</option>';
    showDealAlert(e.message||String(e),'error');
  });
}

function showDealAlert(message,type='info'){
  const el=dealEl('dealAlert');if(!el)return;
  el.className=`dealAlert ${type}`;
  el.innerText=message||'';
}
function hideDealAlert(){const el=dealEl('dealAlert');if(el)el.className='dealAlert hidden'}
function validateDealStep(step){
  if(step===1){
    if(!dealValue('dealProject')||!dealValue('dealUnitCode')||!dealValue('dealStatus')||!dealValue('dealTransactionDate')){showDealAlert('Complete Project, Unit, Status and Transaction Date.','warning');return false}
    if(!dealUnitValidated){showDealAlert('The selected unit is not available or has not passed validation.','warning');return false}
  }
  if(step===2){
    if(!dealValue('dealClientName')||!dealValue('dealMobile')){showDealAlert('Client Name and Mobile are required.','warning');return false}
  }
  if(step===3){
    if(!dealValue('dealBranch')||!dealValue('dealSalesName')){showDealAlert('Branch and Sales Name are required.','warning');return false}
  }
  hideDealAlert();return true;
}
function dealNextStep(){
  if(!validateDealStep(dealCurrentStep))return;
  if(dealCurrentStep<5){dealCurrentStep++;if(dealCurrentStep===5)renderDealReview();renderDealStep()}
}
function dealPrevStep(){if(dealCurrentStep>1){dealCurrentStep--;renderDealStep()}}
function renderDealStep(){
  document.querySelectorAll('.dealStep').forEach(s=>s.classList.toggle('active',Number(s.dataset.dealStep)===dealCurrentStep));
  dealEl('dealStepText').innerText=`Step ${dealCurrentStep} of 5`;
  dealEl('dealProgressBar').style.width=`${dealCurrentStep*20}%`;
  dealEl('dealPrevBtn').classList.toggle('hidden',dealCurrentStep===1);
  dealEl('dealNextBtn').classList.toggle('hidden',dealCurrentStep===5);
  dealEl('dealSaveBtn').classList.toggle('hidden',dealCurrentStep!==5);
}
/* Price, discount and down payment: type either the % or the amount,
   the other one is filled in. Percentages are of the price after discount. */
function dealCalc_(changed){
  const num=id=>{const v=dealEl(id)?.value;return v===''||v==null?NaN:Number(v);};
  const set=(id,v,dec)=>{const el=dealEl(id);if(!el)return;el.value=Number.isFinite(v)?String(Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)):'';};
  const base=Number(dealSelectedUnit&&dealSelectedUnit.totalPrice)||0;
  if(changed==='discount'&&base){const d=num('dealDiscountPercent');set('dealFinalPrice',base*(1-(Number.isFinite(d)?d:0)/100),0);}
  if(changed==='discountAmt'&&base){const a=num('dealDiscountAmount');set('dealFinalPrice',base-(Number.isFinite(a)?a:0),0);set('dealDiscountPercent',Number.isFinite(a)?a/base*100:NaN,2);}
  if(changed==='final'&&base){const f=num('dealFinalPrice');set('dealDiscountPercent',Number.isFinite(f)?(1-f/base)*100:NaN,2);}
  if(changed==='discountAmt')changed='final';
  if(base){
    const f=num('dealFinalPrice'),fin=Number.isFinite(f)?f:base;
    if(changed!=='discountAmt')set('dealDiscountAmount',base-fin,0);
    const area=Number(dealSelectedUnit&&dealSelectedUnit.area)||0,meter=Number(dealSelectedUnit&&dealSelectedUnit.meterPrice)||0;
    const mEl=dealEl('dealMeterAfter');if(mEl)mEl.value=area?money(Math.round(fin/area)):(meter?money(Math.round(meter*fin/base)):'');
  }
  const price=Number.isFinite(num('dealFinalPrice'))?num('dealFinalPrice'):base;
  if(price){
    const priceMoved=changed==='discount'||changed==='final';
    if(changed==='dpAmt'){set('dealDPPercent',num('dealActualDP')/price*100,2);}
    else if((changed==='dpPct'||priceMoved)&&Number.isFinite(num('dealDPPercent'))){set('dealActualDP',price*num('dealDPPercent')/100,0);}
    if(changed==='paidAmt'){set('dealDPPaid',num('dealActualPaid')/price*100,2);}
    else if((changed==='paidPct'||priceMoved)&&Number.isFinite(num('dealDPPaid'))){set('dealActualPaid',price*num('dealDPPaid')/100,0);}
  }
  // Maintenance: % of the price before or after discount (chosen in the form).
  const mBase=dealValue('dealMaintenanceBase')==='before'?base:price;
  if(mBase){
    if(changed==='maintAmt')set('dealMaintenancePercent',num('dealMaintenanceAmount')/mBase*100,2);
    else if((changed==='maintPct'||changed==='discount'||changed==='final')&&Number.isFinite(num('dealMaintenancePercent')))set('dealMaintenanceAmount',mBase*num('dealMaintenancePercent')/100,0);
  }
  const dp=num('dealActualDP'),paid=num('dealActualPaid');
  set('dealRemain',Number.isFinite(dp)?dp-(Number.isFinite(paid)?paid:0):NaN,0);
}
function calculateDealRemain(){dealCalc_('');}
/* Shared With picked -> Share, empty -> Solo (not editable by hand). */

  const el=dealEl('dealDealStatus');if(!el)return;

  if(![...el.options].some(o=>o.value===v))el.insertAdjacentHTML('beforeend',`<option value="${v}">${v}</option>`);
  el.value=v;
}

function renderDealReview(){
  const p=collectDealPayload(),u=dealSelectedUnit||{};
  const rows=[
    ['Client',p.clientName],['Mobile',p.mobile],['Project',p.project],['Unit',p.unitCode],
    ['Inventory Status',u.status],['Company',u.company],['Unit Type',u.type||u.unitType],
    ['Area',u.totalGross||u.area],['Unit Price',u.totalPrice?money(u.totalPrice)+' '+(u.currency||''):''],
    ['Discount',p.discountAmount&&Number(p.discountAmount)?`${money(p.discountAmount)} (${p.discountPercent||0}%)`:'—'],['Price After Discount',p.finalPrice?money(p.finalPrice)+' '+(u.currency||''):''],
    ['Deal Status',p.dealStatus+(p.sharedWith?' with '+p.sharedWith:'')],['DP %',p.dpPercent?p.dpPercent+'%':''],
    ['Transaction Status',p.status],['Branch',p.branch],['Sales',p.salesName],
    ['Source',[p.mainSource,p.sourceType,p.campaignName].filter(Boolean).join(' / ')],
    ['Maintenance',p.maintenanceAmount?`${money(p.maintenanceAmount)} (${p.maintenancePercent||''}% of price ${dealValue('dealMaintenanceBase')==='before'?'before':'after'} discount)`:'—'],['Actual DP',p.actualDP?money(p.actualDP):''],['Paid',p.actualPaid?money(p.actualPaid)+(p.dpPaid?` (${p.dpPaid}%)`:''):''],['Remain',p.remain!==''?money(p.remain):'']
  ];
  dealEl('dealReview').innerHTML=rows.map(([k,v])=>`<div><span>${escapeHtml(k)}</span><b>${escapeHtml(v||'—')}</b></div>`).join('');
}
function submitNewDeal(){
  if(isEgyptViewer_()){
    showDealAlert('This account is read only.','error');
    return;
  }
  if(!dealEl('dealConfirmCheck').checked){showDealAlert('Confirm that you reviewed the deal before saving.','warning');return}
  if(!dealUnitValidated){showDealAlert('Unit validation is no longer valid. Re-select the unit.','warning');return}
  const payload=collectDealPayload();
  // Same id for every retry of this deal, so it can never be saved twice.
  DEAL_REQUEST_ID_=DEAL_REQUEST_ID_||(Date.now().toString(36)+Math.random().toString(36).slice(2,10));
  payload.requestId=DEAL_REQUEST_ID_;
  showDealAlert('Saving deal... this can take up to a minute.','info');
  dealEl('dealSaveBtn').disabled=true;
  google.script.run.withSuccessHandler(res=>{
    const miss=(res&&res.skipped&&res.skipped.length)?`\n\nThese fields have no column in the Deals sheet and were not saved: ${res.skipped.join(', ')}`:'';
    const rej=(res&&res.rejected&&res.rejected.length)?`\n\nNot saved — please fix in the sheet:\n• ${res.rejected.join('\n• ')}`:'';
    showDealAlert(res.message,'success');
    dealEl('dealSaveBtn').disabled=false;
    DEAL_REQUEST_ID_='';
    Object.keys(DEAL_UNITS_CACHE_).forEach(k=>delete DEAL_UNITS_CACHE_[k]);   // the sold unit must disappear
    alert(res.message+rej+miss);
    resetDealWizard();
    dealOptionsLoaded=false;
    loadDashboard();
  }).withFailureHandler(e=>{
    dealEl('dealSaveBtn').disabled=false;
    const m=e.message||String(e);
    showDealAlert(/90 seconds|did not answer/i.test(m)
      ?'The save is taking longer than usual and may still finish. Wait a minute, then press Save Deal again — it will not be added twice.'
      :m,'error');
  }).saveNewDeal(AUTH_TOKEN,payload);
}
let DEAL_REQUEST_ID_='';
function resetDealWizard(){
  DEAL_REQUEST_ID_='';
  document.querySelectorAll('#dealEntryPanel input,#dealEntryPanel textarea').forEach(el=>{
    if(el.type==='checkbox')el.checked=false;else el.value='';
  });
  document.querySelectorAll('#dealEntryPanel select').forEach(el=>el.selectedIndex=0);
  dealEl('dealProject').value='EDEN WALK';
  dealEl('dealStatus').value='Reservation';
  dealSyncDealStatus_();
  dealEl('dealTransactionDate').value=new Date().toISOString().slice(0,10);
  dealCurrentStep=1;dealSelectedUnit=null;dealUnitValidated=false;
  dealEl('dealUnitCard').classList.add('hidden');
  hideDealAlert();renderDealStep();loadDealUnits();
}

  june:6,jun:6,'يونيو':6,

  'E-ONE':['e-one','e one','e1','اي وان','إي وان','اى وان']
};

const AI_STATUS_ALIASES={
  'Closed':['closed','كلوزد','مغلقة','مغلق','صفقات مغلقة'],
  'Reservation':['reservation','reservations','حجز','حجوزات','ريزرفيشن'],
  'Part of DP':['part of dp','جزء من المقدم','جزء مقدم'],
  'Total DP':['total dp','كامل المقدم','اجمالي المقدم','إجمالي المقدم'],
  'Client Signed':['client signed','توقيع العميل','العميل وقع'],
  'Company Signed':['company signed','توقيع الشركة','الشركة وقعت'],
  'Delivered':['delivered','تسليم','تم التسليم'],

function aiNorm(v){
  return String(v||'')
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/[إأآ]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[^\p{L}\p{N}%.-]+/gu,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function aiHas(t,phrases){
  return (phrases||[]).some(x=>t.includes(aiNorm(x)));
}

function aiAddMessage(role,html){
  const wrap=document.getElementById('aiChat')||document.getElementById('aiMessages');
  if(!wrap)return;
  const box=document.createElement('div');
  box.className=`aiMessage ${role}`;
  box.innerHTML=html;
  wrap.appendChild(box);
  wrap.scrollTop=wrap.scrollHeight;
}

function aiFormatNumber(n){
  return Number(n||0).toLocaleString('en-US');
}

function aiGetAllRows(){
  return Array.isArray(rawRows)?rawRows.slice():[];
}

function aiUniqueValues(rows,key){
  return [...new Set((rows||[]).map(r=>String(r[key]||'').trim()).filter(Boolean))];
}

function aiExtractYear(t){
  const m=t.match(/\b(20\d{2}|19\d{2})\b/);
  if(m)return Number(m[1]);

  const now=new Date();
  if(aiHas(t,['this year','current year','السنه الحاليه','السنة الحالية','العام الحالي']))return now.getFullYear();
  if(aiHas(t,['last year','previous year','السنه الماضيه','السنة الماضية','العام الماضي']))return now.getFullYear()-1;
  return null;
}

function aiExtractMonth(t){
  for(const [name,num] of Object.entries(AI_MONTHS)){
    if(t.includes(aiNorm(name)))return num;
  }

  const now=new Date();
  if(aiHas(t,['this month','current month','الشهر الحالي','هذا الشهر']))return now.getMonth()+1;
  if(aiHas(t,['last month','previous month','الشهر الماضي'])){
    return now.getMonth()===0?12:now.getMonth();
  }
  return null;
}

function aiExtractDateContext(t){
  const now=new Date();
  let year=aiExtractYear(t);
  let month=aiExtractMonth(t);

  if(month&&!year){
    if(aiHas(t,['last month','previous month','الشهر الماضي']) && now.getMonth()===0) year=now.getFullYear()-1;
    else year=now.getFullYear();
  }

  let label='';
  if(month&&year)label=new Date(year,month-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});
  else if(year)label=String(year);

  return {year,month,label};
}

function aiFindProjectHits(t,allRows){
  const actual=aiUniqueValues(allRows,'project');
  const hits=[];

  Object.entries(AI_PROJECT_ALIASES).forEach(([canonical,aliases])=>{
    if(aliases.some(a=>t.includes(aiNorm(a)))){
      const matched=actual.find(v=>aiNorm(v)===aiNorm(canonical))
        || actual.find(v=>aliases.some(a=>aiNorm(v)===aiNorm(a)))
        || canonical;
      hits.push(matched);
    }
  });

  actual.forEach(v=>{
    if(t.includes(aiNorm(v))&&!hits.some(h=>aiNorm(h)===aiNorm(v)))hits.push(v);
  });

  return hits;
}

function aiFindEntityHits(t,allRows,key){
  return aiUniqueValues(allRows,key)
    .filter(v=>t.includes(aiNorm(v)))
    .sort((a,b)=>b.length-a.length);
}

function aiFindStatusHits(t,allRows){
  const actual=aiUniqueValues(allRows,'status');
  const hits=[];

  Object.entries(AI_STATUS_ALIASES).forEach(([canonical,aliases])=>{
    if(aliases.some(a=>t.includes(aiNorm(a)))){
      const matched=actual.find(v=>aiNorm(v)===aiNorm(canonical))||canonical;
      hits.push(matched);
    }
  });

  actual.forEach(v=>{
    if(t.includes(aiNorm(v))&&!hits.some(h=>aiNorm(h)===aiNorm(v)))hits.push(v);
  });

  return hits;
}

function aiExtractIntent(t){
  const compare=aiHas(t,['compare','comparison','قارن','مقارنه','مقارنة','الفرق بين']);
  const top=aiHas(t,['top','best','highest','most','افضل','أفضل','اعلي','أعلى','اكتر','أكثر']);
  const bottom=aiHas(t,['bottom','worst','lowest','least','اقل','أقل','اضعف','أضعف']);
  const count=aiHas(t,[
    'how many','count','number of','كم عدد','كام عدد','عدد ',
    'كام صفقه','كام صفقة','كم صفقه','كم صفقة','عدد المبيعات','عدد الصفقات'
  ]);
  const revenue=aiHas(t,[
    'revenue','value','amount','sales value','total sales',
    'قيمة المبيعات','قيمه المبيعات','اجمالي المبيعات','إجمالي المبيعات',
    'ايراد','إيراد','ايرادات','إيرادات'
  ]);
  const clients=aiHas(t,['clients','customers','عملاء','العملاء','عميل']);
  const units=aiHas(t,['units','unit count','وحدات','الوحدات','وحدة','وحده']);
  const area=aiHas(t,['meters','meter','area','مساحه','مساحة','امتار','أمتار']);
  const average=aiHas(t,['average','avg','متوسط']);
  const breakdown=aiHas(t,['breakdown','distribution','تفصيل','توزيع','حسب']);
  const summary=aiHas(t,['summary','overview','ملخص','نظره عامه','نظرة عامة']);
  const inventory=aiHas(t,['inventory','available units','المخزون','الوحدات المتاحه','الوحدات المتاحة']);
  const trend=aiHas(t,['trend','over time','monthly','شهري','اتجاه','تطور']);

  return {compare,top,bottom,count,revenue,clients,units,area,average,breakdown,summary,inventory,trend};
}

function aiResolveDimension(t,entities){
  if(aiHas(t,['sales','salesman','sales person','سيلز','موظف مبيعات']))return 'salesName';
  if(aiHas(t,['branch','branches','فرع','فروع']))return 'branch';
  if(aiHas(t,['status','statuses','حاله','حالة','حالات']))return 'status';
  if(aiHas(t,['project','projects','مشروع','مشاريع']))return 'project';
  if(aiHas(t,['unit type','نوع الوحده','نوع الوحدة']))return 'unitType';
  if(aiHas(t,['source','مصدر']))return 'mainSource';

  if(entities.projectHits.length>1)return 'project';
  if(entities.salesHits.length>1)return 'salesName';
  if(entities.branchHits.length>1)return 'branch';
  return null;
}

function aiMetricFromIntent(intent,t){
  if(intent.revenue)return 'amount';
  if(intent.clients)return 'clients';
  if(intent.units)return 'units';
  if(intent.area)return 'area';
  if(intent.average)return 'average';
  return 'count';
}

function aiApplyFilters(rows,ctx){
  let out=rows.slice();

  if(ctx.projectHits.length){
    out=out.filter(r=>ctx.projectHits.some(v=>aiNorm(r.project)===aiNorm(v)));
  }
  if(ctx.salesHits.length){
    out=out.filter(r=>ctx.salesHits.some(v=>aiNorm(r.salesName)===aiNorm(v)));
  }
  if(ctx.branchHits.length){
    out=out.filter(r=>ctx.branchHits.some(v=>aiNorm(r.branch)===aiNorm(v)));
  }
  if(ctx.statusHits.length){
    out=out.filter(r=>ctx.statusHits.some(v=>aiNorm(r.status)===aiNorm(v)));
  }
  if(ctx.date.year){
    out=out.filter(r=>Number(r.year)===Number(ctx.date.year));
  }
  if(ctx.date.month){
    out=out.filter(r=>Number(r.month)===Number(ctx.date.month));
  }

  // Default behavior: exclude Cancel unless the question explicitly asks for it.
  if(!ctx.statusHits.length && !aiHas(ctx.t,['all status','including cancel','كل الحالات','شامل الملغي','بما فيها الملغي'])){
    out=out.filter(r=>aiNorm(r.status)!=='cancel');
  }

  return out;
}

function aiBuildContext(question){
  const t=aiNorm(question);
  const allRows=aiGetAllRows();
  const projectHits=aiFindProjectHits(t,allRows);
  const salesHits=aiFindEntityHits(t,allRows,'salesName');
  const branchHits=aiFindEntityHits(t,allRows,'branch');
  const statusHits=aiFindStatusHits(t,allRows);
  const date=aiExtractDateContext(t);
  const intent=aiExtractIntent(t);

  const ctx={t,question,allRows,projectHits,salesHits,branchHits,statusHits,date,intent};
  ctx.dimension=aiResolveDimension(t,ctx);
  ctx.metric=aiMetricFromIntent(intent,t);
  ctx.rows=aiApplyFilters(allRows,ctx);
  return ctx;
}

function aiMetricValue(rows,metric){
  if(metric==='amount')return sum(rows,'amount');
  if(metric==='clients')return new Set(rows.map(r=>clientKeyOf(r)).filter(Boolean)).size;
  if(metric==='units')return rows.filter(r=>String(r.unitCode||'').trim()).length;
  if(metric==='area')return sum(rows,'area');
  if(metric==='average')return rows.length?sum(rows,'amount')/rows.length:0;
  return rows.length;
}

function aiMetricLabel(metric){
  return {
    count:'Deals',
    amount:'Sales Value',
    clients:'Unique Clients',
    units:'Units',
    area:'Meters',
    average:'Average Deal Value'
  }[metric]||metric;
}

function aiGroupRows(rows,key,metric){
  const groups=by(rows,key);
  return Object.keys(groups)
    .map(name=>({name,value:aiMetricValue(groups[name],metric),rows:groups[name]}))
    .sort((a,b)=>b.value-a.value);
}

function aiCurrencyTotals(rows){
  return {
    egp:sum(rows.filter(r=>projectCurrency_(r)==='EGP'),'amount'),
    usd:sum(rows.filter(r=>projectCurrency_(r)==='USD'),'amount')
  };
}

function aiContextLine(ctx){
  const parts=[];
  if(ctx.projectHits.length)parts.push('Project: '+ctx.projectHits.join(' + '));
  if(ctx.salesHits.length)parts.push('Sales: '+ctx.salesHits.join(' + '));
  if(ctx.branchHits.length)parts.push('Branch: '+ctx.branchHits.join(' + '));
  if(ctx.statusHits.length)parts.push('Status: '+ctx.statusHits.join(' + '));
  if(ctx.date.label)parts.push(ctx.date.label);
  return parts.length?parts.join(' · '):'All EDEN BI transaction data';
}

function aiAnswerNoData(ctx){
  return `<b>EDEN AI</b>
    <div style="margin-top:8px">No matching data was found.</div>
    <div class="small" style="margin-top:8px">${safe(aiContextLine(ctx))}</div>`;
}

function aiAnswerSingleMetric(ctx){
  const value=aiMetricValue(ctx.rows,ctx.metric);
  let formatted=aiFormatNumber(value);

  if(ctx.metric==='amount'||ctx.metric==='average'){
    const totals=aiCurrencyTotals(ctx.rows);
    if(ctx.projectHits.length===1){
      const currency=ctx.rows[0]?projectCurrency_(ctx.rows[0]):'';
      formatted=`${currency?currency+' ':''}${aiFormatNumber(value)}`;
    }else{
      return `<b>EDEN AI</b>
        <div class="aiResultTitle">${safe(aiMetricLabel(ctx.metric))}</div>
        <div class="aiBigNumber">EGP ${aiFormatNumber(totals.egp)}</div>
        <div class="aiBigNumber">USD ${aiFormatNumber(totals.usd)}</div>
        <div class="small" style="margin-top:10px">${safe(aiContextLine(ctx))}</div>`;
    }
  }

  return `<b>EDEN AI</b>
    <div class="aiResultTitle">${safe(aiMetricLabel(ctx.metric))}</div>
    <div class="aiBigNumber">${safe(formatted)}</div>
    <div class="small" style="margin-top:10px">${safe(aiContextLine(ctx))}</div>`;
}

function aiAnswerRanking(ctx){
  const dimension=ctx.dimension||'project';
  const rows=aiGroupRows(ctx.rows,dimension,ctx.metric);
  if(!rows.length)return aiAnswerNoData(ctx);

  const selected=ctx.intent.bottom?[...rows].reverse():rows;
  const limit=ctx.intent.compare?Math.min(selected.length,10):Math.min(selected.length,5);
  const shown=selected.slice(0,limit);

  const title=ctx.intent.compare
    ?`Comparison by ${trendDimensionLabel_(dimension)}`
    :`${ctx.intent.bottom?'Lowest':'Top'} ${trendDimensionLabel_(dimension)}`;

  return `<b>EDEN AI</b>
    <div class="aiResultTitle">${safe(title)} — ${safe(aiMetricLabel(ctx.metric))}</div>
    <ol class="aiRanking">
      ${shown.map(x=>`<li><b>${safe(x.name)}</b> — ${safe(aiFormatNumber(x.value))}</li>`).join('')}
    </ol>
    <div class="small" style="margin-top:10px">${safe(aiContextLine(ctx))}</div>`;
}

function aiAnswerSummary(ctx){
  const totals=aiCurrencyTotals(ctx.rows);
  const uniqueClients=new Set(ctx.rows.map(r=>clientKeyOf(r)).filter(Boolean)).size;
  const units=ctx.rows.filter(r=>String(r.unitCode||'').trim()).length;
  const projects=new Set(ctx.rows.map(r=>r.project).filter(Boolean)).size;
  const bestProject=aiGroupRows(ctx.rows,'project','count')[0];
  const bestSales=aiGroupRows(ctx.rows,'salesName','count')[0];

  return `<b>EDEN AI</b>
    <div class="aiResultTitle">Executive Summary</div>
    <div class="aiSummaryGrid">
      <div><span>Deals</span><b>${aiFormatNumber(ctx.rows.length)}</b></div>
      <div><span>Value EGP</span><b>${aiFormatNumber(totals.egp)}</b></div>
      <div><span>Value USD</span><b>${aiFormatNumber(totals.usd)}</b></div>
      <div><span>Unique Clients</span><b>${aiFormatNumber(uniqueClients)}</b></div>
      <div><span>Units</span><b>${aiFormatNumber(units)}</b></div>
      <div><span>Projects</span><b>${aiFormatNumber(projects)}</b></div>
    </div>
    ${bestProject?`<div style="margin-top:10px">Top project: <b>${safe(bestProject.name)}</b> (${aiFormatNumber(bestProject.value)} deals)</div>`:''}
    ${bestSales?`<div>Top sales: <b>${safe(bestSales.name)}</b> (${aiFormatNumber(bestSales.value)} deals)</div>`:''}
    <div class="small" style="margin-top:10px">${safe(aiContextLine(ctx))}</div>`;
}

function aiAnswerStatusBreakdown(ctx){
  const rows=aiGroupRows(ctx.rows,'status','count');
  return `<b>EDEN AI</b>
    <div class="aiResultTitle">Status Breakdown</div>
    <ol class="aiRanking">
      ${rows.slice(0,12).map(x=>`<li><b>${safe(x.name)}</b> — ${aiFormatNumber(x.value)}</li>`).join('')}
    </ol>
    <div class="small" style="margin-top:10px">${safe(aiContextLine(ctx))}</div>`;
}

function aiInventoryAnswer(question){
  const t=aiNorm(question);
  let rows=Array.isArray(inventoryRows)?inventoryRows.slice():[];

  if(!rows.length){
    return '<b>EDEN AI</b><div>Inventory data is not loaded yet. Open the Inventory section once, then ask again.</div>';
  }

  if(aiHas(t,['available','متاح','متاحه','متاحة'])){
    rows=rows.filter(r=>aiNorm(r.status).includes('available')||aiNorm(r.status).includes('متاح'));
  }

  const priceMatch=t.match(/(?:under|below|less than|اقل من|أقل من)\s*([\d,.]+)/);
  if(priceMatch){
    const max=Number(priceMatch[1].replace(/,/g,''));
    rows=rows.filter(r=>Number(r.price||r.amount||r.totalPrice||0)<=max);
  }

  const projectHits=aiFindProjectHits(t,rows);
  if(projectHits.length){
    rows=rows.filter(r=>projectHits.some(v=>aiNorm(r.project)===aiNorm(v)));
  }

  return `<b>EDEN AI</b>
    <div class="aiResultTitle">Matching Inventory Units</div>
    <div class="aiBigNumber">${aiFormatNumber(rows.length)}</div>
    <div class="small" style="margin-top:10px">Inventory dashboard filters are ignored.</div>`;
}

function askEdenAI(question){
  const input=document.getElementById('aiQuestion')||document.getElementById('aiInput');
  const q=String(question||input?.value||'').trim();
  if(!q)return;

  if(input)input.value='';
  aiAddMessage('user',`<div>${safe(q)}</div>`);

  const ctx=aiBuildContext(q);

  if(ctx.intent.inventory){
    aiAddMessage('assistant',aiInventoryAnswer(q));
    return;
  }

  if(!ctx.rows.length){
    aiAddMessage('assistant',aiAnswerNoData(ctx));
    return;
  }

  let html='';

  if(ctx.intent.summary){
    html=aiAnswerSummary(ctx);
  }else if(aiHas(ctx.t,['status breakdown','تفصيل الحالات','توزيع الحالات']) || (ctx.intent.breakdown&&ctx.dimension==='status')){
    html=aiAnswerStatusBreakdown(ctx);
  }else if(ctx.intent.compare||ctx.intent.top||ctx.intent.bottom||ctx.dimension){
    html=aiAnswerRanking(ctx);
  }else{
    html=aiAnswerSingleMetric(ctx);
  }

  aiAddMessage('assistant',html);
}

function aiQuickAsk(q){
  const input=document.getElementById('aiQuestion')||document.getElementById('aiInput');
  if(input)input.value=q;
  askEdenAI(q);
}

// ================= DEAL STAGE FILTER =================
// One stage per deal, from Status + the Deal Confirmation checkboxes
// (Part of DP, Total DP, Client Sigend, Company Signed, Delivery Signed, Delivered).
const DEAL_STAGES_=[
  {k:'csPart',label:'Client signed + Part of DP'},
  {k:'csTotal',label:'Client signed + Total DP'},
  {k:'coPart',label:'Company Signed + Part of DP'},
  {k:'coTotal',label:'Company Signed + Total DP'},
  {k:'closed',label:'Closed'},
  {k:'delivered',label:'Delivered'},
  {k:'part',label:'Part of DP (not signed)'},
  {k:'total',label:'Total DP (not signed)'},
  {k:'reservation',label:'Reservation'},
  {k:'review',label:'Needs review (ticks don’t match)'}
];
function dealStage_(r){
  const T=v=>commissionTrue_(v),st=String(r?.status||'').trim().toLowerCase();
  const P=T(r?.confPartDP),TD=T(r?.confTotalDP),CS=T(r?.confClientSigned),CO=T(r?.confCompanySigned),DS=T(r?.confDeliverySigned),DL=T(r?.confDelivered);
  if(st==='closed')return 'closed';
  if(DL)return DS?'delivered':'review';            // Delivered needs Delivery Signed ticked
  if(CO){if(TD)return 'coTotal';if(P)return 'coPart';return 'review';}
  if(CS){if(TD)return 'csTotal';if(P)return 'csPart';return 'review';}
  if(TD)return 'total';
  if(P)return 'part';
  return 'reservation';
}
let CONTRACT_SEL_={at:0,v:[]};
function contractFilterMatch_(r){
  const now=Date.now();
  if(now-CONTRACT_SEL_.at>50)CONTRACT_SEL_={at:now,v:getMulti('contract')};
  const sel=CONTRACT_SEL_.v;
  if(!sel.length)return true;
  return sel.includes(dealStage_(r));
}

// ================= COMMISSION FILTER =================
// Paid = any Internal comm checkbox (Sales / Managers / Staff) is ticked in the Deals sheet.
function commissionPaid_(r){
  return commissionTrue_(r?.internalCommSales)||commissionTrue_(r?.internalCommManagers)||commissionTrue_(r?.internalCommStaff);
}
let COMMISSION_SEL_={at:0,v:[]};
function commissionFilterMatch_(r){
  const now=Date.now();
  if(now-COMMISSION_SEL_.at>50)COMMISSION_SEL_={at:now,v:getMulti('commission')};
  const sel=COMMISSION_SEL_.v;
  if(!sel.length||sel.length>=2)return true;
  return sel[0]==='paid'?commissionPaid_(r):!commissionPaid_(r);
}

// ================= INTERNAL COMMISSIONS 2026+ =================
function commissionTrue_(value){
  if(value===true || value===1)return true;
  const s=String(value??'').trim().toLowerCase();
  return s==='true'||s==='1'||s==='yes'||s==='checked'||s==='✓'||s==='✔';
}

function isCommissionedDeal_(r){
  return Number(r?.year)>=2026 && (
    commissionTrue_(r?.internalCommSales) ||
    commissionTrue_(r?.internalCommManagers) ||
    commissionTrue_(r?.internalCommStaff) ||
    commissionTrue_(r?.internalCommStatue)
  );
}

function commissionMoney_(amount,currency){

}

function renderCommissions_(){
  ensureCommissionsPanel_();
  const rows=(filtered||[]).filter(isCommissionedDeal_);

  let egp=0,usd=0;
  const clients=new Set();
  let sales=0,managers=0,staff=0,statue=0;

  rows.forEach(r=>{
    const cur=String(r.currency||'').toUpperCase()==='USD'?'USD':'EGP';
    if(cur==='USD')usd+=Number(r.amount)||0; else egp+=Number(r.amount)||0;
    const ck=String(r.clientKey||r.clientName||'').trim().toLowerCase();
    if(ck)clients.add(ck);
    if(commissionTrue_(r.internalCommSales))sales++;
    if(commissionTrue_(r.internalCommManagers))managers++;
    if(commissionTrue_(r.internalCommStaff))staff++;
    if(commissionTrue_(r.internalCommStatue))statue++;
  });

  document.getElementById('commDeals').textContent=rows.length.toLocaleString('en-US');
  document.getElementById('commEGP').textContent=commissionMoney_(egp,'EGP');
  document.getElementById('commUSD').textContent=commissionMoney_(usd,'USD');
  document.getElementById('commClients').textContent=clients.size.toLocaleString('en-US');
  document.getElementById('commSalesCount').textContent=sales.toLocaleString('en-US');
  document.getElementById('commManagersCount').textContent=managers.toLocaleString('en-US');
  document.getElementById('commStaffCount').textContent=staff.toLocaleString('en-US');
  document.getElementById('commStatueCount').textContent=statue.toLocaleString('en-US');

  const body=document.getElementById('commissionsTableBody');
  if(!body)return;

  const check=v=>commissionTrue_(v)
    ?'<span class="commYes">TRUE</span>'
    :'<span class="commNo">—</span>';

  body.innerHTML=rows.length ? rows.map(r=>`
    <tr>
      <td>${escapeHtml(r.date||'')}</td>
      <td><strong>${escapeHtml(r.clientName||'—')}</strong></td>
      <td>${escapeHtml(r.project||'—')}</td>
      <td>${escapeHtml(r.unitCode||'—')}</td>
      <td>${escapeHtml(r.salesName||'—')}</td>
      <td class="commAmount">${escapeHtml(commissionMoney_(r.amount,r.currency))}</td>
      <td>${check(r.internalCommSales)}</td>
      <td>${check(r.internalCommManagers)}</td>
      <td>${check(r.internalCommStaff)}</td>
      <td>${check(r.internalCommStatue)}</td>
    </tr>`).join('')
    :`<tr><td colspan="10" class="commEmpty">No commissioned deals match the current filters from 2026 onward.</td></tr>`;
}

function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#096;')}
