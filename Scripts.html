const money=n=>Number(n||0).toLocaleString('en-US');
const by=(arr,key)=>arr.reduce((m,r)=>{const k=r[key]||'Not Assigned';(m[k]=m[k]||[]).push(r);return m},{});
const sum=(arr,key)=>arr.reduce((a,r)=>a+(Number(r[key])||0),0);

const edenNormName_=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ');

function isShareDeal_(row){
  return String(row?.dealStatus||'').trim().toLowerCase()==='share' &&
         String(row?.sharedWith||'').trim() &&
         edenNormName_(row?.sharedWith)!==edenNormName_(row?.salesName);
}

function salesMatchesDeal_(row,salesNames){
  const wanted=(salesNames||[]).map(edenNormName_);
  if(!wanted.length)return true;
  const primary=edenNormName_(row?.salesName);
  const shared=isShareDeal_(row)?edenNormName_(row?.sharedWith):'';
  return wanted.includes(primary) || (!!shared && wanted.includes(shared));
}

function salesManagerLookup_(){
  const map=new Map();
  (rawRows||[]).forEach(r=>{
    const sales=String(r.salesName||'').trim();
    const manager=String(r.salesManager||'').trim();
    if(sales && manager && !map.has(edenNormName_(sales)))map.set(edenNormName_(sales),manager);
  });
  return map;
}

function salesCreditRows_(rows){
  const managerMap=salesManagerLookup_();
  const out=[];
  (rows||[]).forEach(r=>{
    const primary=String(r.salesName||'').trim()||'Not Assigned';
    const shared=String(r.sharedWith||'').trim();
    if(!isShareDeal_(r)){
      out.push({...r,salesName:primary,salesCredit:1,dealCredit:1,shareRole:'Solo / Primary'});
      return;
    }
    out.push({...r,salesName:primary,amount:(Number(r.amount)||0)/2,area:(Number(r.area)||0)/2,salesCredit:.5,dealCredit:.5,shareRole:'Primary Share'});
    out.push({...r,salesName:shared,salesManager:managerMap.get(edenNormName_(shared))||r.salesManager||'',amount:(Number(r.amount)||0)/2,area:(Number(r.area)||0)/2,salesCredit:.5,dealCredit:.5,shareRole:'Shared With'});
  });
  return out;
}

const isClosed=r=>String(r.status||'').toLowerCase()==='closed';

const USD_PROJECTS = new Set(['CCG','CITY CENTER GLDANI','CITY CENTRE GLDANI','KOBULETI']);

function projectCurrency_(row){
  const project=String(row?.project||'').trim().toUpperCase();
  if(USD_PROJECTS.has(project)) return 'USD';

  const currency=String(row?.currency||'').trim().toUpperCase();
  if(currency==='USD'||currency==='EGP') return currency;

  return 'EGP';
}

const UNIT_TYPE_ORDER=['Commercial','Admin','Medical','Residential','Hotel Apartment','Studio','One Bedroom','2 Bedroom','3 Bedroom','Villa','Ground Villa','Roof Villa','Sky Villa','Sky Roof Villa'];
function sortUnitTypesClient(arr){return [...new Set((arr||[]).filter(Boolean).filter(x=>x!=='Not Classified'))].sort((a,b)=>{const ia=UNIT_TYPE_ORDER.indexOf(a),ib=UNIT_TYPE_ORDER.indexOf(b);if(ia!==-1||ib!==-1)return (ia===-1?999:ia)-(ib===-1?999:ib);return String(a).localeCompare(String(b),undefined,{numeric:true})})}

    section.querySelectorAll(':scope > .filterGroup.multi').forEach(group=>{

        const label=document.createElement('div');
        label.className='dashboardFilterName';
        label.textContent=titleMap[group.id]||'Filter';
        group.insertBefore(label,group.firstChild);
      }
    });

    const directSearch=[...section.children].find(el=>
      el.tagName==='INPUT' &&
      (el.id==='search'||el.id==='brokerSearch')
    );

    if(directSearch&&!directSearch.closest('.dashboardSearchCell')){
      const wrapper=document.createElement('div');
      wrapper.className='dashboardSearchCell';

      const label=document.createElement('div');
      label.className='dashboardFilterName';
      label.textContent='Search';

      const box=document.createElement('div');
      box.className='dashboardSearchBox';

      const icon=document.createElement('span');
      icon.textContent='⌕';

      directSearch.parentNode.insertBefore(wrapper,directSearch);
      wrapper.appendChild(label);
      wrapper.appendChild(box);
      box.appendChild(icon);
      box.appendChild(directSearch);

    if(!section.querySelector('.dashboardClearAll')){
      const clearBtn=document.createElement('button');

      clearBtn.className='dashboardClearAll';

            panel.querySelectorAll('.checkRow').forEach(row=>{row.classList.remove('edenSearchHidden');row.style.display='';});
          }
        });

        updateMultiLabels();
        applyFilters();
      });

      section.appendChild(clearBtn);

let EDEN_MAGIC_RUNNING=false;
function updateEdenAccessClock_(){
 const n=new Date(),c=document.getElementById('edenAccessClock'),d=document.getElementById('edenAccessDate');
 if(c)c.textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
 if(d)d.textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
}
function initExecutiveAccessLogin_(){
 const u=document.getElementById('loginUsername'),p=document.getElementById('loginPassword'),b=document.getElementById('loginBtn'),t=document.getElementById('edenPasswordToggle');
 if(!u||!p||!b)return;
 [u,p].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin();}}));
 b.addEventListener('click',doLogin);
 t?.addEventListener('click',()=>{const show=p.type==='password';p.type=show?'text':'password';t.setAttribute('aria-label',show?'Hide password':'Show password');});
 updateEdenAccessClock_();setInterval(updateEdenAccessClock_,30000);setTimeout(()=>u.focus(),300);
}
function executiveLoginError_(msg){
 const s=document.getElementById('loginScreen'),e=document.getElementById('loginError'),r=document.getElementById('hiddenLoginReaction');
 if(e)e.textContent=msg||'Invalid username or password.';if(r)r.textContent='Access denied. Please verify your credentials.';
 s?.classList.remove('loginSuccess');s?.classList.add('loginWrong');setTimeout(()=>s?.classList.remove('loginWrong'),520);
}
function createEdenMagicParticles_(){const h=document.getElementById('edenMagicParticles');if(!h)return;h.innerHTML='';for(let i=0;i<30;i++){const q=document.createElement('i');q.className='edenMagicParticle';q.style.left=(12+Math.random()*76)+'%';q.style.top=(60+Math.random()*25)+'%';q.style.setProperty('--dur',(1.3+Math.random())+'s');q.style.setProperty('--delay',(Math.random()*1.2)+'s');q.style.setProperty('--x',(-45+Math.random()*90)+'px');h.appendChild(q);}}
function playEdenMagicTransition_(){return new Promise(resolve=>{if(EDEN_MAGIC_RUNNING){resolve();return;}EDEN_MAGIC_RUNNING=true;const o=document.getElementById('edenMagicTransition');if(!o){EDEN_MAGIC_RUNNING=false;resolve();return;}document.getElementById('loginScreen')?.classList.add('hidden');createEdenMagicParticles_();o.classList.remove('hidden','magicLeaving');void o.offsetWidth;o.classList.add('magicActive');setTimeout(()=>o.classList.add('magicLeaving'),4600);setTimeout(()=>{o.classList.remove('magicActive','magicLeaving');o.classList.add('hidden');EDEN_MAGIC_RUNNING=false;resolve();},5100);});}
function initLogin(){
 if(AUTH_TOKEN&&AUTH_USER){LOGIN_PENDING_USER=AUTH_USER;loadDashboard();return;}
 document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('appRoot').classList.add('hidden');
}
function doLogin(){
 const username=document.getElementById('loginUsername')?.value.trim()||'',password=document.getElementById('loginPassword')?.value.trim()||'',err=document.getElementById('loginError'),r=document.getElementById('hiddenLoginReaction'),btn=document.getElementById('loginBtn');
 if(err)err.textContent='';if(r)r.textContent='';
 if(!username||!password){executiveLoginError_(!username&&!password?'Username and password are required.':(!username?'Username is required.':'Password is required.'));return;}
 if(btn){btn.disabled=true;const s=btn.querySelector('span');if(s)s.textContent='AUTHENTICATING...';}
 google.script.run.withSuccessHandler(res=>{
  if(btn){btn.disabled=false;const s=btn.querySelector('span');if(s)s.textContent='ACCESS DASHBOARD';}
  if(!res||!res.success){executiveLoginError_((res&&res.message)||'Invalid username or password.');return;}
  AUTH_TOKEN=res.token;AUTH_USER=res.user;sessionStorage.setItem('EDEN_AUTH_TOKEN',AUTH_TOKEN);sessionStorage.setItem('EDEN_AUTH_USER',JSON.stringify(AUTH_USER));LOGIN_PENDING_USER=AUTH_USER;
  document.getElementById('loginScreen')?.classList.add('loginSuccess');if(r)r.textContent='Access granted. Preparing your workspace…';
  setTimeout(()=>playEdenMagicTransition_().then(()=>loadDashboard()),420);
 }).withFailureHandler(e=>{if(btn){btn.disabled=false;const s=btn.querySelector('span');if(s)s.textContent='ACCESS DASHBOARD';}executiveLoginError_(e?.message||String(e));}).loginUser(username,password);
}

function exportSafeText_(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');

function brokerExportDealRows_(rows){

    brokerageCompany:String(r.brokerageCompany||''),

function brokerExportSalesKpis_(scopeRows,displayRows){
  const scope=scopeRows||[];
  const rows=displayRows||[];

  const egpRows=rows.filter(r=>projectCurrency_(r)==='EGP');
  const usdRows=rows.filter(r=>projectCurrency_(r)==='USD');

  const companyRank={};
  rows.forEach(r=>{
    const name=String(r.brokerageCompany||'').trim();
    if(name)companyRank[name]=(companyRank[name]||0)+1;
  });
  const topCompany=Object.entries(companyRank)
    .sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];

  const cancelled=scope.filter(r=>String(r.status||'').trim().toLowerCase()==='cancel').length;
  const cancelRate=scope.length?(cancelled/scope.length)*100:0;

  return [
    ['Broker Companies', new Set(rows.map(r=>String(r.brokerageCompany||'').trim()).filter(Boolean)).size.toLocaleString('en-US')],
    ['Broker Deals', rows.length.toLocaleString('en-US')],
    ['Sales Value EGP', `${money(sum(egpRows,'amount'))} EGP`],
    ['Sales Value USD', `${money(sum(usdRows,'amount'))} USD`],
    ['Top Broker Company', topCompany ? `${topCompany[0]} • ${topCompany[1]} Deals` : '—'],
    ['Cancel Rate', `${cancelRate.toFixed(1)}%`]
  ];
}

function brokerPerformanceCompanyRows_(allRows){
  const rows=allRows||[];
  const explicitStatus=brokerLiveGet_('bpStatus').length>0;
  const groups=by(rows,'brokerageCompany');

  const data=Object.keys(groups).map(name=>{
    const all=groups[name];
    const valid=explicitStatus
      ? all
      : all.filter(r=>String(r.status||'').trim().toLowerCase()!=='cancel');
    const egp=valid.filter(r=>projectCurrency_(r)==='EGP');
    const usd=valid.filter(r=>projectCurrency_(r)==='USD');
    const cancelled=all.filter(r=>String(r.status||'').trim().toLowerCase()==='cancel').length;
    const valueEGP=sum(egp,'amount');
    const valueUSD=sum(usd,'amount');

    return {
      name,
      deals:valid.length,
      valueEGP,
      valueUSD,
      avgEGP:egp.length?valueEGP/egp.length:0,
      cancelRate:all.length?cancelled/all.length*100:0,
      topProject:brokerTopValue_(valid,'project'),
      topBCSales:brokerTopValue_(valid,'bcSales'),
      bcManager:brokerTopValue_(valid,'bcManager'),
      lastDeal:brokerLastDeal_(valid.length?valid:all)
    };
  });

  const sort=document.getElementById('brokerCenterSort')?.value||'valueEGP';
  data.sort((a,b)=>(b[sort]||0)-(a[sort]||0)||b.deals-a.deals||a.name.localeCompare(b.name));
  return data;
}

function brokerPerformanceExportDataset_(){
  const allRows=brokerPerformanceRows_();
  const salesRows=brokerMetricRows_(allRows,'bpStatus');
  const cancelledRows=allRows.filter(r=>String(r.status||'').trim().toLowerCase()==='cancel');
  const egpRows=salesRows.filter(r=>projectCurrency_(r)==='EGP');
  const usdRows=salesRows.filter(r=>projectCurrency_(r)==='USD');

  const companiesAll=new Set(allRows.map(r=>String(r.brokerageCompany||'').trim()).filter(Boolean));
  const activeCompanies=new Set(salesRows.map(r=>String(r.brokerageCompany||'').trim()).filter(Boolean));
  const egpValue=sum(egpRows,'amount');
  const usdValue=sum(usdRows,'amount');
  const avgEgp=egpRows.length?egpValue/egpRows.length:0;
  const cancelRate=allRows.length?cancelledRows.length/allRows.length*100:0;

  const companyRows=brokerPerformanceCompanyRows_(allRows).map((x,i)=>({
    rank:i+1,
    brokerageCompany:x.name,
    deals:x.deals,
    salesValueEGP:x.valueEGP?`EGP ${money(x.valueEGP)}`:'EGP 0',
    salesValueUSD:x.valueUSD?`USD ${money(x.valueUSD)}`:'—',
    avgDealEGP:x.avgEGP?`EGP ${money(x.avgEGP)}`:'—',
    cancelRate:`${x.cancelRate.toFixed(1)}%`,
    topProject:x.topProject,
    topBCSales:x.topBCSales,
    bcManager:x.bcManager,
    lastDeal:x.lastDeal
  }));

  return {
    title:'EDEN BI — Broker Performance Report',
    filename:'EDEN_Broker_Performance',
    rows:companyRows,
    headers:[
      '#','Brokerage Company','Deals','Sales Value EGP','Sales Value USD',
      'Avg Deal EGP','Cancel Rate','Top Project','Top BC Sales','BC Manager','Last Deal'
    ],
    keys:[
      'rank','brokerageCompany','deals','salesValueEGP','salesValueUSD',
      'avgDealEGP','cancelRate','topProject','topBCSales','bcManager','lastDeal'
    ],
    kpis:[
      ['Total Companies',companiesAll.size.toLocaleString('en-US')],
      ['Active Companies',activeCompanies.size.toLocaleString('en-US')],
      ['Broker Deals',salesRows.length.toLocaleString('en-US')],
      ['Sales Value EGP',money(egpValue)],
      ['Sales Value USD',money(usdValue)],
      ['Avg Deal EGP',money(avgEgp)],
      ['Cancel Rate',`${cancelRate.toFixed(1)}%`]
    ]
  };
}

function brokerExportDataset_(){
  const dealHeaders=[
    'Brokerage Company','Project','Unit Code','Status',
    'Eden Sales','Sales Manager','BC Sales','BC Manager',
    'Final Price','Currency','Date'
  ];
  const dealKeys=[
    'brokerageCompany','project','unitCode','status',
    'salesName','salesManager','bcSales','bcManager',
    'amount','currency','date'
  ];

  if(currentView==='brokerPerformance'){
    return brokerPerformanceExportDataset_();
  }

  if(currentView==='brokerOverview'){
    const scope=brokerOverviewRows_();
    const rows=brokerMetricRows_(scope,'boStatus');
    return {
      title:'EDEN BI — Broker Overview Export',
      filename:'EDEN_Broker_Overview',
      rows:brokerExportDealRows_(rows),
      headers:dealHeaders,
      keys:dealKeys,
      kpis:brokerExportSalesKpis_(scope,rows)
    };
  }

  if(currentView==='brokerCompanyDetail'){
    const scope=brokerCompanyDealRows_(BROKER_COMPANY_DETAIL_NAME);
    const rows=scope.filter(r=>String(r.status||'').trim().toLowerCase()!=='cancel');
    return {
      title:`EDEN BI — ${BROKER_COMPANY_DETAIL_NAME||'Broker Company'} Export`,
      filename:`EDEN_Broker_${String(BROKER_COMPANY_DETAIL_NAME||'Company').replace(/[^a-z0-9\u0600-\u06ff]+/gi,'_')}`,
      rows:brokerExportDealRows_(scope),
      headers:dealHeaders,
      keys:dealKeys,
      kpis:brokerExportSalesKpis_(scope,rows)

/* ===== Fast start =====
   The last dashboard data is kept in this browser (IndexedDB) for the
   signed-in user. On the next visit it is shown at once while fresh data
   loads in the background; it is wiped on logout. */
function edenDataKey_(){const u=AUTH_USER||{};return 'v1:'+String(u.username||u.name||'').toLowerCase()+':'+String(u.role||'').toLowerCase();}
function edenDataDb_(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('no idb'));return;}
    const req=indexedDB.open(EDEN_DATA_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(EDEN_DATA_STORE);
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
function edenDataGet_(key){
  return edenDataDb_().then(db=>new Promise(res=>{
    const r=db.transaction(EDEN_DATA_STORE,'readonly').objectStore(EDEN_DATA_STORE).get(key);
    r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);
  })).catch(()=>null);
}
function edenDataPut_(key,data){
  return edenDataDb_().then(db=>new Promise(res=>{
    const tx=db.transaction(EDEN_DATA_STORE,'readwrite');
    tx.objectStore(EDEN_DATA_STORE).clear();          // one user's data at a time
    tx.objectStore(EDEN_DATA_STORE).put({at:Date.now(),data},key);
    tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);
  })).catch(()=>false);
}
function edenDataClear_(){
  return edenDataDb_().then(db=>new Promise(res=>{
    const tx=db.transaction(EDEN_DATA_STORE,'readwrite');tx.objectStore(EDEN_DATA_STORE).clear();
    tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);
  })).catch(()=>false);
}
function edenSetDataState_(state,text){
  const live=document.querySelector('.dsLive span');
  document.body.classList.toggle('dsDataUpdating',state==='updating');
  if(live)live.textContent=text||(state==='updating'?'Updating…':'Live Data');
}
/* Swap in fresh data without resetting the user's filters or page. */
function edenSoftUpdate_(data){
  const prevOptions=JSON.stringify(EDEN_LAST_OPTIONS||null),nextOptions=JSON.stringify(data.options||{});
  DASHBOARD_ACCESS=data.access||null;
  rawRows=(data.rows||[]).map(repairTransactionClientFields_);
  brokerRows=(data.brokers&&data.brokers.rows)||[];
  brokerAvailableFields=(data.brokers&&data.brokers.availableFields)||{};
  if(prevOptions!==nextOptions){
    const checked=[...document.querySelectorAll('section.filters input[type="checkbox"]:checked')].map(b=>[b.name,String(b.value)]);
    fillFilters(data.options||{});
    bindMultiControls();
    checked.forEach(([n,v])=>{const b=[...document.querySelectorAll(`input[name="${n}"]`)].find(x=>String(x.value)===v);if(b)b.checked=true;});
    if(typeof updateMultiLabels==='function')updateMultiLabels();
  }
  EDEN_LAST_OPTIONS=data.options||{};
  if(typeof initSalesCurveFilters_==='function')initSalesCurveFilters_();
  applyFilters();
}

function loadDashboard(isSessionRestore=false,opts={}){
  // One request at a time (boot used to start two identical loads).
  if(EDEN_LOADING&&!opts.fresh)return;
  EDEN_LOADING=true;
  const key=edenDataKey_();
  let fromCache=false,freshDone=false;
  if(!EDEN_BOOT_COMPLETE)document.getElementById('loader').classList.remove('hidden');
  else edenSetDataState_('updating');

  // 1) Show the last saved data straight away (repeat visits).
  if(!EDEN_BOOT_COMPLETE&&!opts.fresh){
    edenDataGet_(key).then(saved=>{
      if(!saved||freshDone||EDEN_BOOT_COMPLETE)return;
      try{
        init(saved.data);EDEN_LAST_OPTIONS=saved.data.options||{};
        EDEN_BOOT_COMPLETE=true;fromCache=true;
        showAppAfterLogin(LOGIN_PENDING_USER||AUTH_USER);
        edenSetDataState_('updating');
      }catch(e){console.warn('Saved data could not be shown',e);}
      finally{document.getElementById('loader').classList.add('hidden');}
    });
  }

  // 2) Load fresh data.
  google.script.run
    .withSuccessHandler(data=>{
      freshDone=true;EDEN_LOADING=false;
      try{
        if(EDEN_BOOT_COMPLETE){
          edenSoftUpdate_(data);
        }else{
          init(data);EDEN_LAST_OPTIONS=data.options||{};
          EDEN_BOOT_COMPLETE=true;
          showAppAfterLogin(LOGIN_PENDING_USER||AUTH_USER);
        }
        LOGIN_PENDING_USER=null;
        edenSetDataState_('live');EDEN_DATA_RETRY_=0;EDEN_DATA_AT_=String((data&&data.dataVersion)||EDEN_DATA_AT_||'');
        edenDataPut_(key,data);
      }catch(error){
        console.error('Dashboard initialization failed:',error);
        if(!fromCache)alert(error.message||String(error));
      }finally{
        document.getElementById('loader').classList.add('hidden');
      }
    })
    .withFailureHandler(error=>{
      freshDone=true;EDEN_LOADING=false;
      document.getElementById('loader')?.classList.add('hidden');
      const message=error?.message||String(error);
      console.error('Dashboard loading failed:',error);
      const sessionGone=/session|login|access denied/i.test(message);

      if(isSessionRestore||sessionGone){
        // Stored session is no longer valid: clear it and show login cleanly.
        AUTH_TOKEN='';
        AUTH_USER=null;
        LOGIN_PENDING_USER=null;
        sessionStorage.removeItem('EDEN_AUTH_TOKEN');
        sessionStorage.removeItem('EDEN_AUTH_USER');
        edenDataClear_();
        EDEN_BOOT_COMPLETE=false;
        document.getElementById('appRoot')?.classList.add('hidden');
        edenBootShowLogin_();
        const err=document.getElementById('loginError');
        if(err)err.textContent='Your session has expired. Please sign in again.';
        return;
      }
      if(fromCache||EDEN_BOOT_COMPLETE){
        edenSetDataState_('live','Offline copy');
        // Try again on our own a few times so the copy is replaced as soon as the server answers.
        EDEN_DATA_RETRY_=(EDEN_DATA_RETRY_||0)+1;
        if(EDEN_DATA_RETRY_<=3)setTimeout(()=>{if(!EDEN_LOADING&&AUTH_TOKEN)loadDashboard(false,{});},15000*EDEN_DATA_RETRY_);
        return;
      }
      alert(message);
    })
    .getDashboardData(AUTH_TOKEN,{fresh:!!opts.fresh});
}

function normalizePhoneDigits_(value){
  return String(value||'')
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}

function splitClientPhones_(value){
  const normalized=normalizePhoneDigits_(value);
  const parts=normalized
    .split(/[\n\r,;|/]+/)
    .map(part=>part.replace(/\D/g,''))
    .filter(Boolean);

  if(!parts.length){
    const digits=normalized.replace(/\D/g,'');
    if(digits)parts.push(digits);
  }
  return parts;
}

function looksLikePhone_(value){
  const phones=splitClientPhones_(value);
  return phones.some(p=>p.length>=8);
}

function isEgyptianPhone_(digits){
  let phone=String(digits||'').replace(/\D/g,'');
  if(phone.startsWith('0020'))phone=phone.slice(2);
  if(/^01[0125]\d{8}$/.test(phone))return true;
  if(/^201[0125]\d{8}$/.test(phone))return true;
  return false;
}

function classifyClientTypeFromMobile_(mobile){
  const phones=splitClientPhones_(mobile);
  if(!phones.length)return 'Overseas';

  const hasEgyptian=phones.some(isEgyptianPhone_);
  const hasForeign=phones.some(phone=>!isEgyptianPhone_(phone));

  if(hasForeign)return 'Overseas';
  return hasEgyptian?'Internal':'Overseas';
}

function transactionUnitType_(row){
  const r=row||{};
  const candidates=[
    r.unitType,
    r['Unit Type'],
    r.unit_type,
    r.unitTypeName,
    r.type,
    r.unitCategory,
    r['Unit Category']
  ];
  for(const value of candidates){
    const text=String(value??'').trim();
    if(text && text.toLowerCase()!=='not classified') return text;
  }
  return '';
}

function repairTransactionClientFields_(row){
  const r={...row};
  const value=String(r.clientType||'').trim();
  const key=value.toLowerCase();
  if(key==='internal') r.clientType='Internal';
  else if(key==='overseas') r.clientType='Overseas';
  else r.clientType=value;

  // Keep one canonical Unit Type field for filters, tables and charts.
  r.unitType=transactionUnitType_(r);
  return r;
}

function branchDisplayLabel_(value){

  const key=raw.toUpperCase().replace(/\s+/g,' ');

  if(key==='KSA - JEDDAH BRANCH') return 'KSA - Jeddah';
  if(key==='KSA - RIYADH BRANCH') return 'KSA - Riyadh';
  if(key==='EGY - HEADQUARTER') return 'EGY - Headquarters';
  if(key==='EGY - AL-REHAB BRANCH'||key==='EGY - AL-REHAB') return 'EGY - Al-Rehab';

  return raw
    .replace(/\s+BRANCH$/i,'')
    .replace(/\s+/g,' ')
    .trim();
}

function transactionBranchOptions_(){
  const seen=new Map();

  (rawRows||[]).forEach(row=>{
    const value=String(row?.branch||'').trim();
    if(!value || value.toLowerCase()==='not assigned') return;

    const key=value.toUpperCase().replace(/\s+/g,' ');
    if(!seen.has(key)){
      seen.set(key,{
        value,
        label:branchDisplayLabel_(value)
      });
    }
  });

  return [...seen.values()].sort((a,b)=>
    String(a.label).localeCompare(String(b.label),undefined,{
      numeric:true,
      sensitivity:'base'
    })
  );
}

function normalizeFilterSearch_(value){
  return String(value||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\u0600-\u06ff]+/g,' ')
    .trim();
}

function filterMultiOptions(containerId,query,inputEl){
  const container=document.getElementById(containerId);
  if(!container)return;

  const search=normalizeFilterSearch_(query);
  const rows=Array.from(container.querySelectorAll('.checkRow'));

  let visibleRows=[];
  rows.forEach(row=>{
    const label=String(row.querySelector('span')?.textContent||row.innerText||'').trim();
    const text=normalizeFilterSearch_(label);
    const words=text.split(/\s+/).filter(Boolean);

    // Smart matching:
    // exact contains + starts-with on any word.
    const matched=!search || text.includes(search) || words.some(w=>w.startsWith(search));
    row.classList.toggle('edenSearchHidden',!matched);
    if(matched)visibleRows.push({row,label,text});
  });

  // Predictive autocomplete: prefer a result beginning with what the user typed,
  // then fall back to the first smart match.
  if(inputEl){
    let suggestion=inputEl.parentElement?.querySelector('.edenFilterSuggestion');
    if(!suggestion){
      suggestion=document.createElement('button');
      suggestion.type='button';
      suggestion.className='edenFilterSuggestion';
      suggestion.hidden=true;
      inputEl.insertAdjacentElement('afterend',suggestion);
    }

    const prediction=search
      ? (visibleRows.find(x=>x.text.startsWith(search)) || visibleRows[0])
      : null;

    if(prediction && normalizeFilterSearch_(prediction.label)!==search){
      suggestion.hidden=false;
      suggestion.dataset.value=prediction.label;
      suggestion.innerHTML=`<span>Suggested</span><b>${prediction.label}</b><small>Tab ↹</small>`;
    }else{
      suggestion.hidden=true;
      suggestion.dataset.value='';
    }

    if(!inputEl.dataset.smartFilterBound){
      inputEl.dataset.smartFilterBound='1';

      inputEl.addEventListener('keydown',e=>{
        const sug=inputEl.parentElement?.querySelector('.edenFilterSuggestion');
        if(e.key==='Tab' && sug && !sug.hidden && sug.dataset.value){
          e.preventDefault();
          inputEl.value=sug.dataset.value;
          filterMultiOptions(containerId,inputEl.value,inputEl);
          inputEl.focus();
        }
        if(e.key==='Enter'){
          const first=Array.from(container.querySelectorAll('.checkRow:not(.edenSearchHidden)'))[0];
          const cb=first?.querySelector('input[type="checkbox"]');
          if(cb){
            e.preventDefault();
            cb.click();
          }
        }
      });

      const sug=inputEl.parentElement?.querySelector('.edenFilterSuggestion');
      if(sug){
        sug.addEventListener('click',()=>{
          if(!sug.dataset.value)return;
          inputEl.value=sug.dataset.value;
          filterMultiOptions(containerId,inputEl.value,inputEl);
          inputEl.focus();
        });
      }
    }
  }
}
function setChecks(containerId,arr=[],name){
  const el=document.getElementById(containerId);
  if(!el)return;

  // Add a search field automatically to every standard multi-select filter.
  // Inventory dropdowns already have their own dedicated search boxes.
  if(!String(name).startsWith('inventory')){
    const panel=el.closest('.multiPanel');
    if(panel&&!panel.querySelector('.multiSearchWrap')){
      const searchWrap=document.createElement('div');
      searchWrap.className='multiSearchWrap';
      searchWrap.innerHTML=`
        <input
          type="text"
          class="multiSearchInput"
          placeholder="Search options..."
          aria-label="Search filter options"
        >`;

      const actions=panel.querySelector('.multiActions');
      if(actions)actions.insertAdjacentElement('afterend',searchWrap);
      else panel.insertBefore(searchWrap,panel.firstChild);

      const searchInput=searchWrap.querySelector('.multiSearchInput');
      searchInput.addEventListener('input',()=>{
        filterMultiOptions(containerId,searchInput.value,searchInput);
      });
    }
  }

  el.innerHTML=arr.map(x=>`
    <label class="checkRow">
      <input type="checkbox" name="${name}" value="${x.value}" data-label="${x.label}">
      <span>${x.label}</span>
    </label>`).join('');

  // Bind smart/predictive search to both existing HTML search boxes and auto-created ones.
  const smartSearchInput=el.closest('.multiPanel')?.querySelector('.multiSearchInput');
  if(smartSearchInput && !smartSearchInput.dataset.edenSmartInputBound){
    smartSearchInput.dataset.edenSmartInputBound='1';
    smartSearchInput.addEventListener('input',()=>{
      filterMultiOptions(containerId,smartSearchInput.value,smartSearchInput);
    });
  }

  el.querySelectorAll('.checkRow').forEach(row=>{
    row.dataset.edenRowClick='1';
    row.addEventListener('click',e=>{
      if(e.target && e.target.matches('input[type="checkbox"]'))return;
      const cb=row.querySelector('input[type="checkbox"]');
      if(cb){ e.preventDefault(); cb.click(); }
    });
  });

  el.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
    if(name==='project')refreshUnitTypeFilter();
    if(name==='salesManager')refreshSalesFilterByManager_();

    if(String(name).startsWith('inventory')){
      updateInventoryMultiLabels();
      applyInventoryFilters();
    }else{
      updateMultiLabels();
      applyFilters();
    }
  }));
}

function resolveTrendDimension_(){
  const selected=document.getElementById('trendCompareBy')?.value||'auto';
  if(selected!=='auto')return selected;

  const priorities=[
    ['branch','branch'],
    ['sales','salesName'],
    ['salesManager','salesManager'],
    ['project','project'],
    ['status','status'],
    ['unitCategory','unitType'],
    ['mainSource','mainSource'],
    ['sourceType','sourceType'],
    ['campaignName','campaignName'],
    ['mediaBuyer','mediaBuyer']
  ];

  if(matched)return matched[1];

function trendDateParts_(row){
  let year=Number(row.year)||0;
  let month=Number(row.month)||0;
  let day=Number(row.day)||1;

  if(year&&month){
    return {year,month,day:day||1};
  }

  const raw=row.date||row.transactionDate||row.reservationDate||'';
  const parsed=raw instanceof Date?raw:new Date(raw);

  if(!isNaN(parsed.getTime())){
    return {
      year:parsed.getFullYear(),
      month:parsed.getMonth()+1,
      day:parsed.getDate()
    };
  }

  const yearMonth=String(row.yearMonth||'');
  const match=yearMonth.match(/((?:19|20)\d{2})\D+(\d{1,2})/);
  if(match){
    return {year:Number(match[1]),month:Number(match[2]),day:1};
  }

  return null;
}

function trendPeriodKey_(row,period){
  const parts=trendDateParts_(row);
  if(!parts)return null;

  if(period==='year'){
    return {
      key:String(parts.year),
      label:String(parts.year),
      sort:parts.year*100
    };
  }

  if(period==='quarter'){
    const quarter=Math.ceil(parts.month/3);
    return {
      key:`${parts.year}-Q${quarter}`,
      label:`Q${quarter} ${parts.year}`,
      sort:parts.year*10+quarter
    };
  }

  const month=String(parts.month).padStart(2,'0');
  const label=new Date(parts.year,parts.month-1,1)
    .toLocaleString('en-US',{month:'short',year:'numeric'});

  return {
    key:`${parts.year}-${month}`,
    label,
    sort:parts.year*100+parts.month
  };
}

function trendMetricValue_(row,metric){
  if(metric==='count')return 1;
  if(metric==='area')return Number(row.area)||0;
  if(metric==='units')return row.unitCode?1:0;
  if(metric==='valueEGP'){
    return projectCurrency_(row)==='EGP'?(Number(row.amount)||0):0;
  }
  if(metric==='valueUSD'){
    return projectCurrency_(row)==='USD'?(Number(row.amount)||0):0;
  }
  return 0;
}

function hexToRgba_(color,alpha){
  if(!color)return `rgba(101,174,232,${alpha})`;

  if(color.startsWith('rgb')){
    const nums=color.match(/[\d.]+/g)||[];
    return `rgba(${nums[0]||101},${nums[1]||174},${nums[2]||232},${alpha})`;
  }

  let hex=color.replace('#','').trim();
  if(hex.length===3)hex=hex.split('').map(x=>x+x).join('');
  if(!/^[0-9a-f]{6}$/i.test(hex))return color;

  const n=parseInt(hex,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}

function teamSummary_(rows,manager){
  const key=normalizeSalesKey_(manager);
  const teamRows=rows.filter(r=>normalizeSalesKey_(r.salesManager)===key);

  let valueEGP=0,valueUSD=0,meters=0,units=0,egpDeals=0,usdDeals=0;
  const clients=new Set();
  const salesMembers=new Set();

  teamRows.forEach(r=>{
    const amount=Number(r.amount)||0;
    if(projectCurrency_(r)==='USD'){
      valueUSD+=amount;
      usdDeals++;
    }else{
      valueEGP+=amount;
      egpDeals++;
    }

    meters+=Number(r.area)||0;
    if(r.unitCode)units++;

    const client=String(r.clientKey||r.clientName||'').trim();
    if(client)clients.add(client);

    const sales=String(r.salesName||'').trim();
    if(sales && sales.toLowerCase()!=='not assigned')salesMembers.add(sales);
  });

  return {
    manager,
    rows:teamRows,
    deals:teamRows.length,
    units,
    clients:clients.size,
    salesMembers:salesMembers.size,
    meters,
    valueEGP,
    valueUSD,
    avgDealEGP:egpDeals?valueEGP/egpDeals:0,
    avgDealUSD:usdDeals?valueUSD/usdDeals:0
  };
}

function renderTrendChart(){

  const dimension=resolveTrendDimension_();
  const metric=document.getElementById('trendMetric')?.value||'count';
  const period=document.getElementById('trendPeriod')?.value||'month';

  const grouped={};

  rows.forEach(row=>{

    const series=String(row[dimension]||'Not Assigned').trim()||'Not Assigned';
    const value=trendMetricValue_(row,metric);

    periods.set(periodInfo.key,periodInfo);

    if(!grouped[series])grouped[series]={};
    grouped[series][periodInfo.key]=(grouped[series][periodInfo.key]||0)+value;
  });

  const orderedPeriods=[...periods.values()].sort((a,b)=>a.sort-b.sort);
  const labels=orderedPeriods.map(p=>p.label);

  const rankedSeries=Object.keys(grouped)
    .map(name=>({
      name,
      total:Object.values(grouped[name]).reduce((a,b)=>a+b,0)
    }))
    .sort((a,b)=>b.total-a.total)
    .slice(0,12);

  const palette=trendPalette_();
  const datasets=rankedSeries.map((entry,index)=>{
    const color=palette[index%palette.length];

    return {
      label:entry.name,
      data:orderedPeriods.map(p=>grouped[entry.name][p.key]||0),
      borderColor:color,
      backgroundColor:hexToRgba_(color,.12),
      pointBackgroundColor:color,
      pointBorderColor:color,
      pointRadius:3,
      pointHoverRadius:6,
      borderWidth:3,
      tension:.35,
      fill:false
    };
  });

  destroyTrendChart_();

function targetContext_(){
  const selectedYears=getMulti('year');
  const selectedMonths=getMulti('month');
  const rows=statusScopeRows();
  const years=rows.map(r=>Number(r.year)).filter(Boolean);
  const year=selectedYears.length===1?Number(selectedYears[0]):(years.length?Math.max(...years):new Date().getFullYear());

  if(selectedMonths.length===1){
    return {period:'Monthly',year,month:String(selectedMonths[0]),quarter:''};
  }

  const qMap={
    'Q1':['1','2','3','jan','january','feb','february','mar','march'],
    'Q2':['4','5','6','apr','april','may','jun','june'],
    'Q3':['7','8','9','jul','july','aug','august','sep','september'],
    'Q4':['10','11','12','oct','october','nov','november','dec','december']
  };

  if(selectedMonths.length===3){
    const norm=selectedMonths.map(x=>String(x).trim().toLowerCase());
    for(const [q,vals] of Object.entries(qMap)){
      const hits=norm.filter(m=>vals.includes(m)).length;
      if(hits===3)return {period:'Quarterly',year,month:'',quarter:q};
    }
  }

  return {period:'Yearly',year,month:'',quarter:''};
}

function targetValue_(scope,name,currency='EGP'){
  const ctx=targetContext_();
  const scopeKey=String(scope||'').trim().toLowerCase();
  const nameKey=String(name||'').trim().toLowerCase();
  const amountKey=String(currency).toUpperCase()==='USD'?'targetUSD':'targetEGP';

  const rows=TARGETS_DATA.filter(t=>
    String(t.scope||'').trim().toLowerCase()===scopeKey &&
    String(t.name||'').trim().toLowerCase()===nameKey &&
    Number(t.year)===Number(ctx.year)
  );

  const exact=rows.filter(t=>{
    const p=String(t.period||'Yearly').trim().toLowerCase();
    if(ctx.period==='Monthly')return p==='monthly' && String(t.month||'').trim().toLowerCase()===String(ctx.month||'').trim().toLowerCase();
    if(ctx.period==='Quarterly')return p==='quarterly' && String(t.quarter||'').trim().toUpperCase()===ctx.quarter;
    return p==='yearly';
  });

  if(exact.length)return exact.reduce((a,t)=>a+(Number(t[amountKey])||0),0);

  if(ctx.period==='Yearly'){
    const quarterly=rows.filter(t=>String(t.period||'').toLowerCase()==='quarterly');
    if(quarterly.length)return quarterly.reduce((a,t)=>a+(Number(t[amountKey])||0),0);
    const monthly=rows.filter(t=>String(t.period||'').toLowerCase()==='monthly');
    if(monthly.length)return monthly.reduce((a,t)=>a+(Number(t[amountKey])||0),0);
  }

  return 0;
}

function compactMoney_(value,currency='EGP'){
  const n=Number(value)||0;
  const compact=new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(n);
  return `${compact} ${currency}`;
}

function performancePercent_(achieved,target){
  return target>0?Math.max(0,(Number(achieved)||0)/Number(target)*100):0;
}

function performanceRows_(){
  return statusScopeRows().filter(r=>String(r.status||'').trim().toLowerCase()!=='cancel');
}

function latestMonthGrowth_(){
  const valid=(rawRows||[]).filter(r=>String(r.status||'').trim().toLowerCase()!=='cancel' && projectCurrency_(r)==='EGP');
  const map=new Map();

  valid.forEach(r=>{
    const y=Number(r.year);
    let m=Number(r.month);
    if(!m){
      const text=String(r.month||'').trim().toLowerCase();
      const names=['january','february','march','april','may','june','july','august','september','october','november','december'];
      const short=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
      m=names.indexOf(text)+1;
      if(!m)m=short.indexOf(text)+1;
    }
    if(!y||!m)return;
    const key=y*100+m;
    map.set(key,(map.get(key)||0)+(Number(r.amount)||0));
  });

  const keys=[...map.keys()].sort((a,b)=>a-b);
  if(keys.length<2)return {growth:null,current:0,previous:0,label:'Not enough history'};
  const current=map.get(keys[keys.length-1])||0;
  const previous=map.get(keys[keys.length-2])||0;
  return {
    growth:previous?((current-previous)/previous*100):null,
    current,previous,
    label:`${keys[keys.length-2]} → ${keys[keys.length-1]}`
  };
}

function topByValue_(rows,key,currency='EGP'){
  const grouped={};
  rows.filter(r=>projectCurrency_(r)===currency).forEach(r=>{
    const name=String(r[key]||'Not Assigned').trim()||'Not Assigned';
    grouped[name]=(grouped[name]||0)+(Number(r.amount)||0);
  });
  return Object.entries(grouped).sort((a,b)=>b[1]-a[1])[0]||['-',0];
}

function executivePipeline_(rows){
  const wanted=['reservation','part of dp','total dp','client signed','company signed','delivered','closed'];
  const out={};
  rows.forEach(r=>{
    const s=String(r.status||'').trim().toLowerCase();
    if(wanted.includes(s))out[s]=(out[s]||0)+1;
  });
  return out;
}

function teamPerfRows_(manager,baseRows){
  const def=EDEN_TEAM_DEFINITIONS.find(d=>normalizeSalesKey_(d.manager)===normalizeSalesKey_(manager));
  if(!def)return [];
  const mk=normalizeSalesKey_(manager);
  const memberKeys=new Set((def.members||[]).map(normalizeSalesKey_));
  return baseRows.filter(r=>{
    const rowManager=normalizeSalesKey_(r.salesManager);
    const rowSales=normalizeSalesKey_(r.salesName);
    return def.manual?(rowManager===mk||memberKeys.has(rowSales)):rowManager===mk;
  });
}

function teamPerfRoster_(manager){
  const def=EDEN_TEAM_DEFINITIONS.find(d=>normalizeSalesKey_(d.manager)===normalizeSalesKey_(manager));
  if(!def)return [];
  if(def.members?.length)return [...def.members];
  const names=new Map();
  (rawRows||[]).forEach(r=>{
    if(normalizeSalesKey_(r.salesManager)!==normalizeSalesKey_(manager))return;
    const n=String(r.salesName||'').trim();
    if(n && n.toLowerCase()!=='not assigned')names.set(normalizeSalesKey_(n),n);
  });
  return [...names.values()].sort((a,b)=>a.localeCompare(b));
}

function teamPerformanceSummary_(manager,baseRows){
  const rows=teamPerfRows_(manager,baseRows);
  const egp=rows.filter(r=>projectCurrency_(r)==='EGP');
  const usd=rows.filter(r=>projectCurrency_(r)==='USD');
  const members=teamPerfRoster_(manager);
  const top=topByValue_(rows,'salesName','EGP');
  const targetEGP=targetValue_('Manager',manager,'EGP');
  const achievedEGP=sum(egp,'amount');
  return {
    manager,rows,members,
    deals:rows.length,
    clients:new Set(rows.map(r=>clientKeyOf(r)).filter(Boolean)).size,
    achievedEGP,
    achievedUSD:sum(usd,'amount'),
    targetEGP,
    pct:performancePercent_(achievedEGP,targetEGP),
    topSales:top[0],
    topSalesValue:top[1]
  };
}

  document.getElementById('dealEntryPanel')?.classList.toggle('hidden', !dealEntryView);
  document.getElementById('commissionsPanel')?.classList.toggle('hidden',!commissionsView);

  const salesCurvePanel=document.getElementById('salesCurvePanel');
  const transactionsModuleView=
    !isBrokerView() && !isAdminView() && !inventoryView &&
    !dealEntryView && !aiView && !settingsView;
  if(salesCurvePanel)salesCurvePanel.classList.toggle('hidden',!transactionsModuleView);

  document.getElementById('cards')?.classList.toggle(
    'hidden',
    isAdminView() || inventoryView || dealEntryView || aiView || settingsView ||
    commissionsView || brokerPerformanceView || brokerCompanyDetailView || brokerUtilityView
  );

  document.getElementById('chartsSection')?.classList.toggle(
    'hidden',
    isAdminView() || inventoryView || dealEntryView || aiView || settingsView ||
    commissionsView || brokerPerformanceView || brokerCompanyDetailView || brokerUtilityView
  );

  if(transactionTableBox){
    transactionTableBox.classList.toggle(
      'hidden',
      isAdminView() || inventoryView || dealEntryView || aiView || settingsView ||
      commissionsView || brokerPerformanceView || brokerCompanyDetailView || brokerUtilityView
    );
  }

  const newClientsYearSection=document.getElementById('newClientsYearSection');
  if(newClientsYearSection)newClientsYearSection.classList.toggle('hidden',currentView!=='clients');

  const trendAnalysisSection=document.getElementById('trendAnalysisSection');
  if(trendAnalysisSection)trendAnalysisSection.classList.toggle('hidden',!transactionView_());

  if(!isBrokerView())renderPerformanceSuite_();

  if(inventoryView){destroyCharts();destroyTrendChart_();return;}
  if(dealEntryView){destroyCharts();destroyTrendChart_();return;}
  if(aiView){destroyCharts();destroyTrendChart_();renderAiPanel();return;}
  if(settingsView){destroyCharts();destroyTrendChart_();renderSettingsView();return;}
  if(isAdminView()){destroyCharts();destroyTrendChart_();renderUsersPanel();return;}

  if(isBrokerView()){
    destroyTrendChart_();

    // Hard isolation: generic Transactions surfaces never belong inside BROKERS.
    document.getElementById('cards')?.classList.add('hidden');
    document.getElementById('salesCurvePanel')?.classList.add('hidden');
    document.getElementById('chartsSection')?.classList.add('hidden');
    document.getElementById('transactionTableBox')?.classList.add('hidden');
    document.getElementById('newClientsYearSection')?.classList.add('hidden');

    if(brokerCompanyDetailView){
      destroyCharts();
      destroyBrokerPerformanceCharts_();
      renderBrokerCompanyDetails_();
      return;
    }

    if(brokerPerformanceView){
      destroyCharts();
      renderBrokerPerformanceCenter_();
      return;
    }

    if(brokerUtilityView){
      destroyCharts();
      destroyBrokerPerformanceCharts_();

      if(brokerOverviewSalesMode){
        document.getElementById('cards')?.classList.add('hidden');
        document.getElementById('salesCurvePanel')?.classList.add('hidden');
        document.getElementById('chartsSection')?.classList.add('hidden');
        document.getElementById('transactionTableBox')?.classList.add('hidden');
        document.getElementById('brokerFilters')?.classList.add('hidden');
      }

      renderBrokerUtilityView_();
      return;
    }

    // Every BROKERS page is now isolated from Transactions.
    destroyCharts();
    destroyBrokerPerformanceCharts_();
    destroyBrokerOverviewCharts_();
    return;
  }

  if(isDataHealthView()){
    destroyTrendChart_();
    document.getElementById('chartsSection')?.classList.remove('hidden');
    renderDataHealthCards();
    renderDataHealthCharts();
    renderDataHealthTable();
    return;
  }

  if(commissionsView){
    destroyCharts();
    destroyTrendChart_();
    renderCommissions_();
    return;
  }

  renderCards();
  if(currentView==='clients'){
    document.getElementById('chartsSection')?.classList.remove('hidden');
    renderNationalityCharts_();
  }else{
    document.getElementById('chartsSection')?.classList.remove('hidden');
    renderCharts();
  }
  renderTable();
  renderTrendChart();
  renderTeamComparison();
}

function nationalitySummary_(){
  const rows=statusScopeRows().filter(r=>String(r.nationality||'').trim());
  const groups={};

  rows.forEach(r=>{
    const nationality=String(r.nationality||'').trim();
    const key=nationality.toLowerCase();

    if(!groups[key]){
      groups[key]={
        nationality,
        clientKeys:new Set(),
        deals:0,
        units:0,
        valueEGP:0,
        valueUSD:0
      };
    }

    const g=groups[key];
    const clientKey=clientKeyOf(r);
    if(clientKey)g.clientKeys.add(clientKey);

    g.deals++;
    if(r.unitCode)g.units++;

    if(projectCurrency_(r)==='USD')g.valueUSD+=Number(r.amount)||0;
    else g.valueEGP+=Number(r.amount)||0;
  });

  return Object.values(groups).map(g=>({
    nationality:g.nationality,
    clients:g.clientKeys.size,
    deals:g.deals,
    units:g.units,
    valueEGP:g.valueEGP,
    valueUSD:g.valueUSD
  }));
}

function downPaymentSummary_(rows){
  const result={
    egp:{actualDP:0,dpPaid:0,actualPaid:0,remain:0},
    usd:{actualDP:0,dpPaid:0,actualPaid:0,remain:0}
  };

  (rows||[]).forEach(r=>{
    const bucket=projectCurrency_(r)==='USD' ? result.usd : result.egp;

    // Values are read directly from Transactions headers:
    // Actual DP | DP Paid | Actual Paid | Remain
    bucket.actualDP += Number(r.actualDP)||0;
    bucket.dpPaid += Number(r.dpPaid)||0;
    bucket.actualPaid += Number(r.actualPaid)||0;
    bucket.remain += Number(r.remain)||0;
  });

  return result;
}

function downPaymentCardsHtml_(rows,scopeLabel){
  const s=downPaymentSummary_(rows);
  let html='';

  const hasEGP=(rows||[]).some(r=>projectCurrency_(r)==='EGP');
  const hasUSD=(rows||[]).some(r=>projectCurrency_(r)==='USD');

  if(hasEGP){
    html+=card('Actual DP EGP',money(s.egp.actualDP),scopeLabel+' • Actual DP');
    html+=card('DP Paid EGP',money(s.egp.dpPaid),scopeLabel+' • DP Paid');
    html+=card('Actual Paid EGP',money(s.egp.actualPaid),scopeLabel+' • Actual Paid');
    html+=card('Remain EGP',money(s.egp.remain),scopeLabel+' • Remaining down payment');
  }

  if(hasUSD){
    html+=card('Actual DP USD',money(s.usd.actualDP),scopeLabel+' • Actual DP');
    html+=card('DP Paid USD',money(s.usd.dpPaid),scopeLabel+' • DP Paid');
    html+=card('Actual Paid USD',money(s.usd.actualPaid),scopeLabel+' • Actual Paid');
    html+=card('Remain USD',money(s.usd.remain),scopeLabel+' • Remaining down payment');
  }

  return html;
}

function initSalesCurveFilters_(){
  const managers=[...new Set(rawRows.map(r=>String(r.salesManager||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const years=[...new Set(rawRows.map(r=>edenCurveYear_(r)).filter(Boolean))].sort((a,b)=>b-a).map(String);
  const dealStatuses=[...new Set(rawRows.map(edenCurveDealStatus_).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const projects=[...new Set(rawRows.map(r=>String(r.project||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const branches=[...new Set(rawRows.map(edenCurveBranch_).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  edenCurveBuildMulti_('curveProjectMulti',projects,'All Projects',()=>{syncSalesCurveSales_();renderSalesCurve_()});
  edenCurveBuildMulti_('curveBranchMulti',branches,'All Branches',()=>renderSalesCurve_());
  edenCurveBuildMulti_('curveManagerMulti',managers,'All Managers',()=>{syncSalesCurveSales_();renderSalesCurve_()});
  edenCurveBuildMulti_('curveYearMulti',years,'All Years',()=>{syncSalesCurveMonths_();renderSalesCurve_()});
  edenCurveBuildMulti_('curveDealStatusMulti',dealStatuses,'All Deals Types',()=>renderSalesCurve_());
  syncSalesCurveSales_();syncSalesCurveMonths_();
}
function syncSalesCurveSales_(){
  const managers=edenCurveMultiValues_('curveManagerMulti');
  const curveProjects=edenCurveMultiValues_('curveProjectMulti');
  const managerMap=salesManagerLookup_();
  const names=[...new Set(
    rawRows
      .filter(r=>!curveProjects.length||curveProjects.includes(String(r.project||'').trim()))
      .flatMap(r=>{
        const out=[];
        const primary=String(r.salesName||'').trim();
        const shared=isShareDeal_(r)?String(r.sharedWith||'').trim():'';
        if(primary && (!managers.length||managers.includes(String(r.salesManager||''))))out.push(primary);
        if(shared){
          const sharedManager=managerMap.get(edenNormName_(shared))||'';
          if(!managers.length||managers.includes(sharedManager))out.push(shared);
        }
        return out;
      })
      .filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b));
  edenCurveBuildMulti_('curveSalesMulti',names,'All Sales',()=>renderSalesCurve_());
}
function syncSalesCurveMonths_(){
  const years=edenCurveMultiValues_('curveYearMulti');
  const nums=[...new Set(rawRows.map(r=>edenCurveDateParts_(r)).filter(p=>p&&(!years.length||years.includes(String(p.year)))).map(p=>p.month))].sort((a,b)=>a-b);
  edenCurveBuildMulti_('curveMonthMulti',nums.map(String),'All Months',()=>renderSalesCurve_());
  document.querySelectorAll('#curveMonthMulti .edenCurveMultiItem').forEach(label=>{const cb=label.querySelector('input'),sp=label.querySelector('span');if(cb&&sp)sp.textContent=edenCurveMonthName_(cb.value)});
  const vals=edenCurveMultiValues_('curveMonthMulti'),btn=document.querySelector('#curveMonthMulti>button');
  if(btn){const txt=!vals.length?'All Months':vals.length===1?edenCurveMonthName_(vals[0]):`${vals.length} selected`;btn.innerHTML=`${escapeHtml(txt)} <b>▾</b>`}
}

function edenCurveNorm_(v){
  return String(v==null?'':v)
    .replace(/\u00a0/g,' ')
    .replace(/[–—−]/g,'-')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}
function edenCurveBranch_(r){
  return String(r?.branch ?? r?.Branch ?? r?.branchName ?? '').trim();
}

function edenSalesCurveScope_(){
  const managers=edenCurveMultiValues_('curveManagerMulti'),
        sales=edenCurveMultiValues_('curveSalesMulti'),
        years=edenCurveMultiValues_('curveYearMulti'),
        months=edenCurveMultiValues_('curveMonthMulti'),
        projects=edenCurveMultiValues_('curveProjectMulti'),
        branches=edenCurveMultiValues_('curveBranchMulti'),
        dealStatuses=edenCurveMultiValues_('curveDealStatusMulti'),
        branchKeys=branches.map(edenCurveNorm_);

  // IMPORTANT: Sales Performance Curve is fully independent from the main dashboard filters.
  // It reads directly from rawRows and only applies its own dedicated filters.
  // Cancel remains excluded by default unless Cancel is explicitly selected in Deals Type.
  const baseRows=dealStatuses.length
    ? rawRows
    : rawRows.filter(r=>String(r.status||'').trim().toLowerCase()!=='cancel');

  const rawScope=baseRows.filter(r=>{
    const p=edenCurveDateParts_(r);
    const y=edenCurveYear_(r);
    return (
      (!years.length||(y&&years.includes(String(y)))) &&
      (!months.length||(p&&months.includes(String(p.month)))) &&
      (!projects.length||projects.includes(String(r.project||'').trim())) &&
      (!branchKeys.length||branchKeys.includes(edenCurveNorm_(edenCurveBranch_(r)))) &&
      (!dealStatuses.length||dealStatuses.includes(edenCurveDealStatus_(r)))
    );
  });

  const credits=salesCreditRows_(rawScope);
  return credits.filter(r=>
    (!managers.length||managers.includes(String(r.salesManager||''))) &&
    (!sales.length||sales.includes(String(r.salesName||'')))
  );
}
function renderSalesCurve_(){
  const canvas=document.getElementById('salesCurveChart'),empty=document.getElementById('salesCurveEmpty');
  if(!canvas||!empty)return;
  if(SALES_CURVE_CHART){SALES_CURVE_CHART.destroy();SALES_CURVE_CHART=null}

  const metric=document.getElementById('curveMetric')?.value||'valueEGP';

  // Base scope = exact independent filters, BEFORE currency metric filtering.
  // This is the authoritative scope for DEAL COUNTS.
  const dealRows=edenSalesCurveScope_();

  // Value scope = only used for EGP/USD monetary calculations and chart values.
  let rows=dealRows.slice();
  if(metric==='valueEGP')rows=rows.filter(r=>projectCurrency_(r)==='EGP');
  if(metric==='valueUSD')rows=rows.filter(r=>projectCurrency_(r)==='USD');

  const managers=edenCurveMultiValues_('curveManagerMulti');
  const chosenSales=edenCurveMultiValues_('curveSalesMulti');

  // Priority:
  // 1) Explicit Sales Employees => compare those employees.
  // 2) No employees + selected managers => compare MANAGERS only, aggregating all employees under each manager.
  // 3) Nothing selected => default Top 8 sales employees.
  let series=[],groupField='salesName';
  if(chosenSales.length){
    series=chosenSales;
    groupField='salesName';
  }else if(managers.length){
    series=managers;
    groupField='salesManager';
  }else{
    series=[...new Set(dealRows.map(r=>String(r.salesName||'').trim()).filter(Boolean))]
      .map(name=>({name,total:(metric==='deals'?dealRows:rows).filter(r=>String(r.salesName||'').trim()===name).reduce((a,r)=>a+(metric==='deals'?Number(r.dealCredit??1):Number(r.amount||0)),0)}))
      .sort((a,b)=>b.total-a.total).slice(0,8).map(x=>x.name);
    groupField='salesName';
  }

  // Live deals count for EACH compared team/person, using the exact same curve scope.
  const summary=document.getElementById('curveSeriesSummary');
  if(summary){
    summary.innerHTML=series.map(name=>{
      const count=dealRows.filter(r=>String(r[groupField]||'').trim()===name).reduce((a,r)=>a+Number(r.dealCredit??1),0);
      return `<div class="edenCurveSeriesStat"><span class="name">${escapeHtml(name)}</span><span class="count">${Number(count).toLocaleString('en-US')}<small>DEALS</small></span></div>`;
    }).join('');
  }

  // Executive pulse for the exact same filtered comparison.
  const exec=document.getElementById('curveExecutiveSummary');
  if(exec){
    const stats=series.map(name=>{
      const valueRows=rows.filter(r=>String(r[groupField]||'').trim()===name);
      const countRows=dealRows.filter(r=>String(r[groupField]||'').trim()===name);
      return {name,deals:countRows.reduce((a,r)=>a+Number(r.dealCredit??1),0),valueDeals:valueRows.reduce((a,r)=>a+Number(r.dealCredit??1),0),value:valueRows.reduce((a,r)=>a+Number(r.amount||0),0)};
    }).sort((a,b)=>b.value-a.value);
    const leader=stats[0]||{name:'—',deals:0,valueDeals:0,value:0};
    const totalDeals=stats.reduce((a,x)=>a+x.deals,0);
    const totalValueDeals=stats.reduce((a,x)=>a+x.valueDeals,0);
    const totalValue=stats.reduce((a,x)=>a+x.value,0);
    const avg=totalValueDeals?totalValue/totalValueDeals:0;
    const currency=metric==='valueUSD'?'USD':metric==='valueEGP'?'EGP':'';
    exec.innerHTML=
      `<div class="edenCurveExecBox edenCurveExecTop"><span>TOP BY VALUE</span><div class="edenCurveTopRow"><strong class="gold">${escapeHtml(leader.name)}</strong>`+
        `<em>${metric==='deals'?Number(leader.deals).toLocaleString('en-US')+' Deals':Number(leader.value).toLocaleString('en-US',{maximumFractionDigits:0})+' '+currency+' · '+Number(leader.valueDeals).toLocaleString('en-US')+' Deals'}</em></div></div>`+
      `<div class="edenCurveExecBox"><span>COMBINED DEALS</span><strong>${Number(totalDeals).toLocaleString('en-US')}</strong></div>`+
      `<div class="edenCurveExecBox"><span>COMBINED VALUE</span><strong>${metric==='deals'?'—':Number(totalValue).toLocaleString('en-US',{maximumFractionDigits:0})+' '+currency}</strong></div>`+
      `<div class="edenCurveExecBox"><span>AVG DEAL VALUE</span><strong>${metric==='deals'?'—':Number(avg).toLocaleString('en-US',{maximumFractionDigits:0})+' '+currency}</strong></div>`;
  }

  // Annual totals + clear year-over-year comparison.
  const yearSummary=document.getElementById('curveYearSummary');
  const yearCompareWrap=document.getElementById('curveYearCompareWrap');
  const yearCompareCanvas=document.getElementById('curveYearCompareChart');
  if(SALES_YEAR_COMPARE_CHART){SALES_YEAR_COMPARE_CHART.destroy();SALES_YEAR_COMPARE_CHART=null}

  const yearMap={};
  dealRows.forEach(r=>{
    const y=edenCurveYear_(r); if(!y)return;
    if(!yearMap[y])yearMap[y]={deals:0,valueDeals:0,value:0};
    yearMap[y].deals+=Number(r.dealCredit??1);
  });
  rows.forEach(r=>{
    const y=edenCurveYear_(r); if(!y)return;
    if(!yearMap[y])yearMap[y]={deals:0,valueDeals:0,value:0};
    yearMap[y].valueDeals+=Number(r.dealCredit??1);
    yearMap[y].value+=Number(r.amount||0);
  });
  const annualYears=Object.keys(yearMap).map(Number).sort((a,b)=>a-b);
  const annualCurrency=metric==='valueUSD'?'USD':'EGP';

  if(yearSummary){

function edenStatusScopeFor_(rows){
  const statuses=getMulti('status');
  return statuses.length ? rows : rows.filter(r=>String(r.status||'').trim().toLowerCase()!=='cancel');
}
function edenPeriodComparison_(){
  const days=getMulti('day'), months=getMulti('month'), years=getMulti('year');
  if(days.length || months.length>1 || years.length>1) return null;

  const scope=edenStatusScopeFor_(edenNonDateScopeRows_());
  const periods=[...new Set(scope.map(r=>{
    const p=trendDateParts_(r); return p&&p.year&&p.month ? p.year*100+p.month : null;
  }).filter(Boolean))].sort((a,b)=>a-b);
  if(!periods.length)return null;

  let currentKey=null;
  if(months.length===1 && years.length===1){
    currentKey=Number(years[0])*100+Number(months[0]);
  }else if(months.length===1){
    const m=Number(months[0]);
    const candidates=periods.filter(k=>k%100===m);
    currentKey=candidates.length?candidates[candidates.length-1]:null;
  }else if(years.length===1){
    const y=Number(years[0]);
    const candidates=periods.filter(k=>Math.floor(k/100)===y);
    currentKey=candidates.length?candidates[candidates.length-1]:null;
  }else{
    currentKey=periods[periods.length-1];
  }
  if(!currentKey)return null;

  let cy=Math.floor(currentKey/100), cm=currentKey%100;
  let py=cm===1?cy-1:cy, pm=cm===1?12:cm-1;
  const previousKey=py*100+pm;

  const rowsFor=k=>scope.filter(r=>{
    const p=trendDateParts_(r);
    return p && p.year*100+p.month===k;
  });
  const current=rowsFor(currentKey), previous=rowsFor(previousKey);
  if(!current.length && !previous.length)return null;

  const label=k=>{
    const y=Math.floor(k/100),m=k%100;
    return new Date(y,m-1,1).toLocaleString('en-US',{month:'short',year:'numeric'});
  };
  return {current,previous,currentLabel:label(currentKey),previousLabel:label(previousKey)};
}
function edenDelta_(current,previous){
  current=Number(current||0); previous=Number(previous||0);
  if(previous===0){
    if(current===0)return {cls:'flat',text:'0.0%'};
    return {cls:'up',text:'NEW'};
  }
  const pct=((current-previous)/Math.abs(previous))*100;
  if(Math.abs(pct)<.05)return {cls:'flat',text:'0.0%'};
  return {cls:pct>0?'up':'down',text:`${pct>0?'+':''}${pct.toFixed(1)}%`};
}
function edenMetricSet_(rows){
  const sumN=(arr,key)=>arr.reduce((a,r)=>a+Number(r?.[key]||0),0);
  const egp=rows.filter(r=>projectCurrency_(r)==='EGP'), usd=rows.filter(r=>projectCurrency_(r)==='USD');
  return {
    deals:rows.length,
    egp:sumN(egp,'amount'),
    usd:sumN(usd,'amount'),
    clients:new Set(rows.map(r=>clientKeyOf(r)).filter(Boolean)).size,
    units:new Set(rows.map(r=>String(r.unitCode||'').trim()).filter(Boolean)).size,
    meters:sumN(rows,'area')
  };
}

function brokerDateValue_(row){
  const raw=row.date||row.transactionDate||row.reservationDate||'';
  if(raw instanceof Date&&!isNaN(raw.getTime()))return raw.getTime();
  const txt=String(raw||'').trim(); if(!txt)return 0;
  const x=txt.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(x){const d=new Date(+x[3],+x[2]-1,+x[1]);if(!isNaN(d.getTime()))return d.getTime()}
  const d=new Date(txt); return isNaN(d.getTime())?0:d.getTime();
}
function brokerTopValue_(rows,key){
  const c={}; rows.forEach(r=>{const v=String(r[key]||'').trim();if(v)c[v]=(c[v]||0)+1});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0]?.[0]||'—';
}
function brokerLastDeal_(rows){
  let best=null,t=0;rows.forEach(r=>{const x=brokerDateValue_(r);if(x>t){t=x;best=r}});
  return best?String(best.date||best.transactionDate||best.reservationDate||'—'):'—';
}

    el.innerHTML=normalized.map(value=>{
      const label=labelFn?String(labelFn(value)):value;

        <input type="checkbox" name="${name}" value="${escapeAttr(value)}" data-label="${escapeAttr(label)}">
        <span>${escapeHtml(label)}</span>
      </label>`;
    }).join('');

    el.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
      cb.checked=selectedBefore.has(String(cb.value));
      cb.addEventListener('change',()=>brokerLiveRenderMode_(mode));

function brokerStatusSort_(values){
  const order=[
    'Reservation','Part of DP','Total DP','In progress','Client Signed',
    'Company Signed','Sold','Delivered','Closed','Cancel'

  return [...values].sort((a,b)=>{
    const ia=order.findIndex(x=>x.toLowerCase()===String(a).toLowerCase());
    const ib=order.findIndex(x=>x.toLowerCase()===String(b).toLowerCase());
    const aa=ia<0?999:ia, bb=ib<0?999:ib;
    return aa-bb || String(a).localeCompare(String(b));
  });
}

function brokerPerformanceRows_(){
  const years=brokerLiveGet_('bpYear');
  const months=brokerLiveGet_('bpMonth');
  const days=brokerLiveGet_('bpDay');
  const projects=brokerLiveGet_('bpProject');
  const companies=brokerLiveGet_('bpCompany');
  const statuses=brokerLiveGet_('bpStatus');
  const salesManagers=brokerLiveGet_('bpSalesManager');
  const sales=brokerLiveGet_('bpSales');
  const managers=brokerLiveGet_('bpManager');

  return (rawRows||[]).filter(r=>
    String(r.brokerageCompany||'').trim() &&
    (!years.length||years.includes(String(r.year||''))) &&
    (!months.length||months.includes(String(r.month||''))) &&
    (!days.length||days.includes(String(r.day||''))) &&
    (!projects.length||projects.includes(String(r.project||''))) &&
    (!companies.length||companies.includes(String(r.brokerageCompany||''))) &&
    (!statuses.length||statuses.includes(String(r.status||''))) &&
    (!salesManagers.length||salesManagers.includes(String(r.salesManager||''))) &&
    (!sales.length||sales.includes(String(r.bcSales||''))) &&
    (!managers.length||managers.includes(String(r.bcManager||'')))
  );
}


function resetBrokerPerformanceFilters_(){
  ['bpProject','bpCompany','bpStatus','bpSalesManager','bpSales','bpManager','bpYear','bpMonth','bpDay']
    .forEach(name=>document.querySelectorAll(`input[name="${name}"]`).forEach(cb=>cb.checked=false));

  document.querySelectorAll('#brokerPerformanceCenter .multiSearchInput').forEach(input=>{
    input.value='';
    const panel=input.closest('.multiPanel');
    panel?.querySelectorAll('.checkRow').forEach(row=>row.classList.remove('edenSearchHidden'));
    const suggestion=input.parentElement?.querySelector('.edenFilterSuggestion');
    if(suggestion)suggestion.hidden=true;
  });

  const metric=document.getElementById('brokerPerfMetric');if(metric)metric.value='valueEGP';
  const sort=document.getElementById('brokerCenterSort');if(sort)sort.value='valueEGP';

  brokerLiveRefreshLabels_('bp');
  renderBrokerPerformanceCenter_();
}


function brokerPerfDateParts_(row){
  if(typeof trendDateParts_==='function'){
    const p=trendDateParts_(row);
    if(p&&p.year&&p.month)return {year:Number(p.year),month:Number(p.month)};
  }
  const y=Number(row?.year)||0;
  const m=Number(row?.month)||0;
  if(y&&m)return {year:y,month:m};
  const raw=String(row?.date||row?.transactionDate||row?.reservationDate||'').trim();
  const x=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(x)return {year:Number(x[3]),month:Number(x[2])};
  const d=new Date(raw);
  return isNaN(d.getTime())?null:{year:d.getFullYear(),month:d.getMonth()+1};
}

function brokerPerfMonthKey_(row){
  const p=brokerPerfDateParts_(row);
  if(!p)return null;
  const key=`${p.year}-${String(p.month).padStart(2,'0')}`;
  const label=new Date(p.year,p.month-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'});
  return {key,label,sort:p.year*100+p.month};
}

function brokerPerfCountRank_(rows,key,limit=10){
  const map={};
  (rows||[]).forEach(r=>{
    const name=String(r?.[key]||'').trim();
    if(name)map[name]=(map[name]||0)+1;
  });
  return Object.entries(map).map(([name,value])=>({name,value}))
    .sort((a,b)=>b.value-a.value||a.name.localeCompare(b.name)).slice(0,limit);
}

function brokerPerfValueRank_(rows,key,currency,limit=10){
  const map={};
  (rows||[]).filter(r=>projectCurrency_(r)===currency).forEach(r=>{
    const name=String(r?.[key]||'').trim();
    if(name)map[name]=(map[name]||0)+Number(r.amount||0);
  });
  return Object.entries(map).map(([name,value])=>({name,value}))
    .sort((a,b)=>b.value-a.value||a.name.localeCompare(b.name)).slice(0,limit);
}

function brokerPerfChartTheme_(){
  const css=getComputedStyle(document.documentElement);
  return {
    text:css.getPropertyValue('--muted').trim()||'#9fb0d4',
    line:css.getPropertyValue('--line').trim()||'#263850'
  };
}

function brokerPerfShowEmpty_(canvasId,emptyId,show){
  document.getElementById(canvasId)?.classList.toggle('hidden',!!show);
  document.getElementById(emptyId)?.classList.toggle('hidden',!show);
}

function brokerPerfBar_(canvasId,emptyId,data,label,{horizontal=false,moneyCurrency='',onClickName=null}={}){
  const canvas=document.getElementById(canvasId);
  if(!canvas||!window.Chart)return;
  if(!data.length){brokerPerfShowEmpty_(canvasId,emptyId,true);return}
  brokerPerfShowEmpty_(canvasId,emptyId,false);
  const theme=brokerPerfChartTheme_();

  const chart=new Chart(canvas,{
    type:'bar',
    data:{labels:data.map(x=>x.name),datasets:[{label,data:data.map(x=>x.value),borderWidth:1,borderRadius:7}]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      indexAxis:horizontal?'y':'x',
      onHover:(evt,elements)=>{
        const target=evt?.native?.target;
        if(target)target.style.cursor=(elements?.length&&typeof onClickName==='function')?'pointer':'default';
      },
      onClick:(evt,elements)=>{
        if(elements?.length&&typeof onClickName==='function'){
          const i=elements[0].index;
          onClickName(data[i]?.name||'');
        }
      },
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>moneyCurrency?`${moneyCurrency} ${money(ctx.raw)}`:`${Number(ctx.raw||0).toLocaleString('en-US')} deals`}}
      },
      scales:{
        x:{beginAtZero:true,grid:{color:theme.line},ticks:{color:theme.text,callback:v=>moneyCurrency?money(v):v}},
        y:{beginAtZero:true,grid:{color:theme.line},ticks:{color:theme.text}}
      }
    }
  });
  BROKER_PERFORMANCE_CHARTS.push(chart);
}


function brokerPerfShare_(rows){
  const canvas=document.getElementById('brokerShareChart');
  if(!canvas||!window.Chart)return;
  const ranked=brokerPerfCountRank_(rows,'brokerageCompany',8);
  if(!ranked.length){brokerPerfShowEmpty_('brokerShareChart','brokerShareEmpty',true);return}
  brokerPerfShowEmpty_('brokerShareChart','brokerShareEmpty',false);
  const total=ranked.reduce((a,x)=>a+x.value,0);

  const chart=new Chart(canvas,{
    type:'doughnut',
    data:{labels:ranked.map(x=>x.name),datasets:[{label:'Deals',data:ranked.map(x=>x.value),borderWidth:1}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      onHover:(evt,elements)=>{
        const target=evt?.native?.target;
        if(target)target.style.cursor=elements?.length?'pointer':'default';
      },
      onClick:(evt,elements)=>{
        if(elements?.length){
          openBrokerCompanyDetails_(ranked[elements[0].index]?.name||'');
        }
      },
      plugins:{
        legend:{position:'bottom',labels:{color:brokerPerfChartTheme_().text,usePointStyle:true,boxWidth:8}},
        tooltip:{callbacks:{label:ctx=>{
          const v=Number(ctx.raw||0),pct=total?v/total*100:0;
          return `${ctx.label}: ${v.toLocaleString('en-US')} deals • ${pct.toFixed(1)}%`;
        }}}
      }
    }
  });
  BROKER_PERFORMANCE_CHARTS.push(chart);
}


function brokerPerfTrend_(rows){
  const canvas=document.getElementById('brokerTrendChart');
  if(!canvas||!window.Chart)return;
  const map={};
  rows.forEach(r=>{
    const p=brokerPerfMonthKey_(r);if(!p)return;
    if(!map[p.key])map[p.key]={...p,value:0};
    map[p.key].value++;
  });
  const data=Object.values(map).sort((a,b)=>a.sort-b.sort);
  if(!data.length){brokerPerfShowEmpty_('brokerTrendChart','brokerTrendEmpty',true);return}
  brokerPerfShowEmpty_('brokerTrendChart','brokerTrendEmpty',false);
  const theme=brokerPerfChartTheme_();
  const chart=new Chart(canvas,{
    type:'line',
    data:{labels:data.map(x=>x.label),datasets:[{label:'Broker Deals',data:data.map(x=>x.value),borderWidth:3,tension:.35,fill:false,pointRadius:4}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${Number(ctx.raw||0).toLocaleString('en-US')} deals`}}},
      scales:{
        x:{grid:{color:theme.line},ticks:{color:theme.text,maxRotation:0,autoSkip:true}},
        y:{beginAtZero:true,grid:{color:theme.line},ticks:{color:theme.text,precision:0}}
      }
    }
  });
  BROKER_PERFORMANCE_CHARTS.push(chart);
}

function brokerPerfMatrix_(rows){
  const canvas=document.getElementById('brokerMatrixChart');
  if(!canvas||!window.Chart)return;

  const topCompanies=brokerPerfCountRank_(rows,'brokerageCompany',6).map(x=>x.name);
  const topProjects=brokerPerfCountRank_(rows,'project',6).map(x=>x.name);
  if(!topCompanies.length||!topProjects.length){
    brokerPerfShowEmpty_('brokerMatrixChart','brokerMatrixEmpty',true);return;
  }
  brokerPerfShowEmpty_('brokerMatrixChart','brokerMatrixEmpty',false);

  const theme=brokerPerfChartTheme_();
  const datasets=topProjects.map(project=>({
    label:project,
    data:topCompanies.map(company=>rows.filter(r=>
      String(r.brokerageCompany||'')===company && String(r.project||'')===project
    ).length),
    borderWidth:1,borderRadius:4
  }));

  const chart=new Chart(canvas,{
    type:'bar',
    data:{labels:topCompanies,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{color:theme.text,usePointStyle:true,boxWidth:8}}},
      scales:{
        x:{stacked:true,grid:{color:theme.line},ticks:{color:theme.text}},
        y:{stacked:true,beginAtZero:true,grid:{color:theme.line},ticks:{color:theme.text,precision:0}}
      }
    }
  });
  BROKER_PERFORMANCE_CHARTS.push(chart);
}

function brokerDateValue_(row){
  const raw=row.date||row.transactionDate||row.reservationDate||'';
  if(raw instanceof Date&&!isNaN(raw.getTime()))return raw.getTime();
  const txt=String(raw||'').trim();if(!txt)return 0;
  const x=txt.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(x){const d=new Date(+x[3],+x[2]-1,+x[1]);if(!isNaN(d.getTime()))return d.getTime()}
  const d=new Date(txt);return isNaN(d.getTime())?0:d.getTime();
}

function brokerTopValue_(rows,key){
  const counts={};
  rows.forEach(r=>{const v=String(r[key]||'').trim();if(v)counts[v]=(counts[v]||0)+1});
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0]?.[0]||'—';
}

function brokerLastDeal_(rows){
  let best=null,bestTime=0;
  rows.forEach(r=>{const t=brokerDateValue_(r);if(t>bestTime){bestTime=t;best=r}});
  return best?String(best.date||best.transactionDate||best.reservationDate||'—'):'—';
}

function renderBrokerPerformanceCenter_(){
  const body=document.getElementById('brokerPerformanceBody');
  if(!body)return;

  brokerPerfInitFilters_();
  destroyBrokerPerformanceCharts_();

  const allRows=brokerPerformanceRows_();
  const salesRows=brokerMetricRows_(allRows,'bpStatus');
  const cancelledRows=allRows.filter(r=>String(r.status||'').trim().toLowerCase()==='cancel');
  const egpRows=salesRows.filter(r=>projectCurrency_(r)==='EGP');
  const usdRows=salesRows.filter(r=>projectCurrency_(r)==='USD');

  const companiesAll=new Set(allRows.map(r=>String(r.brokerageCompany||'').trim()).filter(Boolean));
  const activeCompanies=new Set(salesRows.map(r=>String(r.brokerageCompany||'').trim()).filter(Boolean));
  const egpValue=sum(egpRows,'amount');
  const usdValue=sum(usdRows,'amount');
  const avgEgp=egpRows.length?egpValue/egpRows.length:0;
  const cancelRate=allRows.length?cancelledRows.length/allRows.length*100:0;

  const setText=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};
  setText('brokerKpiCompanies',companiesAll.size.toLocaleString());
  setText('brokerKpiActive',activeCompanies.size.toLocaleString());
  setText('brokerKpiDeals',salesRows.length.toLocaleString());
  setText('brokerKpiEGP',money(egpValue));
  setText('brokerKpiUSD',money(usdValue));
  setText('brokerKpiAvg',money(avgEgp));
  setText('brokerKpiCancel',cancelRate.toFixed(1)+'%');

  // Company table and exports share the exact same aggregation + sorting logic.
  const data=brokerPerformanceCompanyRows_(allRows);

  const empty=document.getElementById('brokerPerformanceEmpty');
  if(!data.length){
    body.innerHTML='';
    empty?.classList.remove('hidden');
  }else{
    empty?.classList.add('hidden');
    body.innerHTML=data.map((x,i)=>`<tr>
      <td><span class="brokerRank">${i+1}</span></td>
      <td><button type="button" class="brokerCompanyLink" data-broker-company="${escapeHtml(x.name)}">${escapeHtml(x.name)}</button></td>
      <td>${x.deals.toLocaleString()}</td>
      <td class="brokerMoney">EGP ${money(x.valueEGP)}</td>
      <td class="brokerMoney">${x.valueUSD?`USD ${money(x.valueUSD)}`:'—'}</td>
      <td>${x.avgEGP?`EGP ${money(x.avgEGP)}`:'—'}</td>
      <td><span class="brokerRate ${x.cancelRate>=25?'bad':x.cancelRate>=10?'warn':'good'}">${x.cancelRate.toFixed(1)}%</span></td>
      <td>${escapeHtml(x.topProject)}</td>
      <td>${escapeHtml(x.topBCSales)}</td>
      <td>${escapeHtml(x.bcManager)}</td>
      <td>${escapeHtml(x.lastDeal)}</td>
    </tr>`).join('');
    body.querySelectorAll('.brokerCompanyLink').forEach(btn=>
      btn.addEventListener('click',()=>brokerQuickFilter_(btn.dataset.brokerCompany||''))
    );
  }

  // Dedicated broker charts — no EGP/USD mixing.
  const metric=document.getElementById('brokerPerfMetric')?.value||'valueEGP';
  let topCompanies=[],metricLabel='',currency='';
  if(metric==='valueUSD'){
    topCompanies=brokerPerfValueRank_(salesRows,'brokerageCompany','USD',10);
    metricLabel='Sales Value USD';currency='USD';
  }else if(metric==='deals'){
    topCompanies=brokerPerfCountRank_(salesRows,'brokerageCompany',10);
    metricLabel='Deals';currency='';
  }else{
    topCompanies=brokerPerfValueRank_(salesRows,'brokerageCompany','EGP',10);
    metricLabel='Sales Value EGP';currency='EGP';
  }

  setText('brokerTopCompaniesTitle',`Top Brokerage Companies — ${metricLabel}`);
  setText('brokerTopCompaniesMeta',topCompanies.length?`${topCompanies.length} companies`:'');
  brokerPerfBar_('brokerTopCompaniesChart','brokerTopCompaniesEmpty',topCompanies,metricLabel,{
    horizontal:true,
    moneyCurrency:currency,
    onClickName:name=>openBrokerCompanyDetails_(name)
  });

  const bcSalesRank=brokerPerfCountRank_(salesRows,'bcSales',10);
  setText('brokerBcSalesMeta',bcSalesRank.length?`${bcSalesRank.length} people`:'');
  brokerPerfBar_('brokerBcSalesChart','brokerBcSalesEmpty',bcSalesRank,'Deals',{
    horizontal:true,
    onClickName:name=>brokerPerformanceSelect_('brokerPerfSales',name)
  });

  const managerRank=brokerPerfCountRank_(salesRows,'bcManager',10);
  setText('brokerManagersMeta',managerRank.length?`${managerRank.length} managers`:'');
  brokerPerfBar_('brokerManagersChart','brokerManagersEmpty',managerRank,'Deals',{
    horizontal:true,
    onClickName:name=>brokerPerformanceSelect_('brokerPerfManager',name)
  });

  const projectRank=brokerPerfCountRank_(salesRows,'project',10);
  setText('brokerProjectMeta',projectRank.length?`${projectRank.length} projects`:'');
  brokerPerfBar_('brokerProjectChart','brokerProjectEmpty',projectRank,'Deals',{
    horizontal:true,
    onClickName:name=>brokerPerformanceSelect_('brokerPerfProject',name)
  });

  setText('brokerShareMeta',salesRows.length?`${salesRows.length.toLocaleString()} deals`:'');
  brokerPerfShare_(salesRows);

  setText('brokerTrendMeta',salesRows.length?`${salesRows.length.toLocaleString()} deals`:'');
  brokerPerfTrend_(salesRows);

  setText('brokerMatrixMeta',salesRows.length?'Top 6 companies × Top 6 projects':'');
  brokerPerfMatrix_(salesRows);
}


function brokerPerformanceSelect_(filterKey,value){
  const map={
    brokerPerfProject:'bpProject',
    brokerPerfCompany:'bpCompany',
    brokerPerfSales:'bpSales',
    brokerPerfManager:'bpManager',
    brokerPerfSalesManager:'bpSalesManager'
  };
  const name=map[filterKey]||filterKey;
  document.querySelectorAll(`input[name="${name}"]`).forEach(cb=>{
    cb.checked=String(cb.value)===String(value);
  });
  brokerLiveRenderMode_('bp');
}

  const brokerageCanvas_=document.getElementById('brokerageCompanyChart');

function edenRankRows_(rows,key,metric,limit){
  const grouped={};
  (rows||[]).forEach(r=>{
    const name=String(r?.[key]??'').trim()||'Unknown';
    if(!grouped[name]) grouped[name]=0;
    if(metric==='count') grouped[name]+=1;
    else grouped[name]+=Number(r?.[metric]||0);
  });
  return Object.entries(grouped)
    .map(([name,value])=>({name,value:Number(value||0)}))
    .filter(x=>Number.isFinite(x.value)&&x.value>0)
    .sort((a,b)=>b.value-a.value)
    .slice(0,limit||10);
}

function edenCompact_(v){
  const n=Number(v||0);
  if(Math.abs(n)>=1e9)return (n/1e9).toFixed(n>=1e10?0:1)+'B';
  if(Math.abs(n)>=1e6)return (n/1e6).toFixed(n>=1e7?0:1)+'M';
  if(Math.abs(n)>=1e3)return (n/1e3).toFixed(n>=1e4?0:1)+'K';
  return Math.round(n).toLocaleString('en-US');
}

/* Per salesperson: own deals at full value + 50% of shared deals, by currency. */
function topSalesNetRank_(rows,limit){
  const m={};
  salesCreditRows_(rows).forEach(r=>{
    const name=String(r.salesName||'Not Assigned');
    const x=m[name]||(m[name]={name,EGP:0,USD:0,own:{EGP:0,USD:0},share:{EGP:0,USD:0},deals:0,solo:0,shared:0});
    const cur=projectCurrency_(r),amt=Number(r.amount)||0;
    x[cur]+=amt;
    if(Number(r.dealCredit??1)<1){x.share[cur]+=amt;x.shared++;}else{x.own[cur]+=amt;x.solo++;}
    x.deals++;
  });
  const list=Object.values(m);
  const hasEGP=list.some(x=>x.EGP),hasUSD=list.some(x=>x.USD);
  const cur=!hasEGP&&hasUSD?'USD':'EGP',other=cur==='EGP'?'USD':'EGP';
  const out=list.sort((a,b)=>(b[cur]-a[cur])||(b[other]-a[other])||(b.deals-a.deals)).slice(0,limit||10);
  out.cur=cur;
  return out;
}

  }
  if(currentView==='sales'){
    rows=groupRows('salesName');cols=['name','deals','valueEGP','valueUSD','meters','units','projectsCount','branchesCount'];title='Sales Summary'
  }
  if(currentView==='branches'){

    cols=cols.filter(c=>!['renovationStatus','unitCategory','currency'].includes(c));
